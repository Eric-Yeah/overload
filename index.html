/* Suche: großes Fenster mit Schnell-Hinzufügen (+) für Häufiges, Gestern, Gerichte und eigene Lebensmittel */
let fq = {slot: 'snack', q: '', list: [], added: 0};
const mealItem = (m, n) => m.per ? {name: m.name, ...m.per, pg: m.g, pl: 'zuletzt', qg: m.g, cnt: n} : {name: m.name, fixed: {kcal: m.kcal, p: m.p, c: m.c, f: m.f}, mi: m.mi, q: m.q, cnt: n};
function recentFoods() {
  const seen = new Set(), out = [];
  for (let i = db.meals.length - 1; i >= 0 && out.length < 8; i--) {
    const m = db.meals[i];
    if (!m.per || seen.has(norm(m.name))) continue;
    seen.add(norm(m.name));
    out.push(mealItem(m));
  }
  return out;
}
/* Häufig gegessen in den letzten 60 Tagen: Anzahl, gleiche Mahlzeit zählt mehr, die letzten 3 Tage bekommen einen Bonus */
function frequentFoods(slot) {
  const since = addDays(Date.now(), -60), recent = addDays(Date.now(), -3), map = new Map();
  db.meals.forEach(m => {
    if (m.date < since) return;
    const key = norm(m.name);
    let e = map.get(key);
    if (!e) map.set(key, e = {n: 0, sn: 0, last: 0, m});
    e.n++; if (m.slot === slot) e.sn++;
    if (m.date >= e.last) { e.last = m.date; e.m = m; }
  });
  const score = e => e.n + e.sn * 0.7 + (e.last >= recent ? 2 : 0);
  return [...map.values()].sort((a, b) => score(b) - score(a)).slice(0, 15).map(e => mealItem(e.m, e.n));
}
function yesterdayFoods(slot) {
  const k = dateKey(addDays(foodDay ? keyToTs(foodDay) : Date.now(), -1));

}
/* Werte pro 100 g aus Zutaten [{name, g, per}], mit Mikros und Qualität (kalorien-gewichtet), wo bekannt */
function aggPer(items) {
  let g = 0, k = 0, p = 0, c = 0, f = 0, qk = 0, qs = 0, mg = 0;
  const mi = Object.fromEntries(MK.map(x => [x, 0]));
  items.forEach(it => {
    const per = it.per || foodByName(it.name), m = (per && per.m) || (foodByName(it.name) || {}).m, q = per && per.q != null ? per.q : (foodByName(it.name) || {}).q;
    if (!per) return;
    const x = it.g / 100; g += it.g; k += per.k * x; p += per.p * x; c += per.c * x; f += per.f * x;
    if (m) { MK.forEach(key => mi[key] += (m[key] || 0) * x); mg += it.g; }
    qs += (q != null ? q : 1) * per.k * x; qk += per.k * x;
  });
  const y = v => g ? v / g * 100 : 0;
  return {g, k: y(k), p: y(p), c: y(c), f: y(f), ...(mg >= g * 0.6 && g ? {m: Object.fromEntries(MK.map(key => [key, mi[key] / mg * 100])), q: qk ? Math.round(qs / qk * 10) / 10 : 1} : {})};
}
function dishItem(d) {

  return {name: d.name, k: A2.k, p: A2.p, c: A2.c, f: A2.f, ...(A2.m ? {m: A2.m, q: A2.q} : {}), pg: Math.round(T.g / d.por), pl: '1 Portion', qg: Math.round(T.g / d.por), dish: d.id};
}

function foodResults() {
  const q = norm(fq.q).trim(), own = db.foods.map(f => ({...f, own: true, qg: f.pg || 100})), dishes = db.dishes.map(dishItem);

    h += `<div class="sec-row res-lbl"><p class="lbl">${title}</p>${tools}</div><div class="group">${arr.map(f => foodRow(f, list.push(f) - 1)).join('')}</div>`;
  };

    + `<div class="group mt"><label class="row"><span class="plus-ic">${ICON.camera}</span><input class="bc-photo" type="file" accept="image/*" hidden><span class="t"><b>Foto vom Barcode</b><span>Falls die Live-Kamera nicht klappt</span></span></label></div>`);
  startScan();
}
const scanMsg = t => { const el = $('#scanMsg'); if (el) el.textContent = t; };
async function startScan() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { scanMsg('Live-Kamera nicht verfügbar. Mach ein Foto vom Barcode oder tipp die Nummer ein.'); return; }
  const me = scan = {hits: {}, timer: null, stream: null, det: null};
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}});
    const vid = $('#scanVid');
    if (scan !== me || !vid) { stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    try { if ('BarcodeDetector' in window) me.det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a']}); } catch (e) {}
    vid.srcObject = stream;
    await vid.play().catch(() => {});
    scanMsg('Halte den Barcode waagerecht in den Rahmen.');
    scanTick(me);
  } catch (e) {
    if (scan === me) scan = null;
    scanMsg(e && e.name === 'NotAllowedError' ? 'Kein Zugriff auf die Kamera. Erlaub ihn in den Einstellungen, mach ein Foto oder tipp die Nummer ein.' : 'Kamera konnte nicht gestartet werden. Mach ein Foto oder tipp die Nummer ein.');
  }
}
const scanCv = document.createElement('canvas');
async function scanTick(me) {
  if (scan !== me) return;
  const vid = $('#scanVid');
  if (!vid) { stopScan(); return; }
  let code = null;
  if (vid.readyState >= 2 && vid.videoWidth) {
    if (me.det) { try { const r = await me.det.detect(vid); if (r[0]) code = r[0].rawValue; } catch (e) { me.det = null; } }
    if (!code) {
      // mittleres Band des Bildes, auf höchstens 1000 px Breite verkleinert
      const vw = vid.videoWidth, vh = vid.videoHeight, s = Math.min(1, 1000 / vw), w = Math.round(vw * s), h = Math.round(vh * 0.4 * s);
      scanCv.width = w; scanCv.height = h;
      const ctx = scanCv.getContext('2d', {willReadFrequently: true});
      ctx.drawImage(vid, 0, vh * 0.3, vw, vh * 0.4, 0, 0, w, h);
      const c = bcScan(grayOf(ctx, w, h), w, h, 11, false);
      if (c) { me.hits[c] = (me.hits[c] || 0) + 1; if (me.hits[c] >= 2) code = c; }
    }
  }
  if (scan !== me) return;
  if (code) { stopScan(); lookupBarcode(code); return; }
  me.timer = setTimeout(() => scanTick(me), 90);
}
async function onBarcodePhoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  scanMsg('Foto wird ausgewertet …');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    let code = null;
    for (const max of [1400, 900]) {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      scanCv.width = w; scanCv.height = h;
      const ctx = scanCv.getContext('2d', {willReadFrequently: true});
      ctx.drawImage(img, 0, 0, w, h);
      code = bcScan(grayOf(ctx, w, h), w, h, 41, true);
      if (code) break;
    }
    if (code) { stopScan(); lookupBarcode(code); }
    else { scanMsg('Kein Barcode erkannt. Foto möglichst gerade und scharf, oder Nummer eintippen.'); toast('Kein Barcode erkannt'); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Foto konnte nicht gelesen werden'); };
  img.src = url;
}

/* Produkt zum Barcode: erst eigene Lebensmittel, dann Open Food Facts */
function offFood(j, code) {
  const p = j && j.status === 1 && j.product;
  if (!p) return null;
  const n = p.nutriments || {}, name = String(p.product_name_de || p.product_name || '').trim(), brand = String(p.brands || '').split(',')[0].trim();
  let k = n['energy-kcal_100g'];
  if (k == null && n.energy_100g != null) k = n.energy_100g / 4.184;
  const full = (name || brand || 'Produkt') + (brand && name && !norm(name).includes(norm(brand)) ? ` (${brand})` : '');
  if (k == null || isNaN(+k)) return {partial: true, name: full.slice(0, 80)};
  const r1 = v => Math.max(0, Math.round((+v || 0) * 10) / 10), sq = +p.serving_quantity;
  const pg = sq > 0 && sq < 2000 ? Math.round(sq) : null;
  const P0 = r1(n.proteins_100g), C0 = r1(n.carbohydrates_100g), F0 = r1(n.fat_100g), mgv = v => v == null ? 0 : Math.round(+v * 1000), salt = n.salt_100g != null ? r1(n.salt_100g) : n.sodium_100g != null ? r1(n.sodium_100g * 2.5) : 0;
  const m = {wa: Math.max(0, Math.round(100 - P0 - C0 - F0 - (+n.fiber_100g || 0) - salt - 1)), fib: r1(n.fiber_100g), sug: r1(n.sugars_100g), sfa: r1(n['saturated-fat_100g']), salt, k: mgv(n.potassium_100g), mg: mgv(n.magnesium_100g), ca: mgv(n.calcium_100g), fe: Math.round((+n.iron_100g || 0) * 10000) / 10, vc: mgv(n['vitamin-c_100g'])};
  const q = p.nova_group ? (+p.nova_group === 1 ? 2 : +p.nova_group === 4 ? 0 : 1) : 1;
  return {id: uid(), name: full.slice(0, 80), k: Math.round(+k), p: P0, c: C0, f: F0, m, q, pg, pl: pg ? '1 Portion' : null, code, src: 'off'};
}
async function lookupBarcode(raw) {
  const code = String(raw || '').replace(/\D/g, '');
  if (code.length < 8 || code.length > 14) { toast('Barcode hat 8 bis 13 Ziffern'); return; }
  const same = c => c && (c === code || c.replace(/^0+/, '') === code.replace(/^0+/, ''));
  const own = db.foods.find(f => same(f.code));
  if (own) { openAmount(own, fq.slot); return; }
  const token = bcToken = {};
  openSheet(`<div class="sheet-h"><button class="btn-text" data-act="closeSheet">Abbrechen</button><h2>Barcode</h2><span></span></div>`
    + `<p class="scan-status">Suche Produkt<i class="dots"><i></i><i></i><i></i></i></p><p class="hint center">${esc(code)}</p>`);
  let res = null, failed = false;
  try {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 12000);
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity,nova_group`, {signal: ac.signal});
    clearTimeout(to);
    if (r.status === 404) res = null;
    else if (!r.ok) failed = true;
    else res = offFood(await r.json(), code);
  } catch (e) { failed = true; }
  if (bcToken !== token) return;
  bcToken = null;
  if (res && !res.partial) { db.foods.push(res); saveDB(); openAmount(res, fq.slot); toast('Produkt gefunden'); return; }
  openNewFood({code, name: res && res.partial ? res.name : '', note: failed
    ? 'Keine Verbindung zur Produktdatenbank. Trag die Werte von der Verpackung ein, beim nächsten Scan kennt die App das Produkt.'
    : res ? 'Zu diesem Produkt fehlen die Nährwerte. Trag sie von der Verpackung ein, beim nächsten Scan kennt die App es.'
    : 'Produkt nicht gefunden. Trag die Werte von der Verpackung ein, beim nächsten Scan kennt die App es.'});
}

const OB_GOALS = [['cut', 'Abnehmen', 'Fett verlieren, Muskeln behalten'], ['hold', 'Gewicht halten', 'In Form bleiben, Leistung verbessern'], ['bulk', 'Zunehmen', 'Muskeln aufbauen']];
const OB_PACE = {
  cut: [[0.25, 'Entspannt', 'ca. 0,25 kg pro Woche weniger'], [0.5, 'Empfohlen', 'ca. 0,5 kg pro Woche weniger'], [0.75, 'Ehrgeizig', 'ca. 0,75 kg pro Woche weniger']],
  bulk: [[0.1, 'Sauber', 'ca. 0,1 kg pro Woche mehr, kaum Fett'], [0.25, 'Empfohlen', 'ca. 0,25 kg pro Woche mehr'], [0.5, 'Schnell', 'ca. 0,5 kg pro Woche mehr']],
};
// Grundumsatz × PAL (Alltag) + Zuschlag fürs Training. PAL-Werte nach den DGE-Referenzwerten: sitzend 1,4–1,5, zeitweise gehend 1,6–1,7,
// überwiegend gehend und stehend 1,8–1,9, körperlich schwer 2,0–2,4; Sport 4–5 × pro Woche etwa +0,3.
const OB_DAILY = [['sit', 'Überwiegend sitzend', 'Schule, Studium, Büro, wenig Wege zu Fuß', 1.45], ['light', 'Leicht aktiv', 'Viel zu Fuß oder mit dem Rad unterwegs', 1.6], ['active', 'Aktiv', 'Viel im Stehen und Gehen, z. B. Verkauf, Pflege', 1.8], ['very', 'Sehr aktiv', 'Körperliche Arbeit, z. B. Bau, Handwerk', 2.0]];
const OB_TRAIN = [[0, 'Gar nicht', 0], [1, '1–2 Mal', 0.125], [2, '3–4 Mal', 0.25], [3, '5–6 Mal', 0.35], [4, 'Täglich oder öfter', 0.45]];
const obSteps = a => ['intro', 'goal', 'sex', 'body', ...(a.goal !== 'hold' ? ['pace'] : []), 'daily', 'train', 'result'];

function calcNutrition(a) {
  const bmr = 10 * a.weight + 6.25 * a.height - 5 * a.age + (a.sex === 'm' ? 5 : -161);
  const pal = Math.min(2.4, OB_DAILY.find(d => d[0] === a.daily)[3] + OB_TRAIN.find(t => t[0] === a.train)[2]);
  const tdee = bmr * pal, adj = a.goal === 'cut' ? -a.pace * 1100 : a.goal === 'bulk' ? a.pace * 1100 : 0;
  const floor = a.sex === 'm' ? 1500 : 1200, raw = tdee + adj;
  const kcal = Math.round(Math.max(floor, raw) / 10) * 10;
  const refW = Math.min(a.weight, 27 * (a.height / 100) ** 2);
  const p = Math.round(refW * (a.goal === 'cut' ? 2 : 1.8));
  const f = Math.max(Math.round(kcal * 0.25 / 9), Math.round(refW * 0.8));
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return {bmr: Math.round(bmr), tdee: Math.round(tdee / 10) * 10, adj: Math.round(adj / 10) * 10, kcal, p, c, f, floored: raw < floor};
}

/* ---------- Freischalten (Laufen, Kalorien) ----------
   Nur eine einfache Sperre: Die Seite ist öffentlich, deshalb steht hier kein Klartext, sondern ein Hash. */
/* Die Passwörter stehen nur noch (bcrypt) auf dem Server, geprüft über ovl_unlock mit Versuchs-Limit (supabase-update-5.sql). */
function pwHash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
let unlockThen = null, unlockKind = 'run';
function openUnlock(kind, then) {

/* ---------- Entlastungswoche (Deload) im Gym ----------
   Erkennung: mindestens 4 Wochen Training, bei mindestens 3 Übungen (und der Hälfte der geprüften) kein Fortschritt über die letzten
   3 Einheiten (bestes geschätztes 1RM). Während der Woche: Vorschläge 10 % leichter, ein Satz weniger; diese Trainings zählen
   nicht für die Steigerungslogik (history() überspringt sie). settings.deload = {until, last, snooze}. */

  const dl = db.settings.deload, now = Date.now();
  if (db.settings.pause || comebackActive() || deloadActive() || (dl.snooze && now < dl.snooze) || (dl.last && now - dl.last < 42 * DAY)) return null;
  const S = db.sessions.filter(s => !s.deload && !s.demo);
  if (S.length < 8 || now - S[0].date < 28 * DAY) return null;
  const recent = new Set(S.filter(s => s.date > now - 14 * DAY).flatMap(s => s.entries.map(e => e.exId)));
  const flat = [];
  let checked = 0;
  recent.forEach(id => {
    const h = S.filter(s => s.entries.some(e => e.exId === id && e.sets.length)).slice(-3).map(s => Math.max(...s.entries.find(e => e.exId === id).sets.map(e1rm)));
    if (h.length < 3 || !(h[0] > 0)) return;
    checked++;
    if (h[2] <= Math.max(h[0], h[1]) * 1.005) flat.push(db.exercises[id]?.name || 'Übung');

}

  const dl = db.settings.deload;
  if (deloadActive()) return `<section class="notice k-hold dl-card"><b>Entlastungswoche bis ${esc(longDate(dl.until - DAY))}</b><p>Die Vorschläge sind 10 % leichter und mit einem Satz weniger. Danach geht es mit deinen normalen Gewichten weiter, meist stärker als vorher.</p><button class="btn-chip" data-act="deloadEnd">Vorzeitig beenden</button></section>`;
  const flat = deloadCheck();

/* ---------- Rekorde und Abzeichen ---------- */
function gymRecords() {
  const best = {};
  db.sessions.forEach(s => { if (s.deload || s.demo) return; s.entries.forEach(e => e.sets.forEach(x => {
    if (!(x.w > 0)) return;
    const b = best[e.exId] || (best[e.exId] = {w: 0, wr: 0, e: 0, date: 0});
    if (x.w > b.w || (x.w === b.w && x.r > b.wr)) Object.assign(b, {w: x.w, wr: x.r, date: s.date});
    b.e = Math.max(b.e, e1rm(x));
  })); });
  return Object.entries(best).filter(([id]) => db.exercises[id]).map(([id, b]) => ({id, name: db.exercises[id].name, ...b})).sort((a, b) => byName(a, b));
}

/* Automatisch aktualisieren: Die Web-App auf dem Home-Bildschirm hält die alte Seite oft im Speicher bzw. Cache (GitHub: 10 min).

let updT = 0;

async function checkUpdate() {
  if (!/^https?:$/.test(location.protocol) || Date.now() - updT < 120e3 || !navigator.onLine) return;

    const t = await (await fetch(url, {cache: 'no-store'})).text(), m = t.match(/const APP_VERSION = '([\d.]+)'/);
    if (!m || !verNewer(m[1], APP_VERSION) || syncBusyUI()) { if (m && verNewer(m[1], APP_VERSION)) updT = 0; return; }

    try { tried = JSON.parse(localStorage.getItem('ovl-upd') || 'null'); } catch (e) {}
    if (tried && tried.v === m[1] && Date.now() - tried.at < 10 * 60e3) return;
    try { localStorage.setItem('ovl-upd', JSON.stringify({v: m[1], at: Date.now()})); } catch (e) {}
    await fetch(url, {cache: 'reload'}).catch(() => {});

}

/* ---------- Dauer eines Trainings schätzen ----------
   Pro Satz 45 s Arbeit, pro Übung 1 min Umbau, dazu die Pausen nach Timer-Einstellung (ohne Timer 90 s zwischen den Sätzen).
   Gibt es schon mindestens 2 Trainings mit dieser Vorlage, fließt dein echtes Tempo (Minuten pro Satz) zur Hälfte ein. */

  let m = (nS * 45 + nEx * 60 + pause) / 60;
  const past = db.sessions.filter(s => !s.demo && s.end && (tid ? s.templateId === tid : true) && sessSets(s)).slice(-5)
    .map(s => (s.end - s.date) / 60000 / sessSets(s)).filter(x => x > 0.5 && x < 8);
  if (tid && past.length >= 2) { past.sort((a, b) => a - b); m = m * 0.5 + past[Math.floor(past.length / 2)] * nS * 0.5; }

    if (+set.z2lo >= 90 && +set.z2lo <= 190) S.z2lo = Math.round(+set.z2lo);

    return [...row('Kalorien', 'kcal', db.settings.kcalGoal, 'kcal'), ...row('Protein', 'p', mg.p, 'g'), ...row('Kohlenhydrate', 'c', mg.c, 'g'), ...row('Fett', 'f', mg.f, 'g'), ...row('Wasser', 'water', db.settings.waterGoal, 'ml')];

}
function propCard(p, i) {

      : `<button class="btn-primary" data-act="propApply" data-m="${i}">Übernehmen</button>`) + `</div>`;

/* Halbmarathon-Plan Version 2 (05.10.2026): Eine gespeicherte Kopie (nach Coach-Änderungen) bekommt die neuen Wochen nur dort,
   wo sie noch genau dem alten Plan entspricht und die Woche noch nicht begonnen hat. Eigene Änderungen bleiben erhalten. */
function legacyPlanV2() {
  const p = db.runPlan;
  if (!p || !p.legacy || !Array.isArray(p.weeks) || p.planV >= 2) return;
  const wi = planWeekIndex(LEGACY_PLAN, Date.now());
  p.weeks = p.weeks.map((w, i) => i > wi && PLAN_V1[i] && JSON.stringify(w) === JSON.stringify(PLAN_V1[i]) ? JSON.parse(JSON.stringify(PLAN[i])) : w);
  p.planV = 2; saveDB();
}
function planForEdit(kind) {
  if (kind === 'tri') return db.triPlan;
  const p = db.runPlan;
  if (p && p.legacy && !Array.isArray(p.weeks)) p.weeks = JSON.parse(JSON.stringify(PLAN));
  return p;
}
function applyProp(p) {
  if (p.kind === 'food') {
    const undo = {kind: 'food', data: JSON.stringify({k: db.settings.kcalGoal, m: db.settings.macroGoal, w: db.settings.waterGoal})}, G = p.goals;
    if (G.kcal) db.settings.kcalGoal = G.kcal;
    if (G.p || G.c || G.f) db.settings.macroGoal = Object.assign({p: 0, c: 0, f: 0}, db.settings.macroGoal || {}, ...['p', 'c', 'f'].filter(k => G[k]).map(k => ({[k]: G[k]})));
    if (G.water) db.settings.waterGoal = G.water;
    return undo;
  }
  const P = planForEdit(p.kind), undo = {kind: p.kind, data: JSON.stringify({weeks: P.weeks, run: db.run, tri: p.kind === 'tri' ? db.tri.map(r => [r.id, r.slot]) : null})};
  const old = JSON.parse(JSON.stringify(P.weeks)), touched = new Set();
  p.list.forEach(c => {
    const W = P.weeks[c.i], k = c.mt ? W.s.findIndex(s => s.dow === c.dow && s.type === c.mt) : -1;
    touched.add(c.i);
    if (c.op === 'remove') { if (k >= 0) W.s.splice(k, 1); }
    else if (c.op === 'set' && k >= 0) Object.assign(W.s[k], {type: c.type, min: c.min, text: c.text});
    else W.s.push({dow: c.dow, type: c.type, text: c.text, min: c.min});
    const ord = {swim: 0, run: 1, bike: 2, brick: 3};
    W.s.sort((x, y) => x.dow - y.dow || (ord[x.type] ?? 0) - (ord[y.type] ?? 0));
  });
  if (p.kind === 'tri') touched.forEach(i => db.tri.forEach(r => {   // Einträge der geänderten Wochen neu zuordnen
    const x = triSlotSession(r.slot);
    if (!x || x.i !== i) return;
    const o = old[i].s[x.k], k = o ? P.weeks[i].s.findIndex(s => s.dow === o.dow && s.type === o.type) : -1;
    r.slot = k >= 0 ? triSlot(P, i, k) : null;
  }));
  if (p.kind === 'run') Object.assign(db.run, p.set);
  return undo;
}
function undoProp(u) {
  const d = JSON.parse(u.data);
  if (u.kind === 'food') { db.settings.kcalGoal = d.k; db.settings.macroGoal = d.m; db.settings.waterGoal = d.w; return; }
  const P = planForEdit(u.kind);
  P.weeks = d.weeks;
  if (u.kind === 'run') db.run = d.run;
  if (d.tri) { const m = new Map(d.tri); db.tri.forEach(r => { if (m.has(r.id)) r.slot = m.get(r.id); }); }
}

const APP_FEATURES = 'Overload ist eine deutsche Web-App für iPhone (Home-Bildschirm) mit: Gym-Tracker (Vorlagen, Double Progression, Pausen-Timer, Entlastungswochen, Rekorde, KI-Coach für den Plan, Spindnummer, Dauer-Schätzung, Notizen), Laufplan mit Fragebogen und Lauf-Coach, Triathlon-Plan, Ernährung (Suche, Barcode, Foto- und Text-Erkennung per KI, Mikros, Essens-Score, Rezepte, eigene Gerichte, Ernährungs-Coach), Gewicht, Wasser, Schlaf, Wochenbericht, Startseite „Heute“, Geräte-Sync, Backups, Erscheinungsbild. Kein Konto, Daten lokal, kleiner Freundeskreis als Nutzer.';
async function ideasLoad() {

const ideasIn = ws => (ideas.list || []).filter(x => { const t = new Date(x.at).getTime(); return t >= ws && t < addDays(ws, 7); });
async function makeIdeaWeek(k) {
  if (ideas.busy || !aiReady()) return;

    const devs = adm.list ? `${adm.list.length} Geräte, davon ${adm.list.filter(d => Date.now() - new Date(d.last_seen).getTime() < 7 * DAY).length} in den letzten 7 Tagen aktiv.` : '';
    const prompt = `Woche vom ${longDate(ws)} bis ${longDate(addDays(ws, 6))}.\n\nIdeen und Feedback der Nutzer in dieser Woche:\n${inbox.length ? inbox.map(x => `- ${x.name || 'Ohne Namen'}: ${x.text}`).join('\n') : '- keine'}\n\n${devs}\nSo hat der Entwickler die App selbst genutzt:\n${weekSummary(ws).text}\n\n`
      + 'Fasse das Feedback kurz zusammen und schlag 3 bis 5 konkrete neue Funktionen oder Verbesserungen für die App vor. Greif Nutzer-Ideen auf, wenn sie Sinn ergeben, und ergänze eigene. Je Idee: kurzer Titel, 1 bis 2 Sätze warum und wie, Aufwand klein, mittel oder groß. '
      + 'Antworte nur mit JSON: {"summary": "2 bis 3 Sätze zum Feedback der Woche", "ideas": [{"title": "…", "text": "…", "effort": "klein"}]}';
    const {out} = await aiFetch([{role: 'system', content: 'Du bist Produktberater für kleine Fitness-Apps. Du schreibst Deutsch, knapp und konkret. ' + APP_FEATURES}, {role: 'user', content: prompt}], 'coach', {temperature: 0.7, max: 3000, timeout: 60000});

  db.settings.tutorialDone = true; db.settings.seenVersion = APP_VERSION; saveDB();
  tour = {i: -1, list: TOUR.filter(s => !s.need || s.need())};
  tourGo(1);
}
function tourEl(s) { return [...document.querySelectorAll(s.sel)].find(el => el.getClientRects().length) || null; }
function tourGo(d) {
  if (!tour) return;
  let i = Math.max(0, tour.i + d);
  for (;;) {
    if (i >= tour.list.length) { tourEnd(); return; }
    const s = tour.list[i];
    if (view !== s.v) go(s.v);
    if (tourEl(s)) break;
    tour.list.splice(i, 1);   // Element gibt es gerade nicht: Schritt ganz weglassen, damit „x von y“ stimmt
    if (d < 0) i = Math.max(0, i - 1);
  }
  tour.i = i;
  const el = tourEl(tour.list[i]);
  if (!el.closest('#tabbar')) el.scrollIntoView({block: 'center', behavior: 'instant'});
  tourPlace();
}
function tourPlace() {
  if (!tour) return;
  const s = tour.list[tour.i], el = s && tourEl(s);
  let o = $('#tour');
  if (!o) { o = document.createElement('div'); o.id = 'tour'; o.className = 'tour'; document.body.appendChild(o); }
  if (!el) return;
  const r = el.getBoundingClientRect(), pad = 6, H = window.innerHeight, below = r.top + r.height / 2 < H * 0.55;
  const n = tour.list.length, k = tour.i + 1;
  o.innerHTML = `<div class="tour-hole" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>`
    + `<div class="tour-tip" style="${below ? `top:${Math.min(r.bottom + 14, H - 220)}px` : `bottom:${Math.max(H - r.top + 14, 16)}px`}"><p class="tour-n">${k} von ${n}</p><b>${esc(s.t)}</b><p>${esc(s.x)}</p>`
    + `<div class="tour-nav"><button class="btn-text" data-act="tourEnd">Beenden</button><span></span>${k > 1 ? '<button class="btn-chip" data-act="tourPrev">Zurück</button>' : ''}<button class="btn-chip on" data-act="tourNext">${k === n ? 'Fertig' : 'Weiter'}</button></div></div>`;
}
function tourEnd() { tour = null; $('#tour')?.remove(); go('today'); }

/* ---------- Name (Pflicht) mit Prüfung ----------
   Jedes Gerät braucht einen Namen, damit der Admin sieht, wer die App nutzt. Geprüft wird in drei Stufen:
   erlaubte Zeichen, ein Wortfilter (gleiche Liste wie ovl_bad_name auf dem Server) und, wenn möglich, die KI.
   Ohne Internet oder KI reicht der Wortfilter; die KI-Prüfung wird später still nachgeholt (devInfo().nameOk). */
const NAME_BAD = /(arschloch|wichser|wixxer|wixer|hurensohn|hure|fotze|schlampe|nutte|missgeburt|spast|schwuchtel|kanake|neger|nigger|nigga|zigeuner|hitler|nazi|sieg ?heil|fick|fuck|shit|bitch|cunt|whore|slut|retard|faggot|kike|chink|penis|vagina|porn|vergewalt|rape|bastard|idiot|behindert|kinderf|pedo|pädo)/;
const NAME_BAD_WORD = /(^|[^a-zäöüß])(sex|ss|kkk|cock|fag|anal|heil|88|wtf)([^a-zäöüß]|$)/;
const nameNorm = n => String(n || '').toLowerCase().replace(/[013457@$!|]/g, c => ({0: 'o', 1: 'i', 3: 'e', 4: 'a', 5: 's', 7: 't', '@': 'a', $: 's', '!': 'i', '|': 'l'}[c]));
function nameProblem(n) {
  n = String(n || '').trim().replace(/\s+/g, ' ');
  if (n.length < 2) return 'Bitte gib mindestens 2 Zeichen ein.';
  if (n.length > 24) return 'Höchstens 24 Zeichen.';
  if (!/^[\p{L}][\p{L} .'\-]*$/u.test(n) || (n.match(/\p{L}/gu) || []).length < 2) return 'Nur Buchstaben, Leerzeichen, Punkt, Bindestrich und Apostroph.';
  const x = nameNorm(n);
  if (NAME_BAD.test(x) || NAME_BAD_WORD.test(x)) return 'Dieser Name ist nicht erlaubt.';
  return null;
}
const nameValid = () => !nameProblem(devInfo().name);
async function nameAI(n) {
  if (!aiReady() || !navigator.onLine) return null;
  try {
    const {out} = await aiFetch([{role: 'system', content: 'Du prüfst Anzeigenamen für eine Fitness-App mit Jugendlichen und Erwachsenen. Nicht erlaubt: Beleidigungen, Schimpfwörter, sexuelle Begriffe, rassistische, diskriminierende, extremistische oder gewaltverherrlichende Begriffe und Anspielungen, auch verschleiert (Leetspeak, andere Sprachen, absichtliche Tippfehler), Namen bekannter Extremisten oder Diktatoren, Werbung. Erlaubt: normale Vor- und Nachnamen aus allen Kulturen, Spitznamen, Initialen. Im Zweifel bei echten Namen erlauben.'},
      {role: 'user', content: `Name: „${n}“\nAntworte nur mit JSON: {"ok": true oder false, "reason": "wenn nicht ok: kurzer Grund auf Deutsch, höchstens 12 Wörter"}`}], 'text', {temperature: 0, max: 400, timeout: 20000});
    return {ok: out.ok !== false, reason: String(out.reason || '').slice(0, 120)};
  } catch (e) { return null; }
}
let nameGate = null;   // {then, required}
function openNameGate(then, required = true) {
  nameGate = {then: then || null, required};
  sheetLocked = false;
  const n = devInfo().name;
  openSheet(`${required ? '' : `<div class="sheet-h"><button class="btn-text" data-act="nameCancel">Abbrechen</button><h2>Dein Name</h2><span></span></div>`}`
    + `<div class="pn-hero"><span>👋</span><b>${required ? 'Wie heißt du?' : 'Name ändern'}</b><small>Dein Name ist Pflicht, damit der Admin sieht, wer Overload nutzt, und dir bei Problemen helfen kann.</small></div>`
    + `<label class="lbl" for="nameIn">Vorname oder Spitzname</label><input id="nameIn" aria-label="Vorname oder Spitzname" class="field" type="text" maxlength="24" autocomplete="given-name" autocapitalize="words" spellcheck="false" enterkeyhint="done" value="${esc(nameValid() ? n : '')}" placeholder="z. B. Max">`
    + `<p class="hint" id="nameErr" role="alert"></p>`
    + `<button class="btn-primary" data-act="nameSave" id="nameBtn">${required ? 'Weiter' : 'Speichern'}</button>`
    + `<p class="hint">Gesendet werden nur Name, Gerätetyp und App-Version. Unpassende Namen (Beleidigungen, rassistische oder sexuelle Begriffe) werden automatisch abgelehnt, auch per KI.</p>`);
  sheetLocked = required;   // erst nach dem Öffnen sperren
  setTimeout(() => $('#nameIn')?.focus(), 350);
}
async function nameSave() {
  const el = $('#nameIn'), err = $('#nameErr'), btn = $('#nameBtn');
  if (!el) return;
  const n = el.value.trim().replace(/\s+/g, ' '), p = nameProblem(n);
  if (p) { err.textContent = p; err.classList.add('red-t'); el.focus(); return; }
  btn.disabled = true; btn.textContent = 'Prüfe Namen …'; err.textContent = '';
  if (syncOn()) await syncPing(true).catch(() => {});   // Gerät anmelden, damit die KI über den Server prüfen darf
  const ai = await nameAI(n);
  if (!$('#nameIn')) return;
  btn.disabled = false; btn.textContent = nameGate && nameGate.required ? 'Weiter' : 'Speichern';
  if (ai && !ai.ok) { err.textContent = 'Dieser Name ist nicht erlaubt' + (ai.reason ? `: ${ai.reason}` : '.'); err.classList.add('red-t'); el.select(); return; }
  const d = devInfo(); d.name = n; d.nameOk = ai ? 'ai' : 'local'; devSave(d);
  syncPing(true);
  const then = nameGate && nameGate.then; nameGate = null; sheetLocked = false;
  closeSheet(); render(); toast(`Hallo ${n}!`);
  if (then) setTimeout(then, 300);
}
/* Name, der nur lokal geprüft wurde, später mit der KI nachprüfen */
async function nameRecheck() {
  const d = devInfo();
  if (!d.name || d.nameOk === 'ai' || !syncOn()) return;
  const ai = await nameAI(d.name);
  if (!ai) return;
  if (ai.ok) { d.nameOk = 'ai'; devSave(d); return; }
  d.name = ''; d.nameOk = null; devSave(d);
  if (!$('#sheet').classList.contains('show')) openNameGate(null, true);
}

/* ---------- Verschlüsselung für den Geräte-Sync (Ende-zu-Ende) ----------
   Der Schlüssel wird aus dem Sync-Code abgeleitet (PBKDF2, 150.000 Runden, eigenes Salz), der Server speichert nur
   den Hash des Codes und den verschlüsselten Stand (AES-GCM 256, vorher gzip, wenn der Browser es kann). Ohne Code
   kann niemand die Daten lesen, auch der Admin nicht. Alte, unverschlüsselte Stände werden weiter gelesen. */
const syncKeys = {};
async function syncKey(code) {
  if (!syncKeys[code]) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    syncKeys[code] = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: new TextEncoder().encode('overload-sync-v1'), iterations: 150000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  }
  return syncKeys[code];
}
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function zip(bytes, on) {
  if (typeof CompressionStream === 'undefined') return null;
  const s = new Blob([bytes]).stream().pipeThrough(on ? new CompressionStream('gzip') : new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function encData(obj, code) {
  let bytes = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
  const zz = await zip(bytes, true).catch(() => null);
  if (zz) { bytes = zz; z = 1; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await syncKey(code), bytes);
  return {e: 1, z, iv: b64(iv), d: b64(ct)};
}
async function decData(x, code) {
  if (!x || x.e !== 1) return x;   // alter, unverschlüsselter Stand
  let bytes = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(x.iv)}, await syncKey(code), unb64(x.d)));
  if (x.z) bytes = await zip(bytes, false);
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- Admin: Anmeldung mit Token (ovl_admin_login), altes gespeichertes Passwort wird einmal umgetauscht ---------- */
async function adminUpgrade() {
  const v = adminPw();
  if (!v || v.startsWith('tok_') || !syncOn()) return;
  try { const t = await syncRpc('ovl_admin_login', {p_pw: v}); if (typeof t === 'string' && t.startsWith('tok_')) localStorage.setItem(ADMIN_STORE, t); }
  catch (e) { if (/Passwort/.test(e.message)) { try { localStorage.removeItem(ADMIN_STORE); } catch (x) {} } }
}

/* Hauptschalter an: Erlaubnis fragen (muss direkt aus dem Tipp kommen), Abo anlegen, beim Server anmelden */
async function pushEnable() {

async function pushSync(force) {

/* Erinnerungen für die nächsten 7 Tage: nur Tage mit einer offenen Planeinheit, nicht in der Pause, nicht in der Vergangenheit */
function pushPlanItems(c) {
  const out = [], t0 = new Date();
  t0.setHours(0, 0, 0, 0);
  const hm = s => { const m = /^(\d\d):(\d\d)$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  if (c.train && (runOn() || triOn())) {
    const [hh, mm] = hm(c.time) || [17, 0];
    const paused = (area, day) => { const p = db.settings.pause; return !!(p && p.areas.includes(area) && (!p.until || day <= p.until)); };
    for (let n = 0; n < 7; n++) {
      const day = addDays(t0.getTime(), n), at = new Date(day);
      at.setHours(hh, mm, 0, 0);
      if (at.getTime() < Date.now() + 120e3) continue;
      const dow = (new Date(day).getDay() + 6) % 7;
      let open = false;
      if (runOn() && !paused('run', day)) {
        const P = curPlan(), wi = P ? planWeekIndex(P, day) : -1, W = P && wi >= 0 ? P.weeks[wi] : null;
        if (W && W.s.some(s => s.dow === dow) && !db.runs.some(r => r.slot === slotKey(P, wi, dow))) open = true;
      }
      if (!open && triOn() && !paused('tri', day)) {
        const P = db.triPlan, wi = P ? planWeekIndex(P, day) : -1, W = P && wi >= 0 ? P.weeks[wi] : null;
        if (W && W.s.some((s, k) => s.dow === dow && !db.tri.some(r => r.slot === triSlot(P, wi, k)))) open = true;
      }
      if (open) out.push({at: at.toISOString(), kind: 'train'});
    }
  }
  // „Heute wichtig“: meldet sich, sobald heute etwas Neues dazukommt. Die App rechnet bei jedem Speichern in Halbstunden-Schritten bis 21 Uhr durch,
  // wann ein Hinweis aus PUSH_ADVICE neu auftauchen würde (Schwellen wie nach dem Training ab 17 Uhr), und plant genau dafür eine Mitteilung.
  // Was schon auf Heute steht, kommt nicht nochmal; höchstens eine pro Tag; nie vor der gewählten Uhrzeit.
  if (c.advice && foodOn() && adviceOn() && !(c.advAt && c.advAt <= Date.now() && dateKey(c.advAt) === dateKey(Date.now()))) {
    const [hh, mm] = hm(c.atime) || [9, 0], now = new Date(), nowH = now.getHours() + now.getMinutes() / 60;
    const ok = x => PUSH_ADVICE.includes(x.emo), key = x => x.emo + x.title, have = new Set(dayAdvice(nowH).filter(ok).map(key));
    for (let t = Math.max(hh + mm / 60, Math.ceil((nowH + 0.03) * 2) / 2); t <= 21; t += 0.5) {

      }
    }

}

/* ---------- Overload-ID und Daten teilen (supabase-update-7.sql) ----------
   db.settings.me = {oid, key}: deine Overload-ID mit geheimem Schlüssel (Server kennt nur den Hash), über den Sync auf allen eigenen Geräten gleich.
   db.settings.shareKeys = {Freigabe-ID: {k, role 'out'|'in', code, oid, at}}: Datenschlüssel und Codes liegen nur in deinen Daten, nie auf dem Server.
   Person 1 teilt Bereiche mit einer ID: Die App erzeugt einen Zufallsschlüssel k (AES-GCM 256) und einen 6-stelligen Code. k wird mit einem aus
   dem Code abgeleiteten Schlüssel (PBKDF2) verpackt; der Server gibt den verpackten Schlüssel nur nach richtigem Code heraus (bcrypt, 5 Versuche,
   48 Stunden) und löscht ihn danach. Den Auszug der letzten 30 Tage (shareSnapshot) verschlüsselt Person 1 mit k und lädt ihn bei Änderungen hoch
   (sharePushAll, höchstens alle 5 Minuten). Person 2 liest ihn in der Ansicht „shared“ (vShared), nur lesend. Beenden geht von beiden Seiten. */
const SHARE_AREAS = [['food', 'Ernährung', 'Mahlzeiten mit Uhrzeit, Kalorien und Makros, dazu deine Ziele'], ['weight', 'Gewicht', 'Messungen der letzten 90 Tage und dein Zielgewicht'],
  ['gym', 'Gym', 'Trainings mit Übungen, Gewichten und Wiederholungen'], ['run', 'Laufen', 'Läufe mit Dauer, Distanz, Puls und Schmerz, dazu dein Ziel']];
const shareAreaName = a => (SHARE_AREAS.find(x => x[0] === a) || [0, a])[1];
const areaList = A => (a => a.length > 1 ? a.slice(0, -1).join(', ') + ' und ' + a[a.length - 1] : a[0] || '')((A || []).map(shareAreaName));
const fmtShareCode = c => c ? c.slice(0, 3) + '-' + c.slice(3) : '';
const cleanShareCode = s => String(s || '').toUpperCase().replace(/[^2-9A-HJ-NP-Z]/g, '').slice(0, 6);
const me = () => db.settings.me && /^OVL-[2-9A-HJ-NP-Z]{6}$/.test(db.settings.me.oid || '') ? db.settings.me : null;
let shr = {list: null, busy: false, err: '', at: 0}, sh = null, shv = {id: null, data: null, updated: null, err: '', busy: false, tab: null};

async function shareRpc(fn, args) {
  const m = me();
  if (!m) throw new Error('Du hast noch keine Overload-ID.');
  try { return await syncRpc(fn, {p_oid: m.oid, p_key: m.key, ...args}); }
  catch (e) {
    const t = e.message;
    throw new Error(/Admin-Passwort/.test(t) ? 'Deine Overload-ID ist auf dem Server nicht bekannt.' : /recipient/.test(t) ? 'Diese Overload-ID gibt es nicht, oder es ist deine eigene.'
      : /limit/.test(t) ? 'Gerade zu viele Anfragen, probier es später nochmal.' : /zu gross/.test(t) ? 'Zu viele Daten zum Teilen.' : /404|PGRST202/.test(t) ? 'Teilen ist auf dem Server noch nicht eingerichtet.' : t);
  }
}
async function ensureOid() {
  if (me()) return me();
  if (!syncOn()) throw new Error('Teilen braucht den Overload-Server.');
  if (!navigator.onLine) throw new Error('Für deine Overload-ID brauchst du einmal Internet.');
  await syncPing(true).catch(() => {});
  const key = b64(crypto.getRandomValues(new Uint8Array(32)));
  let oid;
  try { oid = await syncRpc('ovl_oid_create', {p_id: devInfo().id, p_key: key}); }
  catch (e) { throw new Error(/404|PGRST202/.test(e.message) ? 'Teilen ist auf dem Server noch nicht eingerichtet.' : /device/.test(e.message) ? 'Dein Gerät ist noch nicht beim Server angemeldet. Öffne die App kurz mit Internet und versuch es nochmal.' : 'Die Overload-ID konnte nicht erstellt werden. Versuch es gleich nochmal.'); }
  db.settings.me = {oid, key}; saveDB();
  try { pushSync(true); } catch (e) {}
  return db.settings.me;
}

/* Schlüssel und Verschlüsselung */
const aesKey = kb => crypto.subtle.importKey('raw', unb64(kb), 'AES-GCM', false, ['encrypt', 'decrypt']);
async function encWith(obj, kb) {
  let bytes = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
  const zz = await zip(bytes, true).catch(() => null);
  if (zz) { bytes = zz; z = 1; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return {e: 2, z, iv: b64(iv), d: b64(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await aesKey(kb), bytes))};
}
async function decWith(x, kb) {
  let bytes = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(x.iv)}, await aesKey(kb), unb64(x.d)));
  if (x.z) bytes = await zip(bytes, false);
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function codeKey(code, oid) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: new TextEncoder().encode('overload-share-v1:' + oid), iterations: 200000, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function wrapShareKey(kb, code, toOid) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return JSON.stringify({iv: b64(iv), d: b64(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await codeKey(code, toOid), unb64(kb)))});
}
async function unwrapShareKey(w, code, myOid) {
  const x = JSON.parse(w);
  return b64(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(x.iv)}, await codeKey(code, myOid), unb64(x.d)));
}

/* Was geteilt wird: letzte 30 Tage (Gewicht 90 Tage), nur die freigegebenen Bereiche */
function shareSnapshot(areas) {
  const since = Date.now() - 30 * DAY, A = new Set(areas), out = {v: 1, at: Date.now(), name: devInfo().name || ''};
  if (A.has('food')) out.food = {goal: db.settings.kcalGoal, macro: db.settings.macroGoal,
    meals: db.meals.filter(m => m.date >= since).map(m => ({d: m.date, s: m.slot, n: m.name, k: m.kcal, p: m.p, c: m.c, f: m.f, g: m.g || null}))};
  if (A.has('weight')) out.weight = {goal: db.weightGoal ? db.weightGoal.target : null,
    list: Object.keys(db.weights).filter(k => keyToTs(k) >= Date.now() - 90 * DAY).sort().map(k => [k, db.weights[k]])};
  if (A.has('gym')) out.gym = db.sessions.filter(s => s.date >= since && !s.demo).map(s => ({d: s.date, t: s.title, dur: s.end ? Math.round((s.end - s.date) / 60000) : null,
    e: s.entries.filter(e => e.sets.length).map(e => ({n: (db.exercises[e.exId] || {}).name || 'Übung', s: e.sets.map(x => [x.w, x.r])}))}));
  if (A.has('run')) { const P = curPlan(); out.run = {plan: P && runOn() ? {label: P.label, race: P.race || null} : null,
    runs: db.runs.filter(r => r.date >= since).map(r => ({d: r.date, m: r.min, km: r.km, hr: r.hr, pain: r.pain, t: r.type})),
    tri: db.tri.filter(r => r.date >= since).map(r => ({d: r.date, sp: r.sport, m: r.min, km: r.km, hr: r.hr}))}; }
  return out;
}
const outShares = () => Object.entries(db.settings.shareKeys).filter(([, v]) => v.role === 'out');
let sharePushT = 0;
async function sharePushAll(force) {
  if (!me() || !navigator.onLine || !outShares().length) return;
  if (!force && Date.now() - sharePushT < 5 * 60e3) return;
  sharePushT = Date.now();
  let done = {};
  try { done = JSON.parse(localStorage.getItem('ovl-share-push') || '{}'); } catch (e) {}
  const live = (shr.list && shr.list.out) || null;
  for (const [id, v] of outShares()) {
    const s = live && live.find(x => String(x.id) === id);
    if (live && !s) { delete db.settings.shareKeys[id]; saveDB(); continue; }   // auf dem Server beendet
    if (s && !['pending', 'active'].includes(s.state)) continue;
    const areas = s ? s.areas : v.areas, snap = shareSnapshot(areas), h = pwHash(JSON.stringify([areas, {...snap, at: 0}]));
    if (!force && done[id] === h) continue;
    try { await shareRpc('ovl_share_push', {p_share: +id, p_areas: areas, p_data: await encWith(snap, v.k)}); done[id] = h; } catch (e) {}
  }
  try { localStorage.setItem('ovl-share-push', JSON.stringify(done)); } catch (e) {}
}
function shareSoon() { if (outShares().length) { clearTimeout(shareSoon.t); shareSoon.t = setTimeout(() => sharePushAll(), 30000); } }

/* ---------- Study App (Lern-App): tägliche Zusammenfassung senden ----------
   Optional, nur nach Eingabe eines Verbindungscodes aus der Study App. Gesendet wird pro Tag nur:
   Anzahl Einheiten, Minuten insgesamt, Art (gym, run, other), Schlafstunden und (seit 09.10.2026, solange die Belastung
   nicht ausgeschaltet ist) die Belastung: Punkte des Tages (Dauer × Anstrengung), Anstrengung 1–10, ob sie von dir gesetzt
   wurde, 7-Tage- und 28-Tage-Mittel und ob genug Daten für das Verhältnis da sind. Keine Übungen, Gewichte,
   Strecken, Pulswerte oder Ernährung. Code und Status liegen nur auf diesem Gerät (localStorage ovl-study),
   nicht im Datenobjekt, nicht im Backup und nicht im Sync. */
const STUDY_URL = 'https://mhyunfeirajnmbrpdojm.supabase.co/functions/v1/fitness-ingest';
const study = {busy: false, err: ''};
function studyLoad() { try { const s = JSON.parse(localStorage.getItem('ovl-study') || 'null'); return s && typeof s.token === 'string' ? s : null; } catch (e) { return null; } }
function studySave(s) { try { if (s) localStorage.setItem('ovl-study', JSON.stringify(s)); else localStorage.removeItem('ovl-study'); } catch (e) {} }
/* Die letzten 14 Tage, jeden Tag (auch ohne Training), damit gelöschte Einträge dort korrigiert werden */
/* Belastung für die Study App: pro Tag Punkte, Anstrengung und die 7-/28-Tage-Mittel. Aus loadState (nur Einheiten, die zur Belastung zählen).
   Ohne Daten oder bei ausgeschalteter Belastung (settings.hints.load) gibt es keine Belastungsfelder. */
function studyLoadDays() {
  if (db.settings.hints && db.settings.hints.load === false) return null;
  let L = null;
  try { L = loadState(); } catch (e) { L = null; }
  if (!L) return null;
  const at = {};
  L.series.forEach((p, i) => { at[p.k] = {atl: p.atl, ctl: p.ctl, ready: i >= 13 && p.ctl >= 25}; });
  const r1 = v => Math.round(v * 10) / 10, by = {};
  L.items.forEach(o => { const k = dateKey(o.ts); (by[k] || (by[k] = [])).push(o); });
  return k => {
    const its = by[k] || [], min = its.reduce((a, o) => a + o.min, 0), pts = its.reduce((a, o) => a + o.rpe * o.min, 0), p = at[k];
    return {
      load: Math.round(pts), rpe: min > 0 ? r1(pts / min) : null, rpeSet: its.length ? its.some(o => o.set) : null,
      acute: p ? r1(p.atl) : null, chronic: p ? r1(p.ctl) : null, ready: p ? p.ready : null,
    };
  };
}
function studySummary() {
  const days = [], noon = new Date(), ld = studyLoadDays(); noon.setHours(12, 0, 0, 0);
  for (let i = 0; i < 14; i++) {
    const key = dateKey(noon.getTime() - i * DAY), kinds = new Set();
    let n = 0, min = 0;
    for (const s of db.sessions) if (!s.demo && dateKey(s.date) === key) { n++; min += s.end && s.end > s.date && s.end - s.date <= 4 * 36e5 ? Math.round((s.end - s.date) / 60000) : 60; kinds.add('gym'); }
    for (const r of db.runs) if (dateKey(r.date) === key) { n++; min += r.min || 0; kinds.add('run'); }
    for (const r of (db.tri || [])) if (dateKey(r.date) === key) { n++; min += r.min || 0; kinds.add('other'); }
    for (const r of (db.xact || [])) if (dateKey(r.date) === key) { n++; min += r.min || 0; kinds.add('other'); }
    const d = db.daily && db.daily[key];
    days.push({date: key, sessions: n, minutes: min, kinds: [...kinds], sleep: d && typeof d.s === 'number' && d.s > 0 ? d.s : null, ...(ld ? ld(key) : {})});
  }
  return days;
}
let studyPushT = 0;
async function studyPush(force) {
  const S = studyLoad();
  if (!S || study.busy) return {ok: false};
  if (!navigator.onLine) { if (force) study.err = 'Keine Internetverbindung.'; return {ok: false}; }
  if (!force && Date.now() - studyPushT < 2 * 60e3) return {ok: false};
  studyPushT = Date.now();
  const days = studySummary(), h = String(pwHash(JSON.stringify(days)));
  if (!force && S.hash === h && Date.now() - (S.at || 0) < 12 * 36e5) return {ok: true};
  study.busy = true;
  try {
    const res = await fetch(STUDY_URL, {method: 'POST', headers: {'content-type': 'application/json', 'x-link-token': S.token}, body: JSON.stringify({days})});
    if (res.status === 401) { study.err = 'Der Code wird nicht akzeptiert. Erzeuge in der Study App einen neuen.'; return {ok: false}; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    studySave({...S, hash: h, at: Date.now()}); study.err = '';
    return {ok: true};
  } catch (e) { study.err = 'Senden hat nicht geklappt. Prüfe die Verbindung und versuche es später noch einmal.'; return {ok: false}; }
  finally { study.busy = false; }
}
function studyPushSoon() { if (studyLoad()) { clearTimeout(studyPushSoon.t); studyPushSoon.t = setTimeout(() => studyPush(), 30000); } }

  } else {
    h += `<label class="lbl mt" for="studyCode">Verbindungscode</label><input id="studyCode" class="field" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="STU-…">`

    if (!out && s.state === 'pending') h += `<button class="btn-primary mt" data-act="shareClaimOpen" data-id="${esc(s.id)}">Code eingeben</button>`;
    h += `<button class="btn-text danger wide" data-act="shareEnd" data-id="${esc(s.id)}">${out ? 'Teilen beenden' : 'Nicht mehr ansehen'}</button></div>`;
  }
  openSheet(h, keep, true);
}

/* Ansicht der geteilten Daten (nur lesen) */
function shareCache(id, val) {
  let c = {};
  try { c = JSON.parse(localStorage.getItem('ovl-share-cache') || '{}'); } catch (e) {}
  if (val === undefined) return c[id] || null;
  if (val === null) delete c[id]; else c[id] = val;
  try { localStorage.setItem('ovl-share-cache', JSON.stringify(c)); } catch (e) {}
}
async function openShared(id) {
  const c = shareCache(id);

  closeSheet(); go('shared');
  try {
    const r = await shareRpc('ovl_share_pull', {p_share: +id, p_since: c ? c.updated : null});
    if (!r.ok) throw new Error('Diese Freigabe wurde beendet.');

    if (R.tri && R.tri.length) h += `<h3 class="sec-h mt">Triathlon</h3><div class="group">${[...R.tri].sort((a, b) => b.d - a.d).map(r => `<div class="row"><span class="t"><b>${esc(day(r.d))}</b><span>${esc(TTYPE[r.sp] || 'Einheit')} · ${r.m} min${r.km != null ? ' · ' + fmtKm(r.km) : ''}</span></span></div>`).join('')}</div>`;

document.addEventListener('input', ev => {
  const el = ev.target;
  if (!sh) return;
  if (el.id === 'shTo') sh.to = el.value;
  if (el.id === 'shCode') { const c = cleanShareCode(el.value); sh.code = c; const f = fmtShareCode(c); if (el.value !== f && !/-$/.test(el.value)) el.value = f; }

Object.assign(A, {

  shareRefresh: async () => { sh.busy = true; await shareLoad(); sh.busy = false; sh.err = shr.err; renderShare(true); },
  oidCopy: async () => { try { await navigator.clipboard.writeText(me().oid); toast('Overload-ID kopiert'); } catch (e) { toast(me().oid); } },
  shareNew: () => { sh = {step: 'to', to: '', err: '', busy: false, areas: []}; renderShare(); setTimeout(() => $('#shTo')?.focus(), 300); },
  shareLookup: async () => {
    let t = String(sh.to || '').toUpperCase().replace(/\s/g, '');
    if (/^[2-9A-HJ-NP-Z]{6}$/.test(t)) t = 'OVL-' + t;
    if (!/^OVL-[2-9A-HJ-NP-Z]{6}$/.test(t)) { sh.err = 'Eine Overload-ID sieht so aus: OVL-7K3MQ2.'; renderShare(true); return; }
    if (t === me().oid) { sh.err = 'Das ist deine eigene ID.'; renderShare(true); return; }
    sh.busy = true; sh.err = ''; renderShare(true);
    try { const r = await shareRpc('ovl_oid_lookup', {p_target: t}); sh.busy = false; if (!r.found) { sh.err = 'Diese Overload-ID gibt es nicht. Prüf sie nochmal.'; renderShare(true); return; } Object.assign(sh, {step: 'areas', to: t, toName: r.name, areas: []}); renderShare(); }
    catch (e) { sh.busy = false; sh.err = e.message; renderShare(true); }
  },
  shareArea: ({k}) => { sh.areas = sh.areas.includes(k) ? sh.areas.filter(x => x !== k) : [...sh.areas, k]; renderShare(true); },
  shareCreate: async () => {
    if (!sh.areas.length || sh.busy) return;
    sh.busy = true; sh.err = ''; renderShare(true);
    try {
      const k = b64(crypto.getRandomValues(new Uint8Array(32))), r = crypto.getRandomValues(new Uint8Array(6)), code = Array.from(r, x => SYNC_ABC[x & 31]).join('');
      const areas = SHARE_AREAS.map(x => x[0]).filter(a => sh.areas.includes(a));
      const id = await shareRpc('ovl_share_create', {p_to: sh.to, p_areas: areas, p_code: code, p_wrapped: await wrapShareKey(k, code, sh.to)});
      db.settings.shareKeys = {...db.settings.shareKeys, [id]: {k, role: 'out', code, oid: sh.to, areas, at: Date.now()}}; saveDB();
      await shareRpc('ovl_share_push', {p_share: id, p_areas: areas, p_data: await encWith(shareSnapshot(areas), k)}).catch(() => {});
      Object.assign(sh, {step: 'code', code, busy: false}); renderShare(); shareLoad();

  },
  shareCodeCopy: async () => { try { await navigator.clipboard.writeText(fmtShareCode(sh.code)); toast('Code kopiert'); } catch (e) { toast(fmtShareCode(sh.code)); } },
  shareOpen: ({id, dir}) => {
    const s = shr.list && shr.list[dir === 'out' ? 'out' : 'in'].find(x => String(x.id) === id);
    if (!s) return;
    if (dir === 'in' && s.state === 'active' && db.settings.shareKeys[id]) { openShared(id); return; }
    if (dir === 'in' && s.state === 'pending') { sh = {step: 'claim', share: s, code: '', err: '', busy: false, from: 'main'}; renderShare(); return; }
    sh = {step: 'manage', share: s, dir}; renderShare();
  },
  shareClaimOpen: ({id}) => { const s = shr.list.in.find(x => String(x.id) === id); if (s) { sh = {step: 'claim', share: s, code: '', err: '', busy: false, from: 'main'}; renderShare(); } },
  shareClaim: async () => {

    sh.busy = true; sh.err = ''; renderShare(true);
    try {
      const r = await shareRpc('ovl_share_claim', {p_share: +sh.share.id, p_code: code});
      if (!r.ok) {
        sh.busy = false;
        sh.err = r.reason === 'code' ? `Der Code stimmt nicht. Noch ${r.left} ${r.left === 1 ? 'Versuch' : 'Versuche'}.` : r.reason === 'locked' ? 'Zu viele falsche Versuche. Bitte die Person, neu mit dir zu teilen.' : r.reason === 'expired' ? 'Der Code ist abgelaufen. Bitte die Person, neu mit dir zu teilen.' : r.reason === 'active' ? 'Schon angenommen.' : 'Diese Freigabe gibt es nicht mehr.';
        renderShare(true); return;
      }
      const k = await unwrapShareKey(r.wrapped, code, me().oid);
      db.settings.shareKeys = {...db.settings.shareKeys, [sh.share.id]: {k, role: 'in', oid: sh.share.oid, at: Date.now()}}; saveDB();

  },
  shareDecline: async ({id}) => {

  },
  shareEnd: async ({id}) => {

    if (!v) { renderShare(); return; }

    const k = {...db.settings.shareKeys}; delete k[id]; db.settings.shareKeys = k; saveDB(); shareCache(id, null);

  },
  shareRedo: () => { const s = sh.share; sh = {step: 'areas', to: s.oid, toName: s.name || s.oid, areas: [...s.areas], err: '', busy: false}; renderShare(); },
  shareAreaEdit: async ({k}) => {
    const s = sh.share, areas = s.areas.includes(k) ? s.areas.filter(x => x !== k) : SHARE_AREAS.map(x => x[0]).filter(a => a === k || s.areas.includes(a));
    if (!areas.length) { toast('Mindestens ein Bereich, sonst beende das Teilen'); return; }
    const v = db.settings.shareKeys[s.id];
    if (!v) { toast('Ändern geht auf dem Gerät, auf dem du geteilt hast'); return; }
    try { await shareRpc('ovl_share_push', {p_share: +s.id, p_areas: areas, p_data: await encWith(shareSnapshot(areas), v.k)}); s.areas = areas; renderShare(true); toast('Geändert'); } catch (e) { toast(e.message); }
  },
  shareView: ({id}) => openShared(id),
  sharedTab: ({v}) => { shv.tab = v; render(); },
  shareBackView: () => { go('more'); openShareSheet(); },

/* ---------- Leistungstest und Rennzeit-Prognose ----------
   Aus einem Test (Cooper 12 min, 3 km, 5 km) oder einer bekannten Bestzeit berechnet die App den VDOT (Jack Daniels: Schätzung der
   Ausdauer-Leistungsfähigkeit aus einer Renn-Leistung), daraus Zeiten für 5 km bis Marathon und Trainingstempi. db.runTests = [{id, date, kind
   cooper|k3|k5|best, km, sec, vdot}], aktuell zählt der neueste. Die Prognose gilt für gut vorbereitete, gesunde Läufe auf ebener Strecke. */
const vo2At = v => -4.6 + 0.182258 * v + 0.000104 * v * v;   // v in m/min
const pctMax = t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);   // t in min
const vdotOf = (m, sec) => vo2At(m / (sec / 60)) / pctMax(sec / 60);
function raceSec(vdot, m) {
  let lo = 90, hi = 40000;
  for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (vdotOf(m, mid) > vdot) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function paceAt(vdot, f) {   // Sekunden pro km bei Anteil f der VO2max
  const c = 4.6 + f * vdot, v = (-0.182258 + Math.sqrt(0.182258 ** 2 + 4 * 0.000104 * c)) / (2 * 0.000104);
  return 60000 / v;
}
const fmtHMS = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
const RT_DIST = [[5, '5 km'], [10, '10 km'], [21.0975, 'Halbmarathon'], [42.195, 'Marathon']];
const RTEST = {
  cooper: {n: 'Cooper-Test', s: '12 Minuten so weit wie möglich laufen. Der Klassiker, du brauchst nur eine Uhr.', emo: '⏱️', steps: [

    '12 Minuten so weit laufen, wie es gleichmäßig geht. Nicht zu schnell starten, das ist der häufigste Fehler.',
    'Distanz von Uhr oder Lauf-App ablesen. Am genauesten ist eine 400-m-Bahn.',

  k3: {n: '3-km-Test', s: 'Die schnellste gleichmäßige Zeit über 3 km.', emo: '🏁', steps: [

/* Planeinheit zur Aktivität: gleiche Woche, noch offen, höchstens 2 Tage daneben, der nächste Tag gewinnt */
function stravaSlot(ts, sport, tri) {
  const dow = (new Date(ts).getDay() + 6) % 7, best = c => c.filter(x => x.d <= 2).sort((a, b) => a.d - b.d)[0] || null;

    const i = planWeekIndex(P, ts), w = P.weeks[i]; if (!w) return null;

    const c = best(w.s.map(s => ({s, key: slotKey(P, i, s.dow), d: Math.abs(s.dow - dow)})).filter(x => !used.has(x.key)));
    return c ? {slot: c.key, type: c.s.type} : null;
  }
  const P = db.triPlan; if (!P) return null;
  const i = planWeekIndex(P, ts), w = P.weeks[i]; if (!w) return null;
  const used = new Set(db.tri.map(r => r.slot).filter(Boolean));
  const c = best(w.s.map((s, k) => ({s, key: triSlot(P, i, k), d: Math.abs(s.dow - dow)})).filter(x => x.s.type === sport && !used.has(x.key)));

/* Eine Aktivität übernehmen. Ein von Hand eingetragener Eintrag am gleichen Tag mit ähnlicher Dauer wird nur ergänzt. */
function stravaTake(a) {
  const kind = stravaKind(a.t), ts = Date.parse(a.s);

  const list = toRuns ? db.runs : db.tri, min = Math.max(1, Math.round(a.mt / 60)), km = a.d ? r2(a.d / 1000) : null, hr = a.hr ? Math.round(a.hr) : null;

async function stravaImport(manual) {

    try { const st = await stravaCall('status'); if (!st.linked) return; stravaLinked(st.name); toast('Mit Strava verbunden'); } catch (e) { return; }
