.fr-req{margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.fr-rq{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--lime)}
.fr-rq .btn-chip{flex:none}
.fr-rq .btn-chip.on{background:var(--lime);color:var(--on-accent)}
.fr-wk{display:flex;gap:8px;margin:2px 0 10px}
.fr-wk button{padding:7px 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:700;color:var(--text-2)}
.fr-wk button.on{background:var(--lime-dim);color:var(--lime)}
.fr-board .row{gap:10px}
.fr-pos{flex:none;width:26px;font-size:20px;text-align:center;font-weight:800;color:var(--text-2)}
.fr-rk.me{background:var(--lime-dim)}
.fr-rk .t span{white-space:normal}
.fr-bar{display:block;height:6px;margin-top:7px;border-radius:3px;background:var(--surface-3);overflow:hidden}.fr-bar i{display:block;height:100%;border-radius:3px;background:var(--lime)}
.fr-min{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.fr-min b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}.fr-min small{font-size:12px;font-weight:600;color:var(--text-2)}.fr-min em{font-style:normal;font-size:12px;font-weight:700}.fr-min em.up{color:var(--green)}.fr-min em.dn{color:var(--amber)}
.fr-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:6px 0 18px}
.fr-intro>span{font-size:56px;line-height:1.1}.fr-intro b{font-size:23px;font-weight:800;letter-spacing:-.01em;max-width:18ch}.fr-intro p{margin:0;max-width:34ch;font-size:15px;color:var(--text-2)}
.fr-points{margin-bottom:16px}
.fr-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin:6px 0 10px;padding:26px 18px;border-radius:22px;background:var(--surface)}
.fr-empty>span{font-size:44px}.fr-empty b{font-size:19px;font-weight:800}.fr-empty p{margin:0 0 10px;max-width:32ch;font-size:15px;color:var(--text-2)}
.fr-stack{display:flex;align-items:center}.fr-stack .fr-av{width:30px;height:30px;font-size:13px;margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}.fr-stack .fr-av:first-child{margin-left:0}
.live{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg)}
.lv-top{display:flex;align-items:center;justify-content:space-between;font-size:17px}
.lv-gps{font-size:13px;font-weight:600;color:var(--text-2)}
.lv-big{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:6px}
.lv-big b{font-family:var(--num);font-size:92px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lv-big span{font-size:22px;font-weight:700;color:var(--text-2)}
.lv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv-grid div{display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:16px;background:var(--surface)}
.lv-grid span{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-2)}
.lv-grid b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.lv-grid small{font-size:11px;color:var(--text-2)}
.lv-plan p{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--text-2);text-align:center}
.lv-map{width:100%;height:auto;flex:none;aspect-ratio:700/260;border-radius:16px;background:var(--surface)}
.lv-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.lv-btns button{height:56px;font-size:18px}
.wx-chip{display:flex;align-items:center;gap:8px;margin:2px 0 12px;padding:8px 12px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;color:var(--text-2)}
.wx-hours{display:flex;gap:6px;margin:0 0 16px}
.wx-h{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2)}
.wx-h b{font-size:20px}
.pn-off{opacity:.45;pointer-events:none}
.pn-hero{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 18px;text-align:center}
.pn-hero span{font-size:52px;line-height:1.1}
.pn-hero b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.pn-hero small{font-size:14px;color:var(--text-2)}
.pn-ver{margin-bottom:14px}
.pn-item{display:flex;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:14px;background:var(--surface-2)}
.pn-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);font-size:18px}
.pn-item b{display:block;font-size:16px}
.pn-item p{margin:2px 0 0;font-size:14px;line-height:1.4;color:var(--text-2)}
.pn-item b+p{margin-top:2px}
.tut-step{font-family:var(--num);font-size:13px;font-weight:700;color:var(--text-2)}
.tut-hero{display:grid;place-items:center;width:104px;height:104px;margin:8px auto 16px;border-radius:30px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.tut-hero span{font-size:56px;line-height:1}
.tut-t{margin:0 0 6px;font-size:26px;font-weight:800;text-align:center;letter-spacing:-.01em}
.tut-p{margin:0 8px 18px;font-size:16px;line-height:1.45;text-align:center;color:var(--text-2)}
.tut-list .pn-item p{margin:0;color:var(--text);font-size:15px}
.tut-dots{display:flex;justify-content:center;gap:6px;margin:18px 0 16px}
.tut-dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);transition:width .2s}
.tut-dots i.on{width:20px;border-radius:4px;background:var(--lime)}
.tut-nav{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:2;display:flex;gap:10px;margin:8px -16px 0;padding:12px 16px calc(22px + env(safe-area-inset-bottom,0px));background:var(--surface)}
.tut-nav>*{flex:1;margin:0}
/* Lauf-Coach und Wochenrückblick */
.rv,.rcoach{margin-top:16px;padding:14px 16px;border-radius:20px;background:var(--surface)}
.rv{background:linear-gradient(135deg,color-mix(in srgb,var(--cyan) 16%,var(--surface)),var(--surface) 70%)}
.rcoach{margin-top:0}
.rv-h{display:flex;align-items:center;gap:12px}
.rv-h>div{min-width:0}
.rv-h b{display:block;font-size:17px;font-weight:700}
.rv-lbl{margin:0;font-size:13px;color:var(--text-2)}
.rv-rate{display:flex;align-items:center;gap:4px;margin:12px 0 8px}
.rv-rate i{width:26px;height:6px;border-radius:3px;background:var(--surface-3)}
.rv-rate i.on{background:var(--cyan)}
.rv-rate span{margin-left:8px;font-size:13px;font-weight:700;color:var(--cyan)}
.rv-sum{margin:0 0 8px;font-size:15px;line-height:1.45}
.rv-tips{margin:0 0 4px;padding-left:20px;font-size:14px;line-height:1.45;color:var(--text-2)}
.rv-tips li{margin-bottom:4px}
.rv .bub-act .btn-chip{margin-top:6px}
.rc-tips{margin:12px -16px 12px;padding:0 16px}
.rc-tips .fchip{background:var(--surface-2);color:var(--text)}
.rcoach{overflow:hidden}
.rcoach .btn-primary{margin-bottom:0}
/* Umzug */
.moved{margin:0 0 14px}
a.btn-chip{text-decoration:none;color:var(--lime)}
/* Ladebildschirm */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);transition:opacity .35s ease,visibility .35s}
#splash.hide{opacity:0;visibility:hidden}
.sp-logo{position:relative;width:96px;height:96px}
.sp-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.sp-track{fill:none;stroke:var(--lime-dim);stroke-width:8}
.sp-arc{fill:none;stroke:var(--lime);stroke-width:8;stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3;animation:sp-fill 1.4s cubic-bezier(.45,0,.2,1) infinite}
@keyframes sp-fill{0%{stroke-dashoffset:251.3}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-251.3}}
.sp-ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--lime);animation:sp-pulse 1.4s ease-in-out infinite}
.sp-ic svg{width:40px;height:40px}
@keyframes sp-pulse{50%{transform:scale(.88)}}
.sp-name{font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--text);animation:fadein .5s ease-out}
@media (prefers-reduced-motion: reduce){.sp-arc,.sp-ic{animation:none}.sp-arc{stroke-dashoffset:60}}
/* Admin: Geräte */
.adm-area .cb{margin-right:2px}
.adm-area.on .cb{background:var(--lime);box-shadow:none;color:var(--on-accent)}
.ver-btn{display:block;margin:10px 4px 0;font-size:13px;color:var(--text-3)}
/* Start-Blatt und Pausen-Timer */
.rt-dur{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.btn-chip.on{background:var(--lime);color:var(--on-accent)}
.rt-mode button{font-size:13px}
#restWrap{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;margin-top:12px}
.rest-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:20px;background:var(--surface-2);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rest-bar.run{background:color-mix(in srgb,var(--lime) 18%,var(--surface-2))}
.rb-ring{flex:none;width:44px;height:44px}
.rb-t{flex:1;min-width:0}
.rb-t span{display:block;font-size:12px;color:var(--text-2)}
.rb-t b{font-family:var(--num);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rb-btn{flex:none;height:36px;min-width:44px;padding:0 10px;border-radius:12px;background:var(--surface-3);font-family:var(--num);font-size:14px;font-weight:700}
.rb-btn.strong{background:var(--lime);color:var(--on-accent)}
.rb-btn svg{width:18px;height:18px}
.rb-start{display:flex;flex:1;align-items:center;gap:8px;height:36px;padding:0 6px;font-size:15px;font-weight:600;color:var(--lime)}
.ex.skipped{padding:12px 14px;opacity:.6}
.ex.skipped h2{font-size:17px;text-decoration:line-through}
.wk-head .icon-btn.sm svg{width:18px;height:18px}
.wk-title{min-width:0;flex:1}
.wk-title>div{min-width:0}
.wk-title h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-title p{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wk-title>div{min-width:0}
/* Deload */
.dl-card{margin:14px 0 0}
.dl-card .btn-chip{margin-top:8px}
/* Rekorde und Abzeichen */
.aw-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.aw{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:16px;background:var(--surface);text-align:center}
.aw-e{font-size:32px;line-height:1.1;filter:grayscale(1);opacity:.35}
.aw.on .aw-e{filter:none;opacity:1}
.aw b{font-size:13px;line-height:1.2}
.aw small{font-size:11px;line-height:1.25;color:var(--text-2)}
.aw:not(.on) b{color:var(--text-2)}
.aw-bar{display:block;width:80%;height:4px;margin-top:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.aw-bar i{display:block;height:100%;background:var(--lime)}
.num-r{font-family:var(--num)}
/* Heute wichtig */
.focus{margin:6px 0 16px;padding:14px 14px 6px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--lime) 16%,var(--surface)),var(--surface) 75%)}
.focus-lbl{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--lime)}
.focus-lbl svg{width:16px;height:16px}
.fi{display:flex;gap:12px;padding:0 0 10px;margin-bottom:10px;border-bottom:.5px solid var(--sep)}
.fi:last-child{border-bottom:0;margin-bottom:0}
.fi-ok{flex:none;align-self:flex-start;width:32px;height:32px;margin:2px 0 0 4px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);font-size:15px;font-weight:700}
.fi-ok svg{width:16px;height:16px}
.fi-ok:active{background:var(--lime);color:var(--on-accent)}
.fi-e{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-size:19px}
.fi-t{flex:1;min-width:0}
.fi-t b{display:block;font-size:16px}
.fi-t p{margin:2px 0 0;font-size:14px;line-height:1.4;color:var(--text-2)}
.fi-b{margin-top:8px}
/* Essens-Score und Mikros */
.scard{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--surface);text-align:left}
.scard .ring-fg,.sc-hero .ring-fg{stroke:var(--c)}
.scard .ringwrap circle:first-child,.sc-hero .ringwrap circle:first-child{stroke:color-mix(in srgb,var(--c) 20%,transparent)}
.scard .ring-c b{font-size:20px}
.sc-t{flex:1;min-width:0}
.sc-t b{display:block;font-size:17px}
.sc-t span{display:block;margin-top:2px;font-size:13px;color:var(--text-2)}
.sc-hero{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:14px;border-radius:16px;background:var(--surface-2)}
.sc-hero b{font-size:20px}
.sc-hero p{margin:4px 0 0;font-size:13px;line-height:1.4;color:var(--text-2)}
.sc-hero .ring-c b{font-size:36px}
.sc-bar{flex:none;width:90px;height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.sc-bar i{display:block;height:100%}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.mc .mb-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 6px;margin-bottom:4px;font-size:12px;color:var(--text-2)}
.mc .mb-h span{min-width:0}
.mc .mb-h b{font-family:var(--num);font-size:12px;color:var(--text);white-space:nowrap}
.mc .mb-h small{font-weight:500;color:var(--text-2)}
.mc .kbar i{background:var(--lime)}
.mc.bad .kbar i{background:var(--red)}
.mc.bad .mb-h b{color:var(--red)}
/* Pause */
.pz-types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.pz-types button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--surface-2);font-size:13px;font-weight:600;box-shadow:inset 0 0 0 2px transparent}
.pz-types button span{font-size:26px}
.pz-types button.on{box-shadow:inset 0 0 0 2px var(--lime);background:var(--lime-dim)}
.pz-banner{margin:0 0 14px}
.tips .row{align-items:flex-start}
.wrap-t{display:block;font-size:14px;line-height:1.4;white-space:normal;color:var(--text)}
.tips .t span.wrap-t{white-space:normal;overflow:visible;color:var(--text)}
/* Großer Pausen-Timer */
.rest-full{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,var(--lime));animation:rf-in .3s cubic-bezier(.2,.85,.25,1);transition:transform .15s;touch-action:none}
@keyframes rf-in{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.rf-grab{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--surface-3)}
.rf-min{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:16px;display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600}
.rf-min svg{width:16px;height:16px}
.rf-lbl{margin:0;font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.rf-ring .ring-c b{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rf-ring .ring-c small{font-size:15px}
.rf-next{margin:4px 0 0;font-size:17px;font-weight:600;text-align:center}
.rf-next span{display:block;margin-bottom:3px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.rf-btns{display:flex;gap:12px}
.rf-btns button{width:112px;height:54px;border-radius:16px;background:var(--surface-2);font-family:var(--num);font-size:18px;font-weight:800}
.rf-skip{width:100%;max-width:340px;margin:0}
.rb-exp{display:flex;flex:1;align-items:center;gap:8px;min-width:0;text-align:left}

/* ===== Neuer Stil (settings.theme.style = "new", Standard seit 12.10.2026). Der klassische Stil bleibt ohne diese Regeln unverändert. ===== */
.sheet .choice{background:var(--surface-2)}
/* Tab-Leiste bleibt wie im klassischen Stil fest unten, nur der aktive Tab klappt mit seinem Namen aus */
:root[data-style="new"] .tabbar-inner{gap:2px;padding:8px 12px 6px;align-items:center}
:root[data-style="new"] .tab{flex:none;width:52px;height:48px;padding:0;border-radius:24px;flex-direction:row;justify-content:center;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text-2)}
:root[data-style="new"] .tab span{display:none}
:root[data-style="new"] .tab svg{width:24px;height:24px}
:root[data-style="new"] .tab.on{flex:1;width:auto;background:var(--surface-2);color:var(--lime)}

<script>
(() => {
'use strict';
const PRISTINE_HTML = document.documentElement.outerHTML;

/* ---------- Helfer ---------- */
const STORE = 'overload-v1';
/* Version dieses Uploads: bei JEDEM Deploy erhöhen (Format JJJJ.MM.TT.N) und oben in PATCH_NOTES beschreiben. */
const APP_VERSION = '2026.10.12.9';
const PATCH_NOTES = [
  {v: '2026.10.12.9', date: 'Update vom 12. Oktober 2026, Teil 7', items: [
    ['🌿', 'Ruhigere Karten und Tab-Leiste', '„Als Nächstes“ im Gym und „Nächster Lauf“ sind keine knallgrünen Flächen mehr, sondern dunkle Karten mit einem Hauch Akzent im Hintergrund und am Rand; Empfehlungen und Knöpfe haben wieder ihre gewohnten Farben. In der Tab-Leiste ist der aktive Tab nur noch dezent grau hinterlegt, Symbol und Name leuchten in der Akzentfarbe.'],
  ]},
  {v: '2026.10.12.8', date: 'Update vom 12. Oktober 2026, Teil 6', items: [
    ['✨', 'Wochenumfang: dezente Markierung', 'Beim Antippen einer Woche wird nicht mehr die ganze Spalte grau hinterlegt, sondern nur der Balken selbst bekommt einen dünnen hellen Rahmen.'],
  ]},
  {v: '2026.10.12.7', date: 'Update vom 12. Oktober 2026, Teil 5', items: [
    ['🎨', 'Wochenumfang ohne Grau', 'Beim Laufen sind die geplanten Minuten jetzt blass in der Farbe ihrer Phase (Comeback, Grundlage, Aufbau, Tapern in Lila) statt grau, die gelaufenen Minuten leuchten in voller Akzentfarbe darüber.'],
  ]},
  {v: '2026.10.12.6', date: 'Update vom 12. Oktober 2026, Teil 4', items: [
    ['👆', 'Diagramme zum Antippen', 'Tippe oder wische über Gewichtsverlauf, Wochenumfang beim Laufen, den Verlauf einer Übung und die Belastung pro Woche: Eine Markierung zeigt dir Datum und Wert, zum Beispiel Gewicht mit Wochenschnitt oder gelaufene gegen geplante Minuten. Beim Start ist immer der neueste Punkt gewählt.'],
    ['🔎', 'Zeitraum wählen', 'Beim Gewicht stellst du 4 Wochen, 8 Wochen, 6 Monate oder alles ein, beim Verlauf einer Übung die letzten 6, 12, 24 oder alle Trainings.'],
  ]},
  {v: '2026.10.12.5', date: 'Update vom 12. Oktober 2026, Teil 3', items: [
    ['🎨', 'Empfehlungen wieder farbig', 'Bei „Als Nächstes“ sieht man jetzt wieder auf einen Blick, was jede Übung braucht: ▲ mehr Gewicht (dunkel mit Lime), + mehr Wiederholungen (cyan), halten (blass), ▼ leichter (orange). Die Legende darunter zeigt dieselben Farben.'],
  ]},
  {v: '2026.10.12.4', date: 'Update vom 12. Oktober 2026, Teil 2', items: [
    ['🗓️', 'Gym-Wochenplan', 'Unter Einstellungen → Übungen und Vorlagen (und im Gym-Tab) legst du jetzt fest, was du an welchem Tag trainierst, zum Beispiel Dienstag Oberkörper, Mittwoch Beine. Tipp auf einen Wochentag, dann Vorlage wählen oder Ruhetag. Auch in jeder Vorlage kannst du ihre Trainingstage antippen. „Als Nächstes“ folgt danach deinem Plan.'],
    ['⏭️', 'Einheit auslassen', 'Keine Lust oder keine Zeit? Unter „Als Nächstes“ lässt du die Einheit mit einem Tipp aus, der Plan springt zur nächsten. Im Wochenplan kannst du es jederzeit zurücknehmen. Nächste Woche ist die Einheit ganz normal wieder dabei, deine Daten und der Verlauf bleiben unberührt.'],
  ]},
  {v: '2026.10.12.3', date: 'Update vom 12. Oktober 2026', items: [
    ['✨', 'Neues Design', 'Overload sieht jetzt ruhiger und runder aus: Die Tab-Leiste bleibt wie gewohnt am unteren Rand. „Als Nächstes“ im Gym und im Laufen-Tab ist eine große Akzentkarte. Gefällt dir der alte Look besser, wechselst du unter Mehr → Erscheinungsbild → Stil jederzeit zurück zu „Klassisch“. Deine Daten bleiben davon unberührt.'],
    ['🗓️', 'Heute mit Tagesplan', 'Heute zeigt deinen Tag jetzt als Zeitleiste: was schon erledigt ist (Mahlzeiten, Training, Schlaf), was als Nächstes ansteht und was noch offen ist. Darüber sitzen Schnellaktionen für Wasser, Essen, Gewicht und Aktivität. Seltenere Karten wie Wochenbericht, Freunde und Rezeptidee sind weiter unten gebündelt.'],
  ]},
  {v: '2026.10.09.2', date: 'Update vom 9. Oktober 2026, Teil 2', items: [
    ['🔒', 'Sicherheits-Update', 'Overload wurde auf Schwachstellen geprüft. Die App lässt jetzt nur noch ihren eigenen Code laufen, Daten von Freunden und aus Freigaben werden streng geprüft, bevor sie angezeigt werden, und neue Geräte bekommen eine sicherere ID. Du musst nichts tun, deine Daten bleiben unverändert.'],
  ]},
  {v: '2026.10.09.1', date: 'Update vom 9. Oktober 2026', items: [
    ['📚', 'Belastung an die Study App', 'Ist deine Lern-App verbunden, schickt Overload jetzt auch deine Belastung mit: wie anstrengend jede Einheit war (1 bis 10, von Overload geschätzt oder von dir eingestellt), die Punkte des Tages und dein 7:28-Verhältnis. Die Lern-App rechnet damit, wie viel Konzentration heute drin ist: eine lockere Einheit hilft dem Kopf, sehr hartes Training und eine hohe Belastung der letzten Woche kosten etwas davon. Schaltest du unter Hinweise die Belastung aus, schickt Overload sie nicht. Pulswerte, Übungen und Gewichte gehen weiterhin nie raus.'],
  ]},
  {v: '2026.10.08.2', date: 'Update vom 8. Oktober 2026, Teil 2', items: [
    ['🏅', 'Aktivität eintragen', 'Wie bei Strava: Im Gym-Tab, im Verlauf und auf Heute (Karte „Aktive Tage“) trägst du jetzt jede Sportart ein, z. B. Radfahren, Yoga, Fußball, Klettern oder eine eigene. Die Sportart muss Sinn ergeben (bekannte erkennt die App, bei anderen prüft sie kurz). Dauer ist Pflicht, optional sind Distanz, Ø und Max.-Puls, Kalorien (mit Vorschlag), Höhenmeter, Anstrengung und Notiz. Du entscheidest pro Aktivität, ob sie zur Belastung zählt.'],
    ['📈', 'Belastung anzeigen oder ausblenden', 'Alle Aktivitäten fließen in die Belastung der letzten 7 und 28 Tage ein. Unter Einstellungen → Hinweise kannst du die Belastung ein- und ausschalten. Aktivitäten erscheinen auch im Verlauf, in der Wochenübersicht, im Freunde-Feed (wenn du sie freigibst) und beim Wasserziel.'],
  ]},
  {v: '2026.10.08.1', date: 'Update vom 8. Oktober 2026', items: [
    ['🤝', 'Freunde neu gestaltet', 'Oben siehst du deine Woche mit Minuten, Platz und den Freunden auf einen Blick. Darunter drei Reiter: Aktivitäten (nach Tagen sortiert, mit Dauer, Strecke und Tempo groß dargestellt und Reaktionen zum Antippen), Wertung (diese oder letzte Woche, mit Vergleich zur Vorwoche) und Freunde (Liste, offene Anfragen, Hinzufügen). Anfragen stehen ganz oben mit großen Knöpfen.'],
  ]},
  {v: '2026.10.07.10', date: 'Update vom 7. Oktober 2026, Teil 8', items: [
    ['📍', 'Ortsname beim Wetter', 'Beim automatischen Standort zeigt das Wetter jetzt den Namen des Ortes an, z. B. „Berlin, Deutschland“, in der Zeile auf Heute, im Wetter-Blatt und in den Einstellungen.'],
  ]},
  {v: '2026.10.07.9', date: 'Update vom 7. Oktober 2026, Teil 7', items: [
    ['📍', 'Live-Lauf (Beta)', 'Für Tester: Im Laufen-Tab startet „Live-Lauf“ eine GPS-Aufzeichnung mit Distanz, Zeit, Tempo und Routen-Skizze. Ist heute eine Plan-Einheit offen, ist sie automatisch verknüpft und es gibt am Ziel einen Ton. Danach prüfst du den Eintrag und speicherst ihn. Der Bildschirm muss an bleiben, denn iOS liefert bei gesperrtem Handy keine Position.'],
  ]},
  {v: '2026.10.07.8', date: 'Update vom 7. Oktober 2026, Teil 6', items: [
    ['🤝', 'Freunde und Aktivitäten', 'Unter Einstellungen → Freunde und Aktivitäten (oder auf Heute, sobald es an ist) kannst du Freunde über ihren Namen finden. Nach Anfrage und Annehmen siehst du ihre Läufe und Trainings, kannst mit 👏 🔥 💪 ❤️ 😮 reagieren und die Wochenwertung ansehen. Standardmäßig aus. Du wählst, welche Arten (Gym, Laufen, Triathlon) und Angaben (Strecke, Tempo, Titel, Übungen) andere sehen, und kannst einzelne Aktivitäten ausblenden. Nie sichtbar: Gewichte, Puls, Schmerz, Notizen, Ernährung, Körpergewicht, Schlaf. Alles ist Ende-zu-Ende verschlüsselt, ausgeschaltet bist du nicht mehr findbar und dein Feed wird gelöscht.'],
    ['🔔', 'Neue Benachrichtigungen', 'Unter Benachrichtigungen gibt es „Freundschaften“ (Anfrage oder angenommen, standardmäßig an) und „Reaktionen“ (standardmäßig aus).'],
  ]},
  {v: '2026.10.07.7', date: 'Update vom 7. Oktober 2026, Teil 5', items: [
    ['📈', 'Belastung', 'Die neue Karte „Belastung“ auf Heute zeigt, wie hart du gerade trainierst im Vergleich zu dem, was dein Körper gewohnt ist: erholt, optimal, hoch oder sehr hoch. Grundlage sind deine Einheiten (Dauer mal Anstrengung). Die Anstrengung schätzt Overload aus Art der Einheit, Puls und Dauer, du kannst sie am Ende jedes Trainings und später im Blatt „Belastung“ anpassen. Schlaf, Schlafschuld, Essen, Schmerz und Krankheit fließen in die Erholung und die Empfehlung ein. Ab etwa 14 Tagen mit Einheiten. Eine Orientierung, keine medizinische Aussage.'],
    ['🌙', 'Schlaf im Detail', 'Tippe auf die Schlaf-Karte: Du kannst jetzt Bett- und Aufwachzeit eintragen (die Stunden rechnet Overload aus), die Nacht bewerten und frühere Nächte nachtragen. Dazu gibt es Durchschnitt, Schlafschuld, Regelmäßigkeit, Qualität, eine Grafik der letzten 14 Nächte und kurze Hinweise, was dir auffällt. Bei mehreren schlechten Nächten in Folge meldet sich „Heute wichtig“.'],
    ['✅', '„Heute wichtig“ wegklicken', 'Jeder Hinweis hat jetzt einen Haken. Tippst du ihn an, ist der Hinweis für heute erledigt, verschwindet und kommt auch nicht als Benachrichtigung. Morgen geht es neu los.'],
    ['🌤️', 'Wetter und Standort', 'Auf Heute siehst du das Wetter am Standort (Einstellungen → Wetter und Standort: automatisch, Ort von Hand oder aus). Bei Hitze gibt es einen Tipp zum Trinken und für Elektrolyte, das Wasserziel steigt ab gefühlt 30 °C, und bei Gewitter, Starkregen, Sturm, Glatteis, Schnee oder sehr schlechter Luft rät dir Overload, die geplante Einheit nach drinnen zu verlegen. Mit eingeschalteter Benachrichtigung „Heute wichtig“ meldet es sich passend, wenn es draußen kritisch wird. An den Wetterdienst gehen nur auf etwa 1 km gerundete Koordinaten, der Standort bleibt auf deinem Gerät.'],
  ]},
  {v: '2026.10.07.4', date: 'Update vom 7. Oktober 2026, Teil 4', items: [
    ['💡', '„Heute wichtig“ meldet sich sofort', 'Die Benachrichtigung kommt jetzt, sobald für heute etwas Wichtiges dazukommt, z. B. wenn nach dem Training Elektrolyte oder Kohlenhydrate fehlen, nicht erst zu einer festen Abendzeit. Höchstens einmal pro Tag, nie vor der Uhrzeit, die du unter „Frühestens um“ wählst, und nichts, was schon auf Heute steht.'],
  ]},
  {v: '2026.10.07.3', date: 'Update vom 7. Oktober 2026, Teil 3', items: [
    ['💡', '„Heute wichtig“ als Benachrichtigung', 'Unter Einstellungen → Benachrichtigungen gibt es jetzt „Heute wichtig“. Abends zu deiner Uhrzeit (Standard 18:00) meldet sich Overload, aber nur, wenn für heute wirklich etwas offen ist, z. B. Elektrolyte nach einem Training, Kohlenhydrate vor dem Long Run oder nach dem Training auffüllen. Höchstens eine pro Tag, einzeln abschaltbar. Der Hinweis selbst steht dann auf Heute; den Inhalt kennt nur dein Gerät.'],
  ]},
  {v: '2026.10.07.2', date: 'Update vom 7. Oktober 2026, Teil 2', items: [
    ['🔔', 'Benachrichtigungen, nur wenn nötig', 'Unter Einstellungen → Benachrichtigungen gibt es einen Hauptschalter und drei einzelne Arten: „Einheit heute“ (nur wenn an dem Tag noch eine Einheit aus deinem Laufplan oder Triathlon-Plan offen ist, zur Uhrzeit, die du wählst), „Pause vorbei“ (wenn dein Timer im Training abläuft und Overload nicht offen ist) und „Freigabe-Anfrage“ (jemand möchte Daten mit dir teilen). Sonst schickt Overload nichts. Auf dem iPhone brauchst du Overload auf dem Home-Bildschirm und iOS 16.4 oder neuer.'],
    ['🔒', 'Was der Server weiß', 'Der Overload-Server erfährt nur, dass und wann eine Nachricht kommen soll, nie, was du trainierst oder isst. Den Text setzt dein Gerät. Alles ist aus, bis du es einschaltest, und gilt pro Gerät.'],
  ]},
  {v: '2026.10.07.1', date: 'Update vom 7. Oktober 2026', items: [

function history(exId, n) {
  const out = [];
  for (let i = db.sessions.length - 1; i >= 0 && out.length < n; i--) {
    const s = db.sessions[i];
    if (s.deload) continue;   // Entlastungswoche zählt nicht für die Steigerung
    const e = s.entries.find(x => x.exId === exId);
    if (e && e.sets.length) out.push({session: s, sets: e.sets});
  }
  return out;
}
function suggest(ex) {
  if (!ex) return null;
  const h = history(ex.id, 2);
  if (!h.length) return null;
  const sets = h[0].sets;
  const cap = r => Math.min(r + 1, ex.repMax);
  if (sets.every(s => s.r >= ex.repMax))
    return {kind: 'up', title: `+${fmtN(ex.inc)} kg`, note: `Letztes Mal jeder Satz mit ${ex.repMax}+ Wdh. Zeit für mehr Gewicht.`, sets: sets.map(s => ({w: r2(s.w + ex.inc), r: ex.repMin}))};
  if (sets.every(s => s.r >= ex.repMin))
    return {kind: 'reps', title: '+1 Wdh.', note: 'Gleiches Gewicht, pro Satz eine Wiederholung mehr.', sets: sets.map(s => ({w: s.w, r: cap(s.r)}))};
  const top = Math.max(...sets.map(s => s.w));
  if (h[1] && top > 0) {
    const p = h[1].sets;
    if (Math.max(...p.map(s => s.w)) === top && !p.every(s => s.r >= ex.repMin))

  if (db.sessions.length) h += `<div class="group mt"><button class="row" data-act="awardsOpen" data-from="home"><span class="ic-box">${ICON.trophy}</span><span class="t"><b>Rekorde und Erfolge</b><span>${Object.keys(db.awards).length} Abzeichen, deine Bestwerte</span></span><span class="chev">${ICON.chev}</span></button></div>`;
  if (!db.sessions.length && !db.active) h += `<section class="demo-card"><p>Nach deinem ersten Training schlägt dir die App für jede Übung vor, was du beim nächsten Mal steigern kannst. Mit Beispieldaten siehst du das sofort.</p><button class="btn-secondary" data-act="demo">Beispieldaten laden</button></section>`;

      return `<li><span>${esc(ex.name)}</span>${sg ? `<span class="chip k-${sg.kind}">${fmtSet(sg.sets[0])}</span>` : `<span class="chip k-none">${ex.start ? fmtN(ex.start) + ' kg' : 'neu'}</span>`}</li>`;
    }).join('');
    const legend = kinds.size ? `<div class="legend">${['up', 'reps', 'hold', 'down'].filter(k => kinds.has(k)).map(k => `<span class="k-${k}"><i></i>${KLABEL[k]}</span>`).join('')}</div>` : '';

  }

  h += gymWeekSection();
  if (db.templates.length) h += coachCard('edit', 'KI-Coach', 'Plan ändern: Sätze, Wiederholungen, Übungen tauschen oder neue Vorlagen. Er kennt deinen Plan und deine letzten Gewichte.', COACH_TIPS.edit);
  h += `<section class="sec"><div class="sec-row"><h3 class="sec-h">Vorlagen</h3><button class="btn-text sm" data-act="tab" data-v="library">Bearbeiten</button></div><div class="group">`;

    const l = lastTplDate(t.id);
    return `<button class="row" data-act="start" data-t="${esc(t.id)}"><span class="t"><b>${esc(t.name)}</b><span>${t.exIds.length} ${t.exIds.length === 1 ? 'Übung' : 'Übungen'}</span></span><span class="r">${l ? relDay(l) : 'neu'}</span><span class="chev">${ICON.chev}</span></button>`;
  }).join('');
  h += `<button class="row" data-act="start" data-t=""><span class="plus-ic">${ICON.plus}</span><span class="t"><b>Freies Training</b><span>Ohne Vorlage, Übungen frei wählen</span></span><span class="chev">${ICON.chev}</span></button>`
    + `<button class="row" data-act="xaOpen"><span class="plus-ic">${ICON.plus}</span><span class="t"><b>Aktivität eintragen</b><span>Radfahren, Yoga, Fußball und mehr, mit Puls und Kalorien</span></span><span class="chev">${ICON.chev}</span></button></div></section>`;
  return h;
}

function vWorkout() {
  const a = db.active;
  let total = 0, done = 0;
  if (!a.rest) a.rest = Object.assign({}, db.settings.rest, {on: false});
  a.entries.forEach(e => { if (!e.skip) e.sets.forEach(s => { total++; if (s.done) done++; }); });
  const remSets = a.entries.filter(e => !e.skip).map(e => e.sets.filter(s => !s.done).length), remMin = done < total ? estMinutes(remSets, a.rest) : 0;
  let h = `<div class="wk-head"><button class="icon-btn" data-act="tab" data-v="home" aria-label="Zur Startseite">${ICON.back}</button><div class="wk-title">${ringHTML(total ? done / total : 0, 34, 5)}<div><h1>${esc(a.title)}</h1><p><span id="elapsed">${fmtDur(Date.now() - a.startedAt)}</span>&nbsp;&nbsp;${done}/${total}<span class="hide-sm"> Sätze</span></p></div></div><button class="icon-btn sm" data-act="restSheet" aria-label="Pausen-Timer">${ICON.clock}</button><button class="pill" data-act="finish">Beenden</button></div>`;
  if (lockerNow() || remMin) h += `<div class="wk-info">${lockerNow() ? lockerChip() : ''}${remMin ? `<span class="wk-est">${ICON.clock}noch ~${remMin} min · bis ${clockIn(remMin)}</span>` : ''}</div>`;
  if (!a.entries.length) h += `<div class="empty"><p>Füg deine erste Übung hinzu, um loszulegen.</p></div>`;
  a.entries.forEach((e, i) => { h += exCard(e, i); });
  h += `<div class="wk-foot"><button class="btn-secondary" data-act="addEx">${ICON.plus}<span>Übung hinzufügen</span></button><button class="btn-text danger" data-act="discard">Training verwerfen</button></div>`;
  return h + `<div id="restWrap">${restBarHTML()}</div><div id="restFullWrap">${restFullHTML()}</div>`;
}

function exCard(e, i) {
  const ex = db.exercises[e.exId];
  if (!ex) return '';
  if (e.skip) return `<article class="ex skipped"><div class="ex-head"><div><h2>${esc(ex.name)}</h2><p class="meta"><span>Heute ausgelassen</span></p></div><button class="btn-chip" data-act="exSkip" data-i="${i}">Doch machen</button></div></article>`;
  const sug = suggest(ex), last = history(ex.id, 1)[0];
  let h = `<article class="ex k-${sug ? sug.kind : 'none'}"><div class="ex-head"><div><h2>${esc(ex.name)}</h2><p class="meta"><span>Ziel ${ex.repMin}–${ex.repMax} Wdh.</span><span>${last ? `zuletzt ${relDay(last.session.date)}` : 'erstes Mal'}</span></p></div><button class="icon-btn" data-act="exMenu" data-i="${i}" aria-label="Optionen für ${esc(ex.name)}">${ICON.more}</button></div>`;
  h += sug
    ? `<div class="sug"><span class="sug-badge">${sug.title}</span><span class="sug-note">${esc(sug.note)}</span></div>`
    : `<div class="sug"><span class="sug-note">${ex.start ? `Startgewicht vom KI-Coach: ${fmtN(ex.start)} kg. Passt es nicht, trag einfach dein eigenes ein.` : 'Trag dein Startgewicht ein. Ab dem nächsten Training bekommst du hier Vorschläge.'}</span></div>`;
  h += `<div class="set-h"><span>Satz</span><span>Zuletzt</span><span>kg</span><span>Wdh.</span><span></span></div>`;
  e.sets.forEach((s, j) => {
    const p = deloadSet(sugFor(sug, j) || startSet(ex), ex), l = last ? last.sets[j] : null;
    h += `<div class="set${s.done ? ' done' : ''}"><span class="n">${j + 1}</span><span class="last">${l ? fmtSet(l) : '–'}</span>`
      + `<input class="num" type="text" inputmode="decimal" autocomplete="off" data-in="w" data-e="${i}" data-s="${j}" value="${s.w != null ? fmtN(s.w) : ''}" placeholder="${p ? fmtN(p.w) : '–'}" aria-label="Gewicht in kg, Satz ${j + 1}">`
      + `<input class="num" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" data-in="r" data-e="${i}" data-s="${j}" value="${s.r ?? ''}" placeholder="${p ? p.r : '–'}" aria-label="Wiederholungen, Satz ${j + 1}">`
      + `<button class="chk" data-act="check" data-e="${i}" data-s="${j}" aria-pressed="${s.done}" aria-label="Satz ${j + 1} abhaken">${ICON.check}</button></div>`;
  });
  h += `<div class="set-actions"><button class="btn-chip" data-act="addSet" data-e="${i}">${ICON.plus}Satz</button>${e.sets.length > 1 ? `<button class="btn-chip muted" data-act="rmSet" data-e="${i}" aria-label="Letzten Satz entfernen">− Satz</button>` : ''}<button class="btn-chip muted" data-act="exSkip" data-i="${i}">Heute auslassen</button></div></article>`;
  return h;
}

function vHistory() {
  let h = `<header class="lt">${backLink()}<h1>Verlauf</h1></header>` + `<button class="btn-secondary xa-add" data-act="xaOpen">${ICON.plus}<span>Aktivität eintragen</span></button>`;
  if (!db.sessions.length && !db.xact.length) return h + `<div class="empty"><p>Noch keine Trainings gespeichert. Sobald du eins beendest oder eine Aktivität einträgst, taucht es hier auf.</p><button class="btn-secondary" data-act="demo">Beispieldaten laden</button></div>`;
  let month = '';
  [...db.sessions.map(s => ({t: s.date, s})), ...db.xact.map(r => ({t: r.date, r}))].sort((a, b) => b.t - a.t).forEach(({s, r, t}) => {
    const m = new Date(t).toLocaleDateString('de-DE', {month: 'long', year: 'numeric'});
    if (m !== month) { month = m; h += `<h3 class="month">${esc(m)}</h3>`; }
    if (r) { h += xaCardHTML(r); return; }
    h += `<article class="sess"><div class="sess-h"><div><h2>${esc(s.title)}</h2><p>${esc(fmtDate(s.date))}</p></div><button class="icon-btn" data-act="sessMenu" data-id="${esc(s.id)}" aria-label="Training löschen">${ICON.more}</button></div>`
      + `<div class="sess-stats"><div><span>Dauer</span><b>${s.end ? fmtMin(s.end - s.date) : '–'}</b></div><div><span>Volumen</span><b>${fmtInt(sessVol(s))} kg</b></div><div><span>Sätze</span><b>${sessSets(s)}</b></div></div>`
      + `<ul class="sess-ex">${s.entries.map(e => `<li><span>${esc(db.exercises[e.exId]?.name || e.name)}</span><span>${esc(fmtSets(e.sets))}</span></li>`).join('')}</ul>`
      + (s.note ? `<p class="sess-note">📝 ${esc(s.note)}${s.noteAI ? '' : ' <i class="tag">privat</i>'}</p>` : '') + `</article>`;
  });
  return h;
}

function stepper(act, val, f = '') {
  return `<div class="stepper"><button data-act="${act}" data-f="${f}" data-d="-1" aria-label="Weniger">−</button><b>${val}</b><button data-act="${act}" data-f="${f}" data-d="1" aria-label="Mehr">+</button></div>`;
}

const RW = [[1, 1.5, 8], [1.5, 1.5, 6], [2, 1.5, 5], [2, 1, 6], [3, 1.5, 5], [4, 1.5, 4], [5, 1.5, 4], [6, 1, 4], [8, 1, 3], [10, 1, 3], [15, 1, 2]];

function nextPlanStart() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const ws = weekStartOf(t.getTime());
  return ws === t.getTime() ? ws : addDays(ws, 7);

function buildRunPlan(a) {
  const G = RGOALS[a.goal], days = [...a.days].sort((x, y) => x - y), d = days.length;
  let start = nextPlanStart();
  const race = G.km && a.raceDate ? keyToTs(a.raceDate, 9) : null;
  let N = G.weeks + (a.vol === 0 ? 4 : a.vol === 1 ? 2 : 0);
  if (race) {
    N = Math.round((weekStartOf(race) - start) / DAY / 7) + 1;
    if (N > 30) { start = addDays(weekStartOf(race), -29 * 7); N = 30; }
  }
  const cautious = a.inj !== 'none' || a.exp === 'new';
  const g = cautious ? 1.07 : 1.1, every = a.inj === 'now' ? 3 : 4;
  const vol = RVOL[a.vol][0], lng = a.vol ? RLONG[a.longest || 1][0] : 0;
  const peak = Math.min(G.peak * 1.5, Math.max(vol, G.peak * {2: .6, 3: .8, 4: 1, 5: 1.1, 6: 1.2}[d] * {new: .8, back: .9, reg: 1, exp: 1.15}[a.exp]));
  const easyCap = a.goal === 'm' ? 75 : 60;

  // Tage: Long Run bevorzugt am Samstag, Qualitätseinheit möglichst weit davon entfernt
  const longDow = days.includes(5) ? 5 : days.includes(6) ? 6 : days[d - 1];
  const cd = (x, y) => { const k = Math.abs(x - y); return Math.min(k, 7 - k); };
  const qDow = days.filter(x => x !== longDow).reduce((b, x) => b == null || cd(x, longDow) > cd(b, longDow) ? x : b, null);
  const pickDays = n => {
    const out = [longDow];
    if (n > 1 && qDow != null) out.push(qDow);
    while (out.length < n) {
      const rest = days.filter(x => !out.includes(x));
      out.push(rest.reduce((b, x) => Math.min(...out.map(o => cd(o, x))) > Math.min(...out.map(o => cd(o, b))) ? x : b));
    }
    return out;
  };

  // Laufen/Gehen am Anfang: Einsteiger, wenig Umfang oder aktuelle Beschwerden. Nie länger als der bisher längste Lauf.
  // Wer höchstens 15 min am Stück läuft oder gerade Beschwerden hat, startet mit Laufen/Gehen
  let level = a.vol === 0 ? (a.exp === 'new' ? 0 : 4) : a.vol === 1 ? (a.inj === 'now' ? 4 : 6) : a.inj === 'now' || lng < 20 ? 7 : null;
  if (level != null) while (level > 0 && RW[level][0] * RW[level][2] > Math.max(lng * 1.25, 8)) level--;
  const tw = G.km ? (race ? G.tw : 1) : 0;

  if (p.w) return `<rect class="ch-col" x="${(p.x - p.w / 2).toFixed(1)}" y="0" width="${p.w.toFixed(1)}" height="${c.H}" rx="3"/>`;
  return `<line class="ch-ln" x1="${p.x.toFixed(1)}" x2="${p.x.toFixed(1)}" y1="${c.top}" y2="${c.bot}"/>` + (p.y != null ? `<circle class="ch-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5"/>` : '');
}
function chBox(id, svg, c, sel) {
  CH[id] = c; c.sel = sel; c.top = c.top ?? 0; c.bot = c.bot ?? c.H;
  const p = c.pts[sel];
  return `<div class="ch" data-ch="${id}"><div class="ch-info">${p ? chInfo(p) : ''}</div>${svg.replace(/<\/svg>$/, `<g class="ch-mk" pointer-events="none">${p ? chMark(c, p) : ''}</g></svg>`)}</div>`;
}
function chShow(box, i) {
  const c = CH[box.dataset.ch], p = c && c.pts[i];
  if (!p || c.sel === i) return;
  c.sel = i;
  const inf = box.querySelector('.ch-info'), g = box.querySelector('.ch-mk');
  if (inf) inf.innerHTML = chInfo(p);
  if (g) g.innerHTML = chMark(c, p);
  box.querySelectorAll('[data-i]').forEach(e => e.classList.toggle('sel', +e.dataset.i === i));
}
function chIndex(box, ev) {
  const c = CH[box.dataset.ch];
  if (!c) return -1;
  if (c.html) { const el = document.elementFromPoint(ev.clientX, ev.clientY), q = el && el.closest && el.closest('[data-i]'); return q && box.contains(q) ? +q.dataset.i : -1; }
  const svg = box.querySelector('svg'), r = svg.getBoundingClientRect();
  if (!r.width) return -1;
  const x = (ev.clientX - r.left) / r.width * c.W;
  let bi = -1, bd = Infinity;
  c.pts.forEach((p, i) => { const d = Math.abs(p.x - x); if (d < bd) { bd = d; bi = i; } });
  return bi;
}
{
  let act = null;
  const boxOf = ev => ev.target.closest && ev.target.closest('.ch[data-ch]');
  document.addEventListener('pointerdown', ev => { const b = boxOf(ev); if (!b) return; act = b; const i = chIndex(b, ev); if (i >= 0) chShow(b, i); });
  document.addEventListener('pointermove', ev => {
    const b = ev.pointerType === 'mouse' ? boxOf(ev) : act;
    if (!b) return;
    const i = chIndex(b, ev);
    if (i >= 0) chShow(b, i);
  });
  ['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { act = null; }));
}
const chRangeBar = (c, opts, cur) => `<div class="seg ch-rng">${opts.map(([v, n]) => `<button class="${cur === v ? 'on' : ''}" data-act="chRange" data-c="${c}" data-v="${v}">${n}</button>`).join('')}</div>`;
const phC = c => c === '#D1D1D6' ? '#BF5AF2' : c;   // Tapern/Abschluss im Wochenumfang lila statt hellgrau
function runChart(Pl, cur) {
  const n = Pl.weeks.length, W = 340, H = 134, P = 6, top = 18, base = H - 22;
  const act = Pl.weeks.map((_, i) => runsInWeek(planWeekStart(Pl, i)).reduce((a, r) => a + r.min, 0));
  const pl = Pl.weeks.map((_, i) => planMin(Pl, i));
  const max = Math.max(...pl, ...act, 1);
  const bw = (W - 2 * P) / n;
  let s = `<text x="${P + 2}" y="12" font-size="10" fill="#8E8E93">${Math.round(max)} min</text><line x1="${P}" x2="${W - P}" y1="${top}" y2="${top}" stroke="#3A3A3C" stroke-dasharray="2 3"/>`;
  Pl.weeks.forEach((w, i) => {
    const x = P + i * bw, bx = x + bw * 0.14, bwid = bw * 0.72;
    const hp = pl[i] / max * (base - top), ha = act[i] / max * (base - top);
    s += `<rect x="${bx.toFixed(1)}" y="${(base - hp).toFixed(1)}" width="${bwid.toFixed(1)}" height="${hp.toFixed(1)}" rx="2" fill="${phC(Pl.phases[w.ph].c)}" fill-opacity=".42"/>`;
    if (ha > 0) s += `<rect x="${bx.toFixed(1)}" y="${(base - ha).toFixed(1)}" width="${bwid.toFixed(1)}" height="${ha.toFixed(1)}" rx="2" fill="#A7F432"/>`;
    s += `<rect x="${(x + 0.5).toFixed(1)}" y="${base + 5}" width="${(bw - 1).toFixed(1)}" height="4" rx="1" fill="${phC(Pl.phases[w.ph].c)}"/>`;
    if (i === cur) s += `<path d="M${(x + bw / 2).toFixed(1)} ${base + 12} l4 7 h-8 z" fill="#fff"/>`;
  });
  const now = Date.now();
  const pts = Pl.weeks.map((w, i) => {
    const ws = planWeekStart(Pl, i), ph = Pl.phases[w.ph];
    const bx = P + i * bw + bw * 0.14, bh = Math.max(3, Math.max(pl[i], act[i]) / max * (base - top));
    return {x: P + i * bw + bw / 2, w: bw, box: [bx, base - bh, bw * 0.72, bh], t: `Woche ${i + 1} · ${shortDate(ws)}–${shortDate(addDays(ws, 6))}`,
      v: `${ws > now ? 'geplant' : act[i] + ' von'} ${pl[i]} min${ph ? ' · ' + ph.n : ''}${w.deload ? ' · Entlastung' : ''}`};
  });
  return chBox('run', `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Geplante und gelaufene Minuten pro Woche, antippen für Werte">${s}</svg>`, {W, H, pts}, Math.max(0, Math.min(n - 1, cur)));
}

let rd = null;
function openRunLog(o = {}) {

}

    + `<div><label class="lbl" for="runKm">Distanz in km</label><input id="runKm" class="field" type="text" inputmode="decimal" autocomplete="off" data-in="runKm" value="${esc(rd.km)}" placeholder="optional"></div></div>`
    + `<label class="lbl" for="runHr">Ø Puls</label><input id="runHr" class="field" type="text" inputmode="numeric" autocomplete="off" data-in="runHr" value="${esc(rd.hr)}" placeholder="optional, Zone 2 ist ${db.run.z2lo}–${db.run.z2hi}">`
    + `<label class="lbl">${painName() ? esc(painName()) + '-Schmerz' : 'Schmerz'}, 0 bis 10</label><div class="seg pain">${Array.from({length: 11}, (_, v) => `<button class="${rd.pain === v ? 'on' : ''}${v >= 3 ? ' hi' : ''}" data-act="runPain" data-v="${v}" aria-label="Schmerz ${v}">${v}</button>`).join('')}</div>`
    + `<p class="hint">${rd.pain >= 3 ? 'Ab 3 von 10 lieber nicht steigern. Der Plan erinnert dich daran.' : 'Zähl auch Schmerzen am nächsten Morgen mit.'}${rd.planned ? ` Leeres Zeitfeld übernimmt die geplanten ${rd.planned} min.` : ''}</p>`;
  h += rpeRow('run', rd.rpe, estRpe('run', {hr: rd.hr, type: rd.type, slot: rd.slot})) + noteFields('run', rd.note, rd.noteAI);
  if (rd.id) h += `<button class="btn-text danger wide mt" data-act="delRun">Lauf löschen</button>`;
  openSheet(h, keep, true);

/* ---------- Gewicht ---------- */
const WR = {cut: [-1, -0.5], hold: [-0.3, 0.3], bulk: [0.25, 0.5]};
const WRT = {cut: '−0,5 bis −1 %', hold: '±0,3 %', bulk: '+0,25 bis +0,5 %'};
const WMODE = {cut: 'abnehmen', hold: 'halten', bulk: 'zunehmen'};
const fmtKg = v => (Number(v) || 0).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' kg';
const fmtPct = p => Math.abs(p) < 0.05 ? '±0,0 %' : (p > 0 ? '+' : '−') + Math.abs(p).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' %';
function weightWeeks() {
  const map = {};
  Object.entries(db.weights).forEach(([k, v]) => { const ws = weekStartOf(keyToTs(k)); (map[ws] = map[ws] || []).push(v); });
  return Object.keys(map).map(Number).sort((a, b) => a - b).map(ws => ({ws, n: map[ws].length, avg: map[ws].reduce((a, b) => a + b, 0) / map[ws].length}));
}
function weightDir() {
  const g = db.weightGoal, ww = weightWeeks();
  if (!g || !ww.length) return 'hold';
  const d = g.target - ww[ww.length - 1].avg;
  return d < -0.5 ? 'cut' : d > 0.5 ? 'bulk' : 'hold';
}
function recommend(pct, dir) {
  const [lo, hi] = WR[dir];
  if (pct < lo) return {cls: 'k-down', title: 'Etwas mehr essen', text: dir === 'cut'
    ? 'Du nimmst schneller ab als geplant. Rund 150–200 kcal mehr am Tag schützen Muskeln und Laufleistung.'
    : dir === 'hold' ? 'Du hast leicht abgenommen. Rund 150 kcal mehr am Tag, um dein Gewicht zu halten.'
    : 'Du nimmst langsamer zu als geplant. Rund 150–200 kcal mehr am Tag.'};
  if (pct > hi) return {cls: 'k-reps', title: 'Etwas weniger essen', text: dir === 'cut'
    ? 'Du nimmst langsamer ab als geplant. Rund 150–200 kcal weniger am Tag bringen dich zurück in den Zielbereich.'
    : dir === 'hold' ? 'Du hast leicht zugenommen. Rund 150 kcal weniger am Tag, um dein Gewicht zu halten.'
    : 'Du nimmst schneller zu als nötig, der Überschuss landet eher als Fett. Rund 150–200 kcal weniger am Tag.'};
  return {cls: 'k-up', title: dir === 'hold' ? 'Gewicht gehalten' : 'Passt, so weiter', text: dir === 'cut'
    ? 'Du nimmst in einem gesunden Tempo ab. Kalorien so lassen.'
    : dir === 'hold' ? 'Dein Schnitt ist stabil. Kalorien so lassen.'
    : 'Du baust in einem sauberen Tempo auf. Kalorien so lassen.'};
}

function goalProgress(target, from, to) {
  const d0 = Math.abs(target - from), d1 = Math.abs(target - to), ch = d0 - d1;
  if (d1 <= 0.5) return `<p class="v-note">Du bist im Zielbereich, noch ${fmtKg(d1)} bis ${fmtKg(target)}.</p>`;
  if (Math.abs(ch) < 0.05) return `<p class="v-note">Abstand zum Ziel unverändert: noch ${fmtKg(d1)}.</p>`;
  return `<p class="v-note">${ch > 0 ? `Dem Ziel ${fmtKg(ch)} näher gekommen` : `${fmtKg(-ch)} weiter weg vom Ziel`}, noch ${fmtKg(d1)}.</p>`;
}

function vWeight() {
  const tk = dateKey(Date.now()), tv = db.weights[tk];
  const keys = Object.keys(db.weights).sort(), lastV = keys.length ? db.weights[keys[keys.length - 1]] : null;
  const ww = weightWeeks(), cws = weekStartOf(Date.now());
  const done = ww.filter(w => w.ws < cws), last = done[done.length - 1], prev = done[done.length - 2], cur = ww.find(w => w.ws === cws);
  const dir = weightDir(), g = db.weightGoal;
  let h = bodySeg() + `<header class="lt"><p class="date">${todayLine()}</p><h1>Gewicht</h1></header>`;

  h += `<section class="wt-today"><label class="lbl" for="wtIn">${tv != null ? 'Heute gemessen' : 'Heute morgen'}</label><div class="wt-row"><input id="wtIn" class="wt-in" type="text" inputmode="decimal" autocomplete="off" value="${tv != null ? fmtN(tv) : ''}" placeholder="${lastV != null ? fmtN(lastV) : '0,0'}" aria-label="Gewicht heute in kg"><span class="wt-unit">kg</span><button class="pill" data-act="saveWeight">${tv != null ? 'Ändern' : 'Speichern'}</button></div><p class="hint">Direkt nach dem Aufstehen, nach der Toilette und vor dem Frühstück.</p></section>`;

  h += `<section class="sec"><h3 class="sec-h">Wochenbilanz</h3>`;
  if (last && prev) {
    const pct = (last.avg - prev.avg) / prev.avg * 100, rec = recommend(pct, dir);
    h += `<div class="verdict ${rec.cls}"><div class="v-top"><span class="v-pct">${fmtPct(pct)}</span><span class="v-lbl">Woche ${shortDate(last.ws)}–${shortDate(addDays(last.ws, 6))} zur Vorwoche</span></div><h2>${rec.title}</h2><p>${rec.text}</p>`
      + `<div class="v-stats"><div><span>Ø letzte Woche</span><b>${fmtKg(last.avg)}</b></div><div><span>Ø Vorwoche</span><b>${fmtKg(prev.avg)}</b></div><div><span>Ziel pro Woche</span><b>${WRT[dir]}</b></div></div>`
      + (g ? goalProgress(g.target, prev.avg, last.avg) : '')
      + (last.n < 4 || prev.n < 4 ? '<p class="v-note">Wenige Messungen, der Schnitt ist noch ungenau. Ideal sind 5 bis 7 pro Woche.</p>' : '')
      + (!g ? '<p class="v-note">Ohne Zielgewicht bewertet die App aufs Halten.</p>' : '') + `</div>`;
  } else {
    h += `<div class="notice k-none"><p>Nach zwei vollen Wochen mit Messungen bekommst du hier jeden Montag deine Bilanz: mehr essen, weniger essen oder so weitermachen.</p></div>`;
  }
  if (cur) h += `<p class="cur-week">Diese Woche bisher: Ø ${fmtKg(cur.avg)} aus ${cur.n} ${cur.n === 1 ? 'Messung' : 'Messungen'}${last ? `, ${fmtPct((cur.avg - last.avg) / last.avg * 100)} zur Vorwoche (vorläufig)` : ''}.</p>`;
  h += `</section>`;

  h += `<section class="sec"><div class="sec-row"><h3 class="sec-h">Zielgewicht</h3>${g ? '<button class="btn-text sm" data-act="editGoal">Ändern</button>' : ''}</div>`;
  if (!g) {
    h += `<div class="demo-card"><p>Leg dein Zielgewicht fest. Daraus erkennt die App, ob du abnehmen, halten oder zunehmen willst, und passt die Wochenbilanz an.</p><button class="btn-secondary" data-act="editGoal">Zielgewicht festlegen</button></div>`;
  } else {
    const ref = ww.length ? ww[ww.length - 1].avg : null, diff = ref != null ? g.target - ref : null;
    let eta = '';
    if (ref != null && dir !== 'hold') { const rate = (dir === 'cut' ? 0.0075 : 0.00375) * ref; eta = `, bei empfohlenem Tempo in etwa ${Math.max(1, Math.round(Math.abs(diff) / rate))} Wochen`; }
    h += `<div class="goal"><div class="g3"><div><span>Ziel</span><b>${fmtKg(g.target)}</b></div><div><span>Aktuell Ø</span><b>${ref != null ? fmtKg(ref) : '–'}</b></div><div><span>${diff != null && diff > 0 ? 'Noch zunehmen' : 'Noch abnehmen'}</span><b>${diff != null ? fmtKg(Math.abs(diff)) : '–'}</b></div></div><p class="goal-sub">${ref == null ? 'Trag dein erstes Gewicht ein, dann rechnet die App los.' : dir === 'hold' ? 'Du bist im Zielbereich, jetzt heißt es halten.' : `Modus ${WMODE[dir]}, Ziel ${WRT[dir]} pro Woche${eta}.`}</p></div>`;
  }
  h += `</section>`;

  const chart = weightChart();
  if (chart) h += `<section class="sec"><h3 class="sec-h">Verlauf</h3>${chart}</section>`;

  const wwDesc = [...ww].reverse().slice(0, 8);
  if (wwDesc.length) h += `<section class="sec"><h3 class="sec-h">Wochenschnitt</h3><div class="group">${wwDesc.map((w, i) => {
    const p = wwDesc[i + 1], pct = p ? (w.avg - p.avg) / p.avg * 100 : null;
    return `<div class="row"><span class="t"><b>${shortDate(w.ws)}–${shortDate(addDays(w.ws, 6))}${w.ws === cws ? ', läuft' : ''}</b><span>${w.n} ${w.n === 1 ? 'Messung' : 'Messungen'}</span></span><span class="wk-avg"><b>${fmtKg(w.avg)}</b>${pct != null ? `<span>${fmtPct(pct)}</span>` : ''}</span></div>`;
  }).join('')}</div></section>`;

  const recK = keys.slice(-10).reverse();
  if (recK.length) h += `<section class="sec"><h3 class="sec-h">Messungen</h3><div class="group">${recK.map(k => `<button class="row" data-act="editWeight" data-k="${k}"><span class="t"><b>${esc(new Date(keyToTs(k)).toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'short'}))}</b></span><span class="r num-r">${fmtKg(db.weights[k])}</span><span class="chev">${ICON.chev}</span></button>`).join('')}</div></section>`;
  return h;
}

function weightChart() {
  const cws = weekStartOf(Date.now());
  const all = Object.entries(db.weights).map(([k, v]) => ({t: keyToTs(k), v})).sort((a, b) => a.t - b.t);
  if (all.length < 2) return '';
  const wkN = chR.wt || Math.max(4, Math.round((cws - weekStartOf(all[0].t)) / (7 * 864e5)) + 1);
  const t0 = addDays(cws, -(wkN - 1) * 7), t1 = addDays(cws, 7);
  const rng = chRangeBar('wt', [[4, '4 Wochen'], [8, '8 Wochen'], [26, '6 Monate'], [0, 'Alles']], chR.wt);
  const pts = all.filter(p => p.t >= t0);
  if (pts.length < 2) return rng + `<p class="hint">In diesem Zeitraum gibt es zu wenige Messungen.</p>`;
  const wwAll = weightWeeks(), ww = wwAll.filter(w => w.ws >= t0);
  let mn = Math.min(...pts.map(p => p.v)), mx = Math.max(...pts.map(p => p.v));
  const g = db.weightGoal ? db.weightGoal.target : null;
  const showG = g != null && g >= mn - 1.5 && g <= mx + 1.5;
  if (showG) { mn = Math.min(mn, g); mx = Math.max(mx, g); }
  if (mx - mn < 1) { const c = (mx + mn) / 2; mn = c - 0.5; mx = c + 0.5; }
  const W = 340, H = 154, L = 36, R = 10, T = 12, B = 16;
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (mx - v) / (mx - mn) * (H - T - B);
  const dense = pts.length > 60, rd = dense ? 1.6 : 2.6, rw = ww.length > 14 ? 2.6 : 3.8;
  let s = '';
  [mx, (mx + mn) / 2, mn].forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#3A3A3C" stroke-width=".6"/><text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" font-size="10" fill="#8E8E93" text-anchor="end">${fmtN(Math.round(v * 10) / 10)}</text>`; });
  s += `<text x="${L}" y="${H - 3}" font-size="10" fill="#8E8E93">${shortDate(t0)}</text><text x="${W - R}" y="${H - 3}" font-size="10" fill="#8E8E93" text-anchor="end">${shortDate(addDays(cws, 6))}</text>`;
  if (showG) s += `<line x1="${L}" x2="${W - R}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="#3DDCEB" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  pts.forEach(p => { s += `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${rd}" fill="#8E8E93"/>`; });
  const mid = w => X(addDays(w.ws, 3) + 12 * 3600e3).toFixed(1);
  if (ww.length) s += `<polyline points="${ww.map(w => `${mid(w)},${Y(w.avg).toFixed(1)}`).join(' ')}" fill="none" stroke="#A7F432" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` + ww.map(w => `<circle cx="${mid(w)}" cy="${Y(w.avg).toFixed(1)}" r="${rw}" fill="#A7F432"/>`).join('');
  const cp = pts.map(p => {
    const wk = wwAll.find(w => w.ws === weekStartOf(p.t));
    return {x: X(p.t), y: Y(p.v), t: new Date(p.t).toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'short'}), v: fmtKg(p.v) + (wk ? ` · Ø Woche ${fmtKg(wk.avg)}` : '')};
  });
  return rng + chBox('wt', `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf, antippen für Werte">${s}</svg>`, {W, H, top: T, bot: H - B, pts: cp}, cp.length - 1)
    + `<div class="legend chart-leg"><span style="--k:#8E8E93"><i></i>Tageswerte</span><span style="--k:var(--lime)"><i></i>Wochenschnitt</span>${showG ? '<span style="--k:var(--cyan)"><i></i>Ziel</span>' : ''}</div>`;
}

let wk = null;
function openWeightEdit(k) {
  wk = k;
  openSheet(`<div class="sheet-h"><button class="btn-text" data-act="closeSheet">Abbrechen</button><h2>${esc(new Date(keyToTs(k)).toLocaleDateString('de-DE', {weekday: 'short', day: 'numeric', month: 'short'}))}</h2><button class="btn-text strong" data-act="saveWeightEdit">Speichern</button></div><label class="lbl" for="weIn">Gewicht in kg</label><input id="weIn" class="field" type="text" inputmode="decimal" autocomplete="off" value="${fmtN(db.weights[k])}"><button class="btn-text danger wide" data-act="delWeight">Messung löschen</button>`);
}

/* Der Schlüssel liegt bewusst NICHT in overload-v1: nicht im Backup, nur auf diesem Gerät.
   Groq ist kostenlos mit Limits pro Modell (Stand 09/2026: 30 Anfragen/Minute, 1.000/Tag, 8.000 Tokens/Minute).
   Ist ein Modell überlastet oder am Limit, versucht aiFetch() das nächste aus der Liste. */
const AI_STORE = 'ovl-groq', AI_URL = 'https://api.groq.com/openai/v1/chat/completions';
const AI_MODELS = {photo: ['qwen/qwen3.8-27b'], text: ['openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'qwen/qwen3.8-27b'], coach: ['openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'qwen/qwen3.8-27b']};
function aiCfg() {
  try { return Object.assign({key: ''}, JSON.parse(localStorage.getItem(AI_STORE) || '{}')); } catch (e) { return {key: ''}; }
}
function aiSave(c) { try { localStorage.setItem(AI_STORE, JSON.stringify(c)); } catch (e) {} }
/* Weg der KI-Anfragen bei eigenem Schlüssel (pro Gerät): 'auto' = direkt zu Groq, bei Sperre (z. B. Hongkong/China) automatisch über den
   Overload-Server; 'server' = immer über den Server. Der Server läuft fest in Frankfurt (forceFunctionRegion), damit Groq einen deutschen Zugang sieht. */
const AI_ROUTE_STORE = 'ovl-ai-route', AI_REGION = 'eu-central-1';
let aiBlocked = false;   // Groq hat in dieser Sitzung direkt nicht geantwortet
const aiRoute = () => { try { return localStorage.getItem(AI_ROUTE_STORE) === 'server' ? 'server' : 'auto'; } catch (e) { return 'auto'; } };
const AI_PROMPT = 'Du bist Ernährungsexperte. Analysiere das Foto einer Mahlzeit und schätze die Nährwerte der GESAMTEN abgebildeten Portion. '
  + 'Schätze die Menge anhand von Teller, Besteck, Händen oder Verpackung. Ist eine Nährwerttabelle oder Verpackung lesbar, nutze deren Angaben und rechne auf die abgebildete Menge um. '
  + 'Denk an Öl, Butter und Soßen. Gib einen kurzen deutschen Namen (höchstens 40 Zeichen). '
  + 'Ist kein Essen zu sehen, setze name auf "Kein Essen erkannt" und alle Werte auf 0. '
  + 'Schätze auch Wasser (g), Ballaststoffe, Zucker, gesättigte Fette und Salz (g) sowie Kalium, Magnesium, Calcium, Eisen und Vitamin C (mg). quality: 2 = unverarbeitet und nährstoffreich, 1 = neutral, 0 = stark verarbeitet oder viel Zucker/Fett/Salz. '
  + 'Antworte nur mit JSON in genau dieser Form: {"name": "…", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0, "water": 0, "fiber": 0, "sugar": 0, "satfat": 0, "salt": 0, "potassium": 0, "magnesium": 0, "calcium": 0, "iron": 0, "vitc": 0, "quality": 1} (kcal ganze Zahl, Makros in Gramm, alles für die ganze Portion).';
const AI_WHO = {text: ['Die KI-Schätzung', 'Ziele und Einstellungen → Foto-Erkennung', 'der KI-Schätzung'], photo: ['Die Foto-Erkennung', 'Ziele und Einstellungen → Foto-Erkennung', 'der Foto-Erkennung'], coach: ['Der KI-Coach', 'Einstellungen → Übungen → KI-Schlüssel', 'des KI-Coachs']};
const wait = ms => new Promise(r => setTimeout(r, ms));
/* Liefert {out, txt}: out ist das geparste JSON der Antwort */
async function aiFetch(messages, who, opts) {
  const c = aiCfg(), [nm, where, gen] = AI_WHO[who], proxy = !c.key || (AI_PROXY() && (aiRoute() === 'server' || aiBlocked));
  if (proxy && !AI_PROXY()) throw new Error(who === 'photo' ? 'Richte zuerst die Foto-Erkennung ein.' : 'Richte zuerst den KI-Schlüssel ein.');
  let last = `${nm} ist gerade überlastet. Versuch es in ein paar Minuten nochmal.`;
  // Jedes Modell erst mit Denk-Einstellungen, bei Fehler 400 (Parameter nicht unterstützt) noch einmal schlicht
  const tries = AI_MODELS[who].flatMap(model => [[model, true], [model, false]]);
  for (let ti = 0; ti < tries.length; ti++) {
    const [model, extra] = tries[ti];
    const body = {model, messages, response_format: {type: 'json_object'}, temperature: opts.temperature, max_completion_tokens: opts.max};
    if (extra) Object.assign(body, model.startsWith('qwen/') ? {reasoning_format: 'hidden', reasoning_effort: 'none'} : {include_reasoning: false, reasoning_effort: 'low'});
    let res = null, j = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), opts.timeout || 45000);
      try {
        res = proxy
          ? await fetch(`${SYNC.url.replace(/\/$/, '')}/functions/v1/ai?forceFunctionRegion=${AI_REGION}`, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'application/json', apikey: SYNC.key}, body: JSON.stringify({device: devInfo().id, body})})
          : await fetch(AI_URL, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'application/json', Authorization: `Bearer ${c.key}`}, body: JSON.stringify(body)});
        j = await res.json().catch(() => null);
        if (proxy && res.headers.get('x-ovl-used')) { try { localStorage.setItem('ovl-ai-used', JSON.stringify({day: dateKey(Date.now()), used: +res.headers.get('x-ovl-used'), limit: +res.headers.get('x-ovl-limit') || 0})); } catch (e) {} }
      } catch (e) {
        clearTimeout(timer);
        if (!proxy && AI_PROXY() && navigator.onLine && e.name !== 'AbortError') { aiBlocked = true; toast('Groq ist hier gesperrt, die KI läuft jetzt über den Overload-Server'); return aiFetch(messages, who, opts); }
        if (e.name !== 'AbortError') throw new Error(navigator.onLine ? 'Der KI-Server ist gerade nicht erreichbar. Versuch es in ein paar Minuten nochmal.' : `Keine Verbindung. Für ${who === 'photo' ? 'die Auswertung' : 'den KI-Coach'} brauchst du Internet.`);
        res = null; last = `${nm} antwortet nicht. Versuch es gleich nochmal.`;
        break;
      }
      clearTimeout(timer);
      const ra = +res.headers.get('retry-after') || 0;
      if (attempt === 0 && res.status === 429 && ra && ra <= 8) { await wait(ra * 1000 + 200); continue; }   // kurzes Minutenlimit: einmal warten
      if (attempt === 0 && res.status >= 500) { await wait(1500); continue; }
      break;
    }
    if (!res) { if (extra) ti++; continue; }
    if (res.ok) {
      const txt = String(j?.choices?.[0]?.message?.content || '').replace(/^```(?:json)?\s*|\s*```$/g, '').trim();
      try { return {out: JSON.parse(txt), txt}; } catch (e) { last = 'Die Antwort war unvollständig. Versuch es nochmal.'; if (extra) ti++; continue; }
    }
    const msg = String(j?.error?.message || ''), st = res.status;
    if (proxy && j?.error?.code === 'ovl_quota') throw new Error(j.error.reason === 'device' ? 'Dieses Gerät ist noch nicht angemeldet. Öffne die App kurz mit Internet und versuch es dann nochmal.' : `Dein Tageslimit für die KI ist erreicht (${j.error.limit || ''} Anfragen). Morgen geht es weiter, oder hinterleg unter Einstellungen → KI einen eigenen kostenlosen Schlüssel.`);
    if (proxy && (st === 404 || j?.error?.code === 'ovl_nokey')) throw new Error('Die KI über den Overload-Server ist gerade nicht eingerichtet. Hinterleg unter Einstellungen → KI einen eigenen kostenlosen Schlüssel.');
    if (proxy && (st === 401 || st === 403)) throw new Error('Die KI über den Overload-Server funktioniert gerade nicht. Sag dem Admin Bescheid oder nutz einen eigenen Schlüssel (Einstellungen → KI).');
    if (!proxy && AI_PROXY() && (st === 403 || /country|region|territor|location|not available in your/i.test(msg))) { aiBlocked = true; toast('Groq ist hier gesperrt, die KI läuft jetzt über den Overload-Server'); return aiFetch(messages, who, opts); }
    if (st === 400 && extra && !/json_validate/i.test(j?.error?.code || msg)) continue;   // schlicht nochmal versuchen
    if (extra) ti++;   // sonst gleich zum nächsten Modell
    if (st === 401 || st === 403 || /api key/i.test(msg)) throw new Error(`Der Schlüssel wird nicht akzeptiert. Prüf ihn unter ${where}.`);
    if (st === 429) last = `Limit ${gen} erreicht. Warte ein, zwei Minuten und versuch es nochmal. Ist das Tageslimit voll, geht es erst später wieder.`;
    else if (st >= 500) last = `${nm} ist gerade überlastet (Fehler ${st}). Versuch es in ein paar Minuten nochmal.`;
    else last = `Fehler ${who === 'photo' ? 'bei der Foto-Erkennung' : 'beim KI-Coach'} ${st}` + (msg ? ': ' + msg.slice(0, 120) : '');
  }
  throw new Error(last);
}
/* Beschreiben: Lebensmittel aus freiem Text schätzen, Ergebnis als Werte pro 100 g plus geschätzte Menge */
const AI_TEXT_PROMPT = 'Du bist Ernährungsexperte. Der Nutzer beschreibt auf Deutsch, was er gegessen oder getrunken hat. Schätze realistische Nährwerte für GENAU diese Menge. '
  + 'Fehlt die Menge, nimm eine übliche Portion an. Bei Marken, Fast Food oder Restaurantgerichten (z. B. Döner, Big Mac) nutze typische Angaben. Denk an Öl, Butter und Soßen, wenn sie dazugehören. '
  + 'grams ist das Gesamtgewicht der Menge in Gramm (bei Getränken ml). Ist es kein Essen oder Getränk, setze name auf "Nicht erkannt" und alle Werte auf 0. '
  + 'Schätze auch Wasser (g), Ballaststoffe, Zucker, gesättigte Fette und Salz (g) sowie Kalium, Magnesium, Calcium, Eisen und Vitamin C (mg), alles für die ganze Menge. quality: 2 = unverarbeitet und nährstoffreich, 1 = neutral, 0 = stark verarbeitet oder viel Zucker/Fett/Salz. '
  + 'Antworte nur mit JSON in genau dieser Form: {"name": "kurzer deutscher Name, höchstens 40 Zeichen", "grams": 0, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0, "water": 0, "fiber": 0, "sugar": 0, "satfat": 0, "salt": 0, "potassium": 0, "magnesium": 0, "calcium": 0, "iron": 0, "vitc": 0, "quality": 1, "note": "ein kurzer Satz, welche Menge du angenommen hast"}';
const aiMicro = out => { const n = v => Math.max(0, Math.round((+v || 0) * 10) / 10), mi = {wa: n(out.water), fib: n(out.fiber), sug: n(out.sugar), sfa: n(out.satfat), salt: n(out.salt), k: n(out.potassium), mg: n(out.magnesium), ca: n(out.calcium), fe: n(out.iron), vc: n(out.vitc)}; return {mi: Object.values(mi).some(v => v > 0) ? mi : null, q: [0, 1, 2].includes(+out.quality) ? +out.quality : 1}; };
async function askTextAI(text) {
  const {out} = await aiFetch([{role: 'user', content: AI_TEXT_PROMPT + '\nBeschreibung: ' + text}], 'text', {temperature: 0.2, max: 1500, timeout: 45000});
  const n = v => Math.max(0, Math.round((+v || 0) * 10) / 10);
  return {name: String(out.name || text).slice(0, 60), g: n(out.grams), kcal: n(out.kcal), p: n(out.protein ?? out.p), c: n(out.carbs ?? out.c), f: n(out.fat ?? out.f), note: String(out.note || '').slice(0, 160), ...aiMicro(out)};
}
async function askPhotoAI(dataUrl, hint) {
  const {out} = await aiFetch([{role: 'user', content: [{type: 'text', text: AI_PROMPT + (hint ? `\nZusatzinfo vom Nutzer: ${hint}` : '')}, {type: 'image_url', image_url: {url: dataUrl}}]}], 'photo', {temperature: 0.2, max: 500, timeout: 45000});
  const n = v => Math.max(0, Math.round((+v || 0) * 10) / 10);
  return {name: String(out.name || '').slice(0, 60), kcal: Math.round(n(out.kcal)), p: n(out.protein ?? out.p), c: n(out.carbs ?? out.c), f: n(out.fat ?? out.f), ...aiMicro(out)};
}

function shrinkImage(file, max = 1024, q = 0.8) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Foto konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

function foodScore(list) {

    ['Protein', 8, cl((N.s.p * 4 / k - 0.10) / 0.12)],

const cbF = () => { const cb = db.settings.comeback; if (!cb) return 1; return Array.isArray(cb.gym) ? cb.gym[Math.min(cbWeek(), cb.gym.length - 1)] : cb.f; };
const cbRun = () => { const cb = db.settings.comeback; return cb && Array.isArray(cb.run) ? cb.run[Math.min(cbWeek(), cb.run.length - 1)] : 0.6; };
const pctL = f => Math.round((1 - f) * 100), pctR = f => Math.round(f * 100);

function endPause(auto) {
  const P = db.settings.pause;
  if (!P) return;
  const days = (Date.now() - P.from) / DAY, hard = P.type === 'sick' || P.type === 'injury';
  db.settings.pause = null;
  // Wiedereinstieg nach Art und Dauer der Pause. Laufen angelehnt an Daniels (bis 5 Tage voll, 6–28 Tage erst 50 dann 75 %, länger in drei Stufen),
  // Ausdauer sinkt nach 2–4 Wochen spürbar, Kraft bleibt etwa 3 Wochen weitgehend erhalten (Mujika & Padilla 2000, McMaster et al. 2013).
  const cbp = days >= 56 ? {gym: [0.7, 0.8, 0.9], run: [0.4, 0.6, 0.8]} : days >= 21 ? {gym: [0.8, 0.9], run: [0.5, 0.75]}
    : days >= 7 ? {gym: [hard ? 0.85 : 0.9], run: [hard ? 0.6 : 0.65]} : hard ? {gym: [0.9], run: [0.75]} : null;
  if (cbp) db.settings.comeback = {from: keyToTs(dateKey(Date.now()), 0), until: keyToTs(dateKey(addDays(Date.now(), 7 * cbp.gym.length)), 0), type: P.type, f: cbp.gym[0], gym: cbp.gym, run: cbp.run};
  saveDB();
  const cb = db.settings.comeback, nW = cb && cb.gym ? cb.gym.length : 1, steps = (a, fn) => a.length > 1 ? `, danach ${a.slice(1).map(fn).join(' und ')} %` : '';
  if (cb && comebackActive()) setTimeout(() => openSheet(`<div class="pn-hero"><span>💪</span><b>Willkommen zurück!</b><small>${auto ? 'Deine Pause ist vorbei. ' : ''}${nW > 1 ? `Die nächsten ${nW} Wochen sind ein lockerer Wiedereinstieg, Woche für Woche etwas mehr:` : 'Die nächsten 7 Tage sind eine Comeback-Woche:'}</small></div>`
    + `<div class="pn-item"><span class="pn-ic">🏋️</span><div><b>Gym</b><p>Vorschläge etwa ${pctL(cb.gym ? cb.gym[0] : cb.f)} % leichter${cb.gym ? steps(cb.gym, pctL) : ''}, dazu ein Satz weniger. Diese Trainings bremsen deine Steigerung nicht.</p></div></div>`
    + (runOn() ? `<div class="pn-item"><span class="pn-ic">🏃</span><div><b>Laufen</b><p>Etwa ${pctR(cb.run ? cb.run[0] : 0.6)} % der geplanten Minuten${cb.run ? steps(cb.run, pctR) : ''}, alles locker in Zone 2. Fühlt es sich schwer an, lieber kürzer.</p></div></div>` : '')
    + `<div class="pn-item"><span class="pn-ic">🍽️</span><div><b>Ernährung</b><p>Genug essen und trinken, Protein hoch halten. ${hard ? 'Nach einer Krankheit braucht der Körper Energie zum Aufbauen.' : ''}</p></div></div>`
    + `<button class="btn-primary" data-act="closeSheet">Los geht’s</button>`), auto ? 900 : 100);
}
function pauseBanner(area) {
  const P = db.settings.pause;
  if (P && P.areas.includes(area)) { const t = PAUSE_TYPES.find(x => x[0] === P.type); return `<section class="notice k-hold pz-banner"><b>${t[1]} ${t[2]} seit ${esc(shortDate(P.from))}</b><p>${area === 'gym' ? 'Dein Wochenziel ist ausgesetzt.' : area === 'tri' ? 'Der Triathlon-Plan ist pausiert, verpasste Einheiten musst du nicht nachholen.' : 'Der Laufplan ist pausiert, verpasste Läufe musst du nicht nachholen.'}</p><div class="bub-act"><button class="btn-chip" data-act="pauseSheet">${P.type === 'sick' ? 'Wieder gesund' : 'Pause beenden'}</button></div></section>`; }
  if (comebackActive()) { const cb = db.settings.comeback; return `<section class="notice k-hold pz-banner"><b>Wiedereinstieg bis ${esc(longDate(cb.until - DAY))}</b><p>${area === 'gym' ? `Diese Woche Vorschläge etwa ${pctL(cbF())} % leichter, ein Satz weniger.` : `Diese Woche etwa ${pctR(cbRun())} % der geplanten Minuten, alles locker in Zone 2.`}</p></section>`; }
  return '';
}

/* ---------- Ernährungs-Coach (Chat im Ernährungs-Tab) ---------- */
function foodContext() {
  const L = [], k = dateKey(Date.now()), today = db.meals.filter(m => dateKey(m.date) === k), N = dayNutri(today), S = foodScore(today), g = db.settings.kcalGoal, mg = db.settings.macroGoal, pr = db.profile;
  if (pr && !pr.skipped) L.push(`Profil: ${pr.sex === 'f' ? 'weiblich' : 'männlich'}, ${pr.age} Jahre, ${pr.height} cm, ${fmtN(pr.weight)} kg, Ziel: ${pr.goal === 'cut' ? 'abnehmen' : pr.goal === 'bulk' ? 'zunehmen' : 'halten'}${db.weightGoal ? `, Zielgewicht ${fmtN(db.weightGoal.target)} kg` : ''}.`);
  L.push(`Tagesziel: ${g ? fmtInt(g) + ' kcal' : 'keins'}${mg ? `, Protein ${mg.p} g, Kohlenhydrate ${mg.c} g, Fett ${mg.f} g` : ''}.`);
  L.push(`Heute bisher (${new Date().getHours()} Uhr): ${fmtInt(N.s.kcal)} kcal, P ${fmtInt(N.s.p)} g, K ${fmtInt(N.s.c)} g, F ${fmtInt(N.s.f)} g, Ballaststoffe ${fmtInt(N.mi.fib)} g, Zucker ${fmtInt(N.mi.sug)} g, Salz ${fmt1(N.mi.salt)} g, Kalium ${fmtInt(N.mi.k)} mg, Magnesium ${fmtInt(N.mi.mg)} mg${S ? `, Essens-Score ${S.val}/100` : ''}.`);
  if (today.length) L.push('Einträge heute: ' + today.map(m => `${SLOT_SHORT[m.slot]}: ${m.name}${m.g ? ` ${fmtInt(m.g)} g` : ''} (${fmtInt(m.kcal)} kcal)`).join('; ') + '.');
  const W = waterStatus(k);
  L.push(`Wasser: ${fmtInt(W.drinks)} ml getrunken, ca. ${fmtInt(W.food)} ml aus Essen, Ziel ${fmtInt(W.goal)} ml${W.extra ? ` (inkl. ${W.extra} ml für Training)` : ''}. Training heute: ${W.T.gymMin ? `Gym ${W.T.gymMin} min` : ''}${W.T.runMin ? ` Laufen ${W.T.runMin} min` : ''}${!W.T.gymMin && !W.T.runMin ? 'keins' : ''}.`);
  const days = [];
  for (let i = 1; i <= 7; i++) { const kk = dateKey(addDays(Date.now(), -i)), l = db.meals.filter(m => dateKey(m.date) === kk); if (l.length) days.push({s: mealSum(l), sc: foodScore(l)}); }
  if (days.length) L.push(`Letzte 7 Tage (${days.length} eingetragen): Ø ${fmtInt(days.reduce((a, d) => a + d.s.kcal, 0) / days.length)} kcal, Ø ${fmtInt(days.reduce((a, d) => a + d.s.p, 0) / days.length)} g Protein${days.some(d => d.sc) ? `, Ø Score ${Math.round(days.filter(d => d.sc).reduce((a, d) => a + d.sc.val, 0) / days.filter(d => d.sc).length)}` : ''}.`);
  const sa = sleepAvg(); if (sa) L.push(`Schlaf Ø ${fmtN(Math.round(sa * 10) / 10)} h.`);
  if (db.settings.pause) L.push(`Status: ${PAUSE_TYPES.find(x => x[0] === db.settings.pause.type)[2]} seit ${shortDate(db.settings.pause.from)}.`);
  const ws = Object.keys(db.weights).sort().slice(-5); if (ws.length) L.push('Gewicht zuletzt: ' + ws.map(x => `${shortDate(keyToTs(x))} ${fmtN(db.weights[x])} kg`).join(', ') + '.');
  return L.join('\n');
}

/* ---------- Großer Pausen-Timer (Vollbild, nach unten wischen = klein) ---------- */
function nextSetInfo() {
  const a = db.active;
  for (let i = 0; i < a.entries.length; i++) {
    const e = a.entries[i];
    if (e.skip) continue;
    const j = e.sets.findIndex(s => !s.done), ex = db.exercises[e.exId];
    if (j >= 0 && ex) { const p = deloadSet(sugFor(suggest(ex), j) || startSet(ex), ex); return `${esc(ex.name)} · Satz ${j + 1}${p ? ` · ${p.w ? fmtN(p.w) + ' kg × ' : ''}${p.r}` : ''}`; }
  }
  return 'Alle Sätze erledigt';
}
function restFullHTML() {
  const a = db.active;
  if (!a || !a.restEnd || a.restMin) return '';
  const left = Math.max(0, Math.ceil((a.restEnd - Date.now()) / 1000));
  return `<div class="rest-full" id="restFull"><div class="rf-grab"></div><button class="rf-min" data-act="restMin">${ICON.down}<span>Kleiner</span></button>`
    + `<p class="rf-lbl">Pause</p><div class="rf-ring">${ringHTML(left / (a.restTotal || 1), 260, 16, `<b id="rfTime">${fmtSec(left)}</b><small>von ${fmtSec(a.restTotal)}</small>`)}</div>`
    + `<p class="rf-next"><span>Als Nächstes</span>${nextSetInfo()}</p>`
    + `<div class="rf-btns"><button data-act="restAdd" data-d="-15">−15 s</button><button data-act="restAdd" data-d="15">+15 s</button></div>`
    + `<button class="btn-primary rf-skip" data-act="restStop">Pause beenden</button></div>`;
}

const mealSum = list => list.reduce((a, m) => ({kcal: a.kcal + (m.kcal || 0), p: a.p + (m.p || 0), c: a.c + (m.c || 0), f: a.f + (m.f || 0)}), {kcal: 0, p: 0, c: 0, f: 0});

/* Kalorien-Karte oben im Ernährungs-Tab: Bogen mit „Übrig“, links gegessen, rechts das Tagesziel, darunter die Makros */
function kcalCard(s, goal, mg) {
  const left = goal ? goal - s.kcal : 0, over = goal && left < 0, p = goal ? clamp(s.kcal / goal, 0, 1) : 0;
  const a = (140 + 260 * p) * Math.PI / 180, dx = (100 + 84 * Math.cos(a)).toFixed(1), dy = (100 + 84 * Math.sin(a)).toFixed(1);
  const arc = 'M35.7 154A84 84 0 1 1 164.3 154';
  const gauge = `<svg class="kc-arc" viewBox="0 0 200 166" aria-hidden="true"><path d="${arc}" pathLength="100" class="kc-track"/>${p > 0 ? `<path d="${arc}" pathLength="100" class="kc-prog" stroke-dasharray="${(p * 100).toFixed(2)} 100"/>` : ''}${goal ? `<circle cx="${dx}" cy="${dy}" r="8" class="kc-dot"/>` : ''}</svg>`;
  const mid = goal ? `<b>${fmtInt(Math.abs(left))}</b><span>${over ? 'Drüber' : 'Übrig'}</span>` : `<b>${fmtInt(s.kcal)}</b><span>kcal heute</span>`;
  const stat = (v, n) => `<div class="kc-st"><b>${v == null ? '–' : fmtInt(v)}</b><span>${n}</span></div>`;
  const mac = (cls, n, v, g) => `<div class="kc-m ${cls}"><span>${n}</span><div class="kbar sm" aria-hidden="true"><i style="width:${Math.min(100, g ? v / g * 100 : 0).toFixed(1)}%"></i></div><b>${fmtInt(v)}${g ? ` / ${fmtInt(g)}` : ''} g</b></div>`;
  return `<section class="goal kc${over ? ' over' : ''}"><div class="sec-row"><p class="goal-lbl">Heute</p><button class="btn-text sm" data-act="nutriSettings">${goal ? 'Ziele' : 'Ziel festlegen'}</button></div>`
    + `<div class="kc-top">${stat(s.kcal, 'Gegessen')}<div class="kc-g">${gauge}<div class="kc-mid">${mid}</div></div>${stat(goal, 'Ziel')}</div>`
    + `<div class="kc-macros">${mac('kc-c', 'Kohlenhydrate', s.c, mg && mg.c)}${mac('kc-p', 'Protein', s.p, mg && mg.p)}${mac('kc-f', 'Fett', s.f, mg && mg.f)}</div></section>`;
}
