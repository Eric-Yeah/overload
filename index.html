<style>
:root{
  --bg:#000;--surface:#1C1C1E;--surface-2:#2C2C2E;--surface-3:#3A3A3C;
  --sep:rgba(84,84,88,.55);
  --text:#fff;--text-2:#8E8E93;--text-3:#5E5E63;
  --lime:#A7F432;--lime-dim:rgba(167,244,50,.16);
  --cyan:#3DDCEB;--cyan-dim:rgba(61,220,235,.14);
  --amber:#FFB340;--amber-dim:rgba(255,179,64,.15);
  --green:#30D158;--green-dim:rgba(48,209,88,.16);
  --red:#FF453A;
  --pink:#FF375F;
  --strava:#FC4C02;--on-strava:#fff;
  --on-accent:#000;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Die App ist bewusst nur dunkel – gleiche Tokens in jedem Modus */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0}
button:disabled{opacity:.3;cursor:default}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
h1,h2,h3,p{margin:0}

#app{width:100%;min-width:0;max-width:560px;margin:0 auto;padding:0 16px 104px}
body.wk #app{padding-bottom:48px}

/* Große Titel wie in iOS */
.lt{padding:18px 4px 14px}
.lt .date{color:var(--text-2);font-size:14px;font-weight:600}
.lt h1{margin-top:2px;font-size:34px;line-height:41px;font-weight:800;letter-spacing:-.022em}

.sec{margin-top:30px}
.sec.first{margin-top:6px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between}
.sec-h{margin:0 4px 10px;font-size:22px;font-weight:700;letter-spacing:-.012em}

/* Wochenring */
.week{display:flex;align-items:center;gap:20px;padding:20px;background:var(--surface);border-radius:24px}
.ringwrap{position:relative;flex:none}
.ringwrap svg{display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--num);line-height:1}
.ring-c b{font-size:34px;font-weight:700}
.ring-c small{margin-top:3px;font-size:13px;color:var(--text-2);font-weight:600}
.week-txt{min-width:0}
.week-txt h2{font-size:15px;color:var(--text-2);font-weight:600}
.week-txt .big{margin:3px 0 12px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;gap:22px}
.stats span{display:block;font-size:12px;color:var(--text-2);font-weight:500}
.stats b{font-family:var(--num);font-size:18px;font-weight:700;color:var(--lime)}

/* Laufendes Training */
.banner{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:12px;padding:14px 16px;border-radius:16px;background:var(--lime-dim);text-align:left}
.banner .t{flex:1;min-width:0}
.banner .t b{display:block;font-size:16px}
.banner .t span{font-family:var(--num);font-size:14px;color:var(--lime);font-variant-numeric:tabular-nums}
.banner-cta{font-weight:700;color:var(--lime);font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(167,244,50,.55)}70%{box-shadow:0 0 0 9px rgba(167,244,50,0)}100%{box-shadow:0 0 0 0 rgba(167,244,50,0)}}

/* Als Nächstes */
.next{padding:20px 18px 18px;background:var(--surface);border-radius:20px}
.next h2{font-size:30px;font-weight:800;letter-spacing:-.022em}
.next .muted{margin:3px 0 14px;color:var(--text-2);font-size:15px}
.plan{list-style:none;margin:0 0 14px;padding:0}
.plan li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:.5px solid var(--sep);font-size:16px}
.plan li:first-child{border-top:0}
.chip{flex:none;font-family:var(--num);font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--k);background:var(--kd);white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-4px 0 16px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--k)}

/* Kategorie-Farben der Vorschläge */
.k-up{--k:var(--lime);--kd:var(--lime-dim)}
.k-reps{--k:var(--cyan);--kd:var(--cyan-dim)}
.k-hold{--k:#D1D1D6;--kd:rgba(209,209,214,.1)}
.k-down{--k:var(--amber);--kd:var(--amber-dim)}
.k-none{--k:var(--text-2);--kd:rgba(142,142,147,.12)}

/* Gruppierte Listen */
.group{background:var(--surface);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 16px;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:17px;font-weight:500}
.row .t span{display:block;margin-top:1px;font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{color:var(--text-2);font-size:15px;white-space:nowrap}
.chev{color:var(--text-3);display:flex}
.plus-ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--lime-dim);color:var(--lime)}
.lime-t{color:var(--lime)}
.red-t{color:var(--red)}
.row-tools{display:flex;gap:6px}
.mini{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--text)}
.mini.danger{color:var(--red)}

/* Buttons */
.btn-primary,.btn-secondary,.btn-danger{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:700}
.btn-primary{background:var(--lime);color:var(--on-accent)}
.btn-secondary{background:var(--surface-2);color:var(--lime);font-weight:600}
.btn-danger{background:rgba(255,69,58,.16);color:var(--red)}
.btn-primary:active,.btn-secondary:active,.btn-danger:active{opacity:.75}
.btn-text{padding:8px 2px;color:var(--lime);font-size:17px}
.skip-line{display:block;margin:8px auto 0;font-size:15px}
#sheet .days button{background:var(--surface-2)}
#sheet .days button.on{background:var(--lime-dim)}
.btn-text.strong{font-weight:700}
.btn-text.sm{font-size:15px}
.btn-text.danger{color:var(--red)}
.btn-text.muted{color:var(--text-2)}
.wide{width:100%}
.mt{margin-top:14px}
.pill{height:36px;padding:0 18px;border-radius:999px;background:var(--lime);color:var(--on-accent);font-weight:700;font-size:15px}
.icon-btn{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}

/* Aktives Training */
.wk-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:10px 16px;background:rgba(0,0,0,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.wk-title{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.wk-title h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-title p{font-family:var(--num);font-size:14px;font-weight:600;color:var(--lime);font-variant-numeric:tabular-nums}
.wk-title>div{min-width:0}
@media (max-width:400px){.wk-title>.ringwrap{display:none}.wk-head{gap:8px}}

.ex{margin-bottom:12px;padding:16px 14px 12px;background:var(--surface);border-radius:20px}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-head>div{flex:1;min-width:0}
.ex h2{font-size:20px;font-weight:700;letter-spacing:-.012em}
.meta{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--text-2)}
.sug{display:flex;align-items:baseline;gap:12px;margin:12px 0 2px;padding:11px 13px;border-radius:13px;background:var(--kd)}
.sug-badge{flex:none;font-family:var(--num);font-size:18px;font-weight:800;color:var(--k)}
.sug-note{font-size:14px;line-height:1.3;color:#E5E5EA}

.set-h,.set{display:grid;grid-template-columns:32px minmax(0,1fr) 68px 56px 40px;gap:7px;align-items:center}
.set-h{padding:12px 4px 4px;font-size:12px;font-weight:600;color:var(--text-2)}
.set-h span:nth-child(1),.set-h span:nth-child(n+3){text-align:center}
.set{padding:4px;border-radius:12px;transition:background-color .2s}
.set .n{font-family:var(--num);font-weight:700;color:var(--text-2);text-align:center}
.set .last{font-family:var(--num);font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.num{width:100%;height:42px;border:0;border-radius:10px;background:var(--surface-2);text-align:center;font-family:var(--num);font-size:18px;font-weight:700;color:var(--text);outline:none;-webkit-appearance:none;appearance:none;font-variant-numeric:tabular-nums}
.num::placeholder{color:var(--k);opacity:.8}
.num:focus{box-shadow:inset 0 0 0 2px var(--k)}
.chk{justify-self:center;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-3)}
.set.done{background:var(--lime-dim)}
.set.done .num{background:transparent}
.set.done .chk{background:var(--lime);color:var(--on-accent)}
.set-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set-actions .btn-chip{white-space:nowrap}
@media (max-width:360px){.hide-sm{display:none}}
.btn-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600}
.btn-chip.muted{color:var(--text-2)}
.wk-foot{margin-top:6px;display:flex;flex-direction:column;gap:6px;align-items:center}

/* Verlauf */
.month{margin:26px 4px 10px;font-size:22px;font-weight:700;letter-spacing:-.012em}
.month:first-of-type{margin-top:4px}
.sess{margin-bottom:12px;padding:16px;background:var(--surface);border-radius:18px}
.sess-h{display:flex;align-items:flex-start;gap:10px}
.sess-h>div{flex:1;min-width:0}
.sess-h h2{font-size:19px;font-weight:700}
.sess-h p{margin-top:2px;font-size:13px;color:var(--text-2)}
.sess-stats{display:flex;gap:22px;margin:12px 0 10px}
.sess-stats span{display:block;font-size:12px;color:var(--text-2)}
.sess-stats b{font-family:var(--num);font-size:17px;font-weight:700;color:var(--lime)}
.sess-ex{list-style:none;margin:0;padding:0}
.sess-ex li{padding:8px 0;border-top:.5px solid var(--sep)}
.sess-ex li span{display:block;font-size:15px}
.sess-ex li span+span{margin-top:1px;font-family:var(--num);font-size:14px;color:var(--text-2)}

.empty{padding:40px 12px;text-align:center;color:var(--text-2)}
.empty p{margin:0 auto 18px;max-width:30ch}
.demo-card{margin-top:12px;padding:16px;border-radius:16px;border:1px dashed var(--surface-3)}
.demo-card p{margin-bottom:12px;font-size:15px;color:var(--text-2)}
.warn{margin:0 4px 10px;font-size:14px;color:var(--amber)}
.foot{margin:10px 4px 0;font-size:13px;color:var(--text-2)}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(22,22,24,.84);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tabbar[hidden]{display:none}
.tabbar-inner{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--text-2);font-size:10.5px;font-weight:600}
.tab.on{color:var(--lime)}

/* Sheets */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.grabber{width:36px;height:5px;margin:0 auto 12px;border-radius:3px;background:var(--surface-3)}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}
.sheet-h h2{font-size:17px;font-weight:700;text-align:center}
.sheet-h>:first-child{justify-self:start}
.sheet-h>:last-child{justify-self:end}
.sheet .group{background:var(--surface-2)}
.sheet button.row:active{background:var(--surface-3)}
.lbl{display:block;margin:0 4px 6px;font-size:13px;font-weight:600;color:var(--text-2)}
.field{display:block;width:100%;height:48px;margin-bottom:18px;padding:0 14px;border:0;border-radius:12px;background:var(--surface-2);font-size:17px;outline:none}
.field:focus{box-shadow:inset 0 0 0 2px var(--lime)}
.area{height:170px;padding:12px 14px;resize:none;font:16px/1.4 ui-monospace,Menlo,monospace}
.hint{margin:6px 4px 16px;font-size:13px;line-height:1.4;color:var(--text-2)}
.hint.center{text-align:center;margin:18px 0}
.stepper{flex:none;display:flex;align-items:center;border-radius:10px;background:var(--surface-3);overflow:hidden}
.group .stepper{background:var(--surface-3)}
.stepper button{width:42px;height:34px;font-size:21px;line-height:1}
.stepper b{min-width:30px;text-align:center;font-family:var(--num);font-size:17px}
.seg{display:flex;gap:2px;padding:2px;margin-bottom:8px;border-radius:10px;background:var(--surface-2)}
.seg button{flex:1;height:34px;border-radius:8px;font-family:var(--num);font-size:14px;font-weight:700;color:var(--text-2)}
.seg button.on{background:var(--surface-3);color:var(--text)}

.ask{padding:4px 2px 0;text-align:center}
.ask h2{margin:2px 0 6px;font-size:20px;font-weight:700}
.ask p{margin-bottom:18px;font-size:15px;color:var(--text-2)}
.ask-btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}

.fin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.fin-stats div{padding:12px 6px;border-radius:14px;background:var(--surface-2);text-align:center}
.fin-stats span{display:block;font-size:12px;color:var(--text-2)}
.fin-stats b{font-family:var(--num);font-size:19px;color:var(--lime)}
.prs{margin-bottom:14px;padding:12px 14px;border-radius:14px;background:var(--lime-dim);text-align:left}
.prs h3{margin-bottom:6px;font-size:15px;color:var(--lime)}
.prs p{display:flex;justify-content:space-between;gap:10px;margin:0;padding:3px 0;font-size:15px;color:var(--text)}
.prs b{font-family:var(--num)}
.toggle-row{margin-bottom:14px;border-radius:14px;background:var(--surface-2)}
.toggle-row .t span{white-space:normal}
.switch{flex:none;position:relative;width:51px;height:31px;border-radius:999px;background:var(--surface-3);transition:background-color .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--lime)}
.switch.on::after{transform:translateX(20px)}

.prog{margin-top:22px}
.prog-stats{display:flex;gap:24px;margin:0 4px 12px}
.prog-stats span{display:block;font-size:12px;color:var(--text-2)}
.prog-stats b{font-family:var(--num);font-size:19px}
.spark{display:block;width:100%;height:auto;border-radius:14px;background:var(--surface-2)}
.ch{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ch-info{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;min-height:22px;margin:0 2px 8px}
.ch-info b{font-size:15px;font-weight:700;color:var(--text)}
.ch-info span{font-family:var(--num);font-size:14px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
.ch-col{fill:var(--text);opacity:.12}
.ch-sel{fill:none;stroke:var(--text);stroke-width:1.6}
.ch-ln{stroke:var(--text-2);stroke-width:1;stroke-dasharray:3 3}
.ch-dot{fill:var(--surface-2);stroke:var(--text);stroke-width:2.2}
.ch-rng{margin-bottom:10px}
.ld-w.sel .ld-bars i:not(.plan){outline:2px solid var(--text);outline-offset:1px}
.ld-w.sel span{color:var(--text)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;transform:translate(-50%,-150%);padding:10px 18px;border-radius:999px;background:var(--surface-3);font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.toast.show{transform:translate(-50%,0)}

/* Laufen */
.goal{padding:20px;background:var(--surface);border-radius:24px}
.goal-lbl{font-size:15px;font-weight:600;color:var(--text-2)}
.goal-main{display:flex;align-items:flex-end;gap:12px;margin-top:4px}
.goal-days{font-family:var(--num);font-size:64px;font-weight:800;line-height:.9;letter-spacing:-.03em;color:var(--lime);font-variant-numeric:tabular-nums}
.goal-unit{padding-bottom:3px;font-size:17px;font-weight:700;line-height:1.2}
.goal-sub{margin-top:8px;font-size:14px;color:var(--text-2)}
.plan-bar{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin:18px 0 8px}
.plan-bar i{height:10px;border-radius:3px;background:var(--pc);opacity:.22}
.plan-bar i.past{opacity:1}
.plan-bar i.now{opacity:1;box-shadow:0 0 0 2px #fff}
.plan-cap{font-size:13px;color:var(--text-2)}
.goal-next{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--sep);font-size:15px}
.goal-next span{color:var(--text-2)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;background:var(--cyan-dim);color:var(--cyan)}
.t-long{background:var(--lime-dim);color:var(--lime)}
.t-tempo{background:var(--amber-dim);color:var(--amber)}
.t-race{background:rgba(255,69,58,.18);color:var(--red)}
.t-deload{background:rgba(209,209,214,.12);color:#D1D1D6}
.srow{align-items:center}
.sday{flex:none;width:36px;text-align:center}
.sday b{display:block;font-size:17px}
.sday span{display:block;font-size:12px;color:var(--text-2)}
.srow .t .tag{margin-bottom:4px}
.srow .t .stext{font-size:16px}
.srow.done .chk{background:var(--lime);color:var(--on-accent)}
.notice{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--kd)}
.notice b{display:block;margin-bottom:3px;color:var(--k)}
.notice p{font-size:14px;line-height:1.4;color:#E5E5EA}
.plan-note{margin:0 0 16px}
.plan-note .tag{margin-bottom:6px}
.chart-leg{margin:10px 4px 0}
.legend i.sq{border-radius:2px}
.ph-strip{display:flex;gap:6px;margin-bottom:18px}
.ph-seg{flex:1;min-width:0}
.ph-seg i{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ph-seg u{display:block;height:100%;border-radius:3px;background:var(--pc)}
.ph-seg b{display:block;margin-top:7px;overflow:hidden;font-size:13px;white-space:nowrap;text-overflow:ellipsis;color:var(--text-2)}
.ph-seg span{display:block;font-size:11px;color:var(--text-3)}
.ph-seg.on b{color:var(--pc)}
.ph-seg.done b{color:var(--text)}
.pw{position:relative;padding-left:28px;margin-bottom:10px}
.pw::before{content:'';position:absolute;left:8px;top:32px;bottom:-12px;width:2px;border-radius:1px;background:var(--surface-2)}
.pw:last-child::before{display:none}
.pw.past::before{background:var(--pc);opacity:.45}
.pw-dot{position:absolute;left:0;top:16px;display:grid;place-items:center;width:18px;height:18px;border:2px solid var(--pc);border-radius:50%;background:var(--bg);color:#000;font-size:9px}
.pw-dot svg{width:11px;height:11px;stroke-width:3.4}
.pw.past .pw-dot,.pw.now .pw-dot{background:var(--pc)}
.pw.now .pw-dot::after{content:'';position:absolute;inset:-6px;border:2px solid var(--pc);border-radius:50%;opacity:.35}
.pw-card{padding:14px 16px 8px;border-radius:18px;background:var(--surface)}
.pw.now .pw-card{box-shadow:inset 0 0 0 1.5px var(--pc)}
.pw.past .pw-card{opacity:.75}
.pw-h{display:flex;align-items:baseline;gap:8px}
.pw-h b{font-size:17px}
.pw-d{font-size:13px;color:var(--text-2)}
.pw-h em{margin-left:auto;font-family:var(--num);font-size:17px;font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}
.pw-h em small{font-size:12px;font-weight:600;color:var(--text-2)}
.pw-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}
.pw-ph,.pw-tg{position:relative;isolation:isolate;padding:2px 8px;border-radius:999px;font-size:12px;font-style:normal;font-weight:700}
.pw-ph{color:var(--pc)}
.pw-ph::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--pc);opacity:.16}
.pw-tg{background:var(--surface-2);color:var(--text-2)}
.pw-tg.now{background:var(--lime);color:var(--on-accent)}
.pw-cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-2)}
.pw-cnt.ok{color:var(--lime)}
.pw-vol{height:4px;margin:12px 0 4px;overflow:hidden;border-radius:2px;background:var(--surface-2)}
.pw-vol i{display:block;height:100%;border-radius:2px;background:var(--pc)}
.pw ul{margin:0;padding:0;list-style:none}
.pw li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:.5px solid var(--sep)}
.pw li:first-child{border-top:0}
.pw-day{flex:none;width:28px;line-height:1.15;text-align:center}
.pw-day b{display:block;font-size:14px}
.pw-day small{font-size:11px;color:var(--text-2)}
.pw-tx{flex:1;min-width:0;font-size:14px;line-height:1.3}
.pw-tx em{display:block;margin-bottom:1px;font-size:11px;font-style:normal;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cyan)}
.pw-tx .ty-long{color:var(--lime)}
.pw-tx .ty-tempo{color:var(--amber)}
.pw-tx .ty-race{color:var(--red)}
.pw-m{flex:none;font-family:var(--num);font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.pw-m small{font-size:11px;font-weight:600;color:var(--text-2)}
.pw-ok{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--on-accent)}
.pw-ok svg{width:14px;height:14px}
.pw li.ok .pw-tx{color:var(--text-2)}
.pw li.miss{opacity:.45}
.pl-grp{margin:20px 0 10px 28px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pc)}
.pl-grp:first-child{margin-top:0}
.field.note{height:auto;min-height:84px;padding:12px 14px;line-height:1.4;resize:none;font-size:16px}
.field.note.big{min-height:150px}
.sess-note{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.4;color:var(--text-2)}
.locker{display:inline-flex;align-items:center;gap:8px;height:38px;margin:-6px 0 16px;padding:0 14px;border-radius:999px;background:var(--surface);font-size:15px;font-weight:600;color:var(--text-2)}
.locker.on{background:var(--lime-dim);color:var(--text)}
.locker b{font-family:var(--num);font-size:17px;color:var(--lime)}
.lk-ic{font-size:15px}
.wk-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.wk-info .locker{margin:0}
.wk-est{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;color:var(--text-2)}
.wk-est svg{width:16px;height:16px}
.lock-in{font-family:var(--num);font-size:28px;font-weight:800;text-align:center;letter-spacing:.1em;height:64px}
.est-row{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.est-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--lime-dim);color:var(--lime)}
.est-ic svg{width:18px;height:18px}
.est-row b{display:block;font-family:var(--num);font-size:18px}
.est-row span{font-size:13px;color:var(--text-2)}
.prop-l{margin:6px 0 12px;padding:0;list-style:none}
.prop-l li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:.5px solid var(--sep)}
.prop-l li:first-child{border-top:0}
.prop-l b{font-size:13px;color:var(--text-2)}
.prop-l span{font-size:15px;line-height:1.35}
.tri-split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri-split>div{padding:12px;border-radius:16px;background:var(--surface)}
.tri-split span{display:block;font-size:12px;font-weight:600;color:var(--c)}
.tri-split b{display:block;margin-top:4px;font-family:var(--num);font-size:17px}
.tri-split small{font-size:11px;color:var(--text-2)}
.tri-split .kbar i{background:var(--c)}
.tt-swim{background:var(--cyan-dim);color:var(--cyan)}
.tt-bike,.tt-test{background:var(--amber-dim);color:var(--amber)}
.tt-run,.tt-brick{background:var(--green-dim);color:var(--green)}
.tt-race{background:rgba(255,69,58,.18);color:var(--red)}
.pw-tx .ty-bike,.pw-tx .ty-test{color:var(--amber)}
.pw-tx .ty-run,.pw-tx .ty-brick{color:var(--green)}
.ai-stat{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface-2)}
.ai-stat.on{background:var(--lime-dim)}
.ai-stat b{display:block;font-size:16px}
.ai-stat span{font-size:13px;line-height:1.4;color:var(--text-2)}
.gg-step{margin-bottom:22px}
.gg-h{display:flex;align-items:center;gap:10px}
.gg-n{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--on-accent);font-size:14px;font-weight:800}
.gg-h b{font-size:17px}
.gg-step>p{margin:6px 0 10px 36px;font-size:14px;line-height:1.4;color:var(--text-2)}
.gg-shot{margin-left:36px;overflow:hidden;border:1px solid var(--surface-3);border-radius:14px;background:var(--surface)}
.gg-bar{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--surface-2)}
.gg-bar i{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}
.gg-bar span{flex:1;margin-left:6px;padding:3px 8px;border-radius:6px;background:var(--surface);font-size:11px;color:var(--text-2)}
.gg-body{padding:14px}
.gg-login,.gg-dlg{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.gg-login b,.gg-dlg b{font-size:14px}
.gg-btn,.gg-in,.gg-key{padding:8px 10px;border:1px solid var(--surface-3);border-radius:8px;font-size:12px;text-align:center}
.gg-in,.gg-key{text-align:left;font-family:ui-monospace,Menlo,monospace}
.gg-side{display:flex;flex-direction:column;gap:4px}
.gg-side span{padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text-2)}
.gg-shot .hl{border-color:var(--lime);background:var(--lime-dim);color:var(--text);font-weight:700;box-shadow:0 0 0 2px var(--lime-dim)}
.gg-link{margin:10px 0 0 36px}
.gg-acts{display:grid;gap:8px}
.idea-l{display:grid;gap:10px;margin-top:12px}
.idea{padding:12px;border-radius:14px;background:var(--surface-2)}
.idea div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.idea b{font-size:15px}
.idea p{margin-top:4px;font-size:14px;line-height:1.4;color:var(--text-2)}
.ef-klein{background:var(--lime-dim);color:var(--lime)}
.ef-mittel{background:var(--amber-dim);color:var(--amber)}
.ef-groß{background:rgba(255,69,58,.18);color:var(--red)}
.idea-t{white-space:normal!important;color:var(--text)!important;font-size:15px!important;margin:2px 0}
.tour{position:fixed;inset:0;z-index:300}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.66);transition:all .25s ease;pointer-events:none}
.tour-tip{position:fixed;left:16px;right:16px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.tour-n{font-size:12px;font-weight:700;color:var(--lime)}
.tour-tip>b{display:block;margin-top:2px;font-size:19px}
.tour-tip>p:not(.tour-n){margin-top:6px;font-size:15px;line-height:1.4;color:var(--text-2)}
.tour-nav{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour-nav span{flex:1}
.tour-nav .btn-chip.on{background:var(--lime);color:var(--on-accent)}
.sy-code{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:4px;padding:16px;border-radius:16px;background:var(--surface-2)}
.sy-code b{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.03em}
.sy-code .btn-chip{background:var(--surface-3);color:var(--lime)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg.pain{gap:1px}
.seg.pain button{padding:0;font-size:13px}
.seg.pain button.on.hi{background:var(--amber);color:#000}

/* Gewicht */
.wt-today{padding:18px 20px;background:var(--surface);border-radius:24px}
.wt-today .lbl{margin-left:0}
.wt-today .hint{margin:4px 0 0}
.wt-row{display:flex;align-items:center;gap:8px}
.wt-in{flex:1;min-width:0;height:66px;text-align:right;padding:0;border:0;background:none;outline:none;font-family:var(--num);font-size:54px;font-weight:800;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.wt-in::placeholder{color:var(--text-3)}
.wt-unit{margin-right:6px;font-size:20px;font-weight:700;color:var(--text-2)}
.verdict{padding:18px;border-radius:22px;background:var(--kd)}
.v-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.v-pct{font-family:var(--num);font-size:42px;font-weight:800;letter-spacing:-.02em;color:var(--k)}
.v-lbl{font-size:13px;color:var(--text-2)}
.verdict h2{margin-top:6px;font-size:22px;font-weight:800}
.verdict p{margin-top:4px;font-size:15px;line-height:1.4;color:#E5E5EA}
.v-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.v-stats div{padding:10px;border-radius:12px;background:rgba(0,0,0,.35)}
.v-stats span{display:block;font-size:11px;color:var(--text-2)}
.v-stats b{font-family:var(--num);font-size:15px}
.verdict .v-note{margin-top:10px;font-size:13px;color:var(--text-2)}
.cur-week{margin:10px 4px 0;font-size:14px;color:var(--text-2)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 span{display:block;font-size:12px;color:var(--text-2)}
.g3 b{font-family:var(--num);font-size:20px;font-weight:800}
.g3 div:first-child b{color:var(--lime)}
.wk-avg{text-align:right}
.wk-avg b{display:block;font-family:var(--num);font-size:17px}
.wk-avg span{font-family:var(--num);font-size:13px;color:var(--text-2)}
.num-r{font-family:var(--num);font-weight:700;color:var(--text)!important}

/* Essen */
.kbar{height:8px;margin-top:12px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.kbar i{display:block;height:100%;border-radius:4px;background:var(--lime)}
.goal.over .goal-days{color:var(--amber)}
.goal.over .kbar i{background:var(--amber)}
.goal .goal-unit{line-height:1.15}
.food-name{margin:0 4px 16px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.calc4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px;padding:12px;border-radius:14px;background:var(--surface-2)}
.calc4 span{display:block;font-size:12px;color:var(--text-2)}
.calc4 b{font-family:var(--num);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.calc4 div:first-child b{color:var(--lime)}
.res-lbl{margin-top:14px}
.seg.slots button{font-family:var(--font);font-size:14px}
label.row{cursor:pointer}
input[type=search]{-webkit-appearance:none;appearance:none}
.choice{display:block;width:100%;margin-bottom:10px;padding:16px 18px;border-radius:16px;background:var(--surface);text-align:left;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}
.choice:active{background:var(--surface-2)}
.choice.on{box-shadow:inset 0 0 0 2px var(--lime)}
.choice b{display:block;font-size:17px;font-weight:600}
.choice span{display:block;margin-top:3px;font-size:14px;line-height:1.35;color:var(--text-2)}
.ob-bar{margin:0 4px 18px}
.ob-sub{margin:0 4px 18px;font-size:15px;line-height:1.45;color:var(--text-2)}
.ob-ic{display:grid;place-items:center;width:96px;height:96px;margin:28px auto 32px;border-radius:28px;background:var(--lime-dim);color:var(--lime)}
.ob-ic svg{width:48px;height:48px}
.calc4.cols3{grid-template-columns:repeat(3,1fr)}
.calc4 small{display:block;margin-top:1px;font-size:12px;color:var(--text-2)}
.goal .calc4{background:rgba(255,255,255,.04)}
.mbars{display:grid;gap:12px;margin-top:16px}
.kc-top{--gw:min(172px,45vw);display:grid;grid-template-columns:1fr var(--gw) 1fr;margin-top:4px}
.kc-st{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(var(--gw) * .17);text-align:center}
.kc-st b{display:block;font-family:var(--num);font-size:clamp(16px,5.6vw,22px);font-weight:800;font-variant-numeric:tabular-nums}
.kc-st span{font-size:clamp(11px,3.4vw,13px);color:var(--text-2)}
.kc-g{position:relative}
.kc-arc{display:block;width:100%;overflow:visible}
.kc-arc path{fill:none;stroke-width:12;stroke-linecap:round}
.kc-track{stroke:var(--surface-2)}
.kc-prog{stroke:var(--lime)}
.kc-dot{fill:var(--lime);stroke:var(--surface);stroke-width:3}
.kc.over .kc-prog,.kc.over .kc-dot{stroke:var(--amber)}
.kc.over .kc-dot{fill:var(--amber);stroke:var(--surface)}
.kc-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:calc(var(--gw) * .17)}
.kc-mid b{font-family:var(--num);font-size:clamp(26px,9.6vw,36px);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kc-mid span{margin-top:4px;font-size:14px;color:var(--text-2)}
.kc.over .kc-mid b{color:var(--amber)}
.kc-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.kc-m{min-width:0;text-align:center}
.kc-m span{display:block;overflow:hidden;font-size:13px;white-space:nowrap;text-overflow:ellipsis;color:var(--text-2)}
.kc-m .kbar{margin-top:8px}
.kc-m b{display:block;margin-top:7px;font-family:var(--num);font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.kc .kc-m.kc-p .kbar i{background:var(--lime)}
.kc .kc-m.kc-c .kbar i{background:var(--cyan)}
.kc .kc-m.kc-f .kbar i{background:var(--amber)}
.kc-st b,.kc-mid b{line-height:1.05}
.mb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--text-2)}
.mb-h b{font-family:var(--num);font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.kbar.sm{height:6px;margin-top:6px}
.mbars .mc i{background:var(--cyan)}
.mbars .mf i{background:var(--amber)}
.adv{margin-bottom:8px}
.adv summary{margin:0 4px 12px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
.scan{position:relative;margin-bottom:14px;overflow:hidden;border-radius:14px;background:var(--surface-2)}
.scan img{display:block;width:100%;max-height:240px;object-fit:cover;transition:filter .3s}
.scan.busy img{filter:brightness(.55) saturate(.7)}
.scan.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(167,244,50,.16),transparent 45%);animation:pulse 1.6s ease-in-out infinite alternate}
.scan-line{position:absolute;left:0;right:0;top:0;z-index:1;height:2px;background:var(--lime);box-shadow:0 0 18px 6px rgba(167,244,50,.45);animation:scan 1.8s ease-in-out infinite alternate}
.scan-c{position:absolute;z-index:1;width:24px;height:24px;border:3px solid var(--lime);animation:pulse 1.2s ease-in-out infinite alternate}
.sc1{top:12px;left:12px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.sc2{top:12px;right:12px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.sc3{bottom:12px;left:12px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.sc4{bottom:12px;right:12px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scan-status{display:flex;align-items:center;justify-content:center;margin:6px 0 18px;font-size:16px;font-weight:600}
#aiStatus.fade{animation:fadein .4s ease-out}
.dots{display:inline-flex;gap:4px;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--lime);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
.skel{height:48px;margin-bottom:14px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.skel.short{width:60%}
@keyframes scan{from{top:0}to{top:calc(100% - 2px)}}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.three .lbl{white-space:nowrap}
.btn-secondary:disabled{opacity:.6}

/* Navigation: Segmente, Unterseiten, Sperre */
.top-seg{margin:14px 0 0}
.top-seg button{font-family:var(--font);font-size:15px}
.back-link{display:inline-flex;align-items:center;gap:2px;margin:0 0 4px -6px;padding:4px 0;color:var(--lime);font-size:17px}
.ic-box{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--lime)}
.ic-box svg{width:19px;height:19px}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--text-2);font-size:15px}
.lock svg{margin-top:-2px}

/* Lauf-Fragebogen */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.days button{height:50px;border-radius:12px;background:var(--surface);font-size:15px;font-weight:700;color:var(--text-2);box-shadow:inset 0 0 0 2px transparent}
.days button.on{background:var(--lime-dim);color:var(--text);box-shadow:inset 0 0 0 2px var(--lime)}
.btn-primary+.btn-secondary{margin-top:10px}
.btn-strava{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:700;background:var(--strava);color:var(--on-strava);text-decoration:none}
.btn-strava:active{opacity:.75}
.sv-pw{margin:18px 0 4px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--strava)}
.perf{display:block;width:100%;padding:14px 16px;border-radius:16px;background:var(--surface);text-align:left;color:var(--text)}
.perf:active{opacity:.75}
.perf-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.pc{display:block;min-width:0}
.pc em{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--text-2)}
.pc b{display:block;margin-top:2px;font-family:var(--num);font-size:clamp(18px,5.8vw,22px);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.pc small{display:block;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pc.hl b{color:var(--lime)}
.perf-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-top:11px;border-top:1px solid var(--sep);font-size:13px;color:var(--text-2)}
.perf-f>span:last-child{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.pf-hero{text-align:center;padding:4px 0 16px}
.pf-hero b{display:block;margin:4px 0;font-family:var(--num);font-size:60px;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.pf-hero small{display:block;font-size:13px;color:var(--text-2)}
.pf-t{font-family:var(--num);font-size:19px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rt-clock{margin:26px 0 14px;text-align:center;font-family:var(--num);font-size:clamp(64px,24vw,104px);font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.rt-dists{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.rt-d{padding:9px 14px;border-radius:999px;background:var(--surface-2);color:var(--text);font-size:15px;font-weight:600}
.rt-d.on{background:var(--lime);color:var(--on-accent)}
.rt-prev{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--lime-dim);font-size:14px;line-height:1.4}
.rt-prev:empty{display:none}
.rt-prev b{display:block;font-family:var(--num);font-size:20px;color:var(--lime)}
.rt-prev span{color:var(--text-2)}
.two-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two-btn .btn-secondary{font-size:15px;padding:0 6px;cursor:pointer}
.tag.sv-beta{background:rgba(252,76,2,.15);color:var(--strava)}
.sv-note{display:block;width:100%;text-align:left;font:inherit;color:inherit}
.row.wrap .t span{white-space:normal}

/* Heute */
.banner+.hc,.banner+.hring,.banner+.tiles{margin-top:0}
.hc{margin-bottom:12px;background:var(--surface);border-radius:20px;overflow:hidden}
.hc-top{padding:14px 16px 12px;cursor:pointer}
.hc-top:active{background:var(--surface-2)}
.hc-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--c);font-size:15px}
.hc-h b{flex:1}
.hc-ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.hc-ic svg{width:16px;height:16px}
.hc-b{display:flex;align-items:center;gap:14px}
.hc-txt{min-width:0}
.hv{font-family:var(--num);font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hv.txt{font-family:var(--font);font-size:21px;font-weight:700;letter-spacing:-.01em}
.hu{margin-left:6px;font-size:15px;font-weight:600;color:var(--text-2)}
.hc-s{margin-top:2px;font-size:14px;line-height:1.35;color:var(--text-2)}
.hc-x{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:0 16px 14px}
.hc-x .btn-chip{color:var(--c)}
.hc-note{font-size:13px;color:var(--text-2)}
.hms{display:grid;gap:6px;width:100%}
.hm{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.hm .kbar{margin:0}
.hm b{font-family:var(--num);font-size:12px;color:var(--text)}
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text-2)}
.wd i{width:26px;height:26px;border-radius:50%;background:var(--surface-2)}
.wd i.g{background:var(--lime)}
.wd i.r{background:var(--cyan)}
.wd i.g.r{background:linear-gradient(135deg,var(--lime) 50%,var(--cyan) 50%)}
.wd.today span{color:var(--text)}
.wd.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text-2)}
.wd.future i{opacity:.45}
.wleg{margin:2px 0 0}
.hring{display:flex;align-items:center;gap:18px;padding:18px;background:var(--surface);border-radius:24px}
.hr-svg{flex:none}
.hr-leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.hr-row{display:grid;text-align:left}
.hr-t{font-size:13px;font-weight:700;color:var(--c)}
.hr-v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-v .hv{font-size:22px}
.hr-v .hu{font-size:13px}
.hr-s{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .hc-ic{width:30px;height:30px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:row dense;gap:10px}
.tile{min-width:0;padding:14px;border-radius:18px;background:var(--surface);cursor:pointer}
.tile:active{background:var(--surface-2)}
.tile.wide{grid-column:span 2}
.tl-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--c)}
.tl-h .hc-ic{width:22px;height:22px;border-radius:7px}
.tl-h .hc-ic svg{width:14px;height:14px}
.tl-v{margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .hv{font-size:28px}
.tile .hv.txt{font-size:18px;white-space:normal}
.tile .hu{display:block;margin:2px 0 0;font-size:13px}
.tile .tl-v{white-space:normal}
.tl-s{margin-top:2px;font-size:12px;line-height:1.3;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .kbar{margin-top:10px}
.tile .wdots{margin-top:12px}
.sw-btn{display:flex;margin-left:4px}
.wk-pad{padding-top:14px}
.wk-pad .hc-h{width:100%;margin-bottom:2px}

/* Essen: Mahlzeiten */
.meals{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:22px}
.meal{padding:14px 14px 12px;border-radius:20px;background:var(--surface)}
.meal-h{display:flex;align-items:center;gap:12px}
.meal-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.meal-t{flex:1;min-width:0}
.meal-t b{display:block;font-size:18px;font-weight:700}
.meal-t span{display:block;margin-top:1px;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-add{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#000}
.meal-add:active{opacity:.75}
.meal-bar{margin:12px 0 2px}
.meal-bar i{background:var(--c)}
.meal-list{margin-top:8px;border-top:.5px solid var(--sep)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 2px;text-align:left;border-bottom:.5px solid var(--sep)}
.mi:last-child{border-bottom:0;padding-bottom:2px}
.mi .t{flex:1;min-width:0}
.mi .t b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .t span{display:block;font-size:12px;color:var(--text-2)}
.mi-k{font-family:var(--num);font-size:16px;font-weight:700;white-space:nowrap}
.mi-k small{font-size:12px;color:var(--text-2);font-weight:600}
.meal-idea{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--surface-2);color:var(--c);font-size:14px;font-weight:600}

/* Rezepte */
.fchips{display:flex;gap:8px;margin:0 -16px 10px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--text-2);font-size:15px;font-weight:600}
.fchip.on{background:var(--text);color:var(--bg)}
.rc-count{margin:14px 4px 10px;font-size:13px;font-weight:600;color:var(--text-2)}

/* Barcode-Scanner */
.scanbox{position:relative;overflow:hidden;margin-bottom:8px;border-radius:14px;background:#000;aspect-ratio:4/3}
.scanbox video{display:block;width:100%;height:100%;object-fit:cover}
.scan-guide{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:2px solid var(--lime);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-laser{position:absolute;left:11%;right:11%;top:50%;height:2px;background:var(--red);box-shadow:0 0 8px var(--red)}
.bc-row{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.bc-row .field{flex:1;min-width:0;margin-bottom:0}
.bc-row .pill{flex:none;height:48px;border-radius:12px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
/* Rezepte */
.fchip{display:inline-flex;align-items:center;gap:6px}

.rc-count{align-items:center}

.kcbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.kcbar button{height:50px;border-radius:12px;background:var(--surface);font-family:var(--num);font-size:16px;font-weight:800;line-height:1.05;color:var(--text-2);box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c) 60%,transparent)}
.kcbar button small{display:block;margin-top:2px;font-size:11px;font-weight:600;opacity:.8}

.rfeat{margin-bottom:14px}

.rf-left{flex:none;margin-right:4px;font-size:13px;font-weight:600;color:var(--text-2)}
.rscroll{display:flex;gap:10px;margin:0 -16px;padding:2px 16px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}

.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rcard{display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:var(--surface);text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s}
.rcard:active{transform:scale(.97)}
.rcard.big{flex:none;width:200px;scroll-snap-align:start}
.rc-hero{position:relative;display:grid;place-items:center;height:96px;background:radial-gradient(120% 95% at 30% 15%,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 72%)}

.rc-emo{font-size:46px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}

.rc-fav.on{color:var(--pink)}

.rc-n{display:-webkit-box;overflow:hidden;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere;font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.01em;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rc-k{display:flex;flex-wrap:wrap;gap:0 10px;margin-top:auto;font-size:12px;color:var(--text-2)}
.rc-k b{font-family:var(--num);font-size:15px;color:var(--text)}
.rc-k span:first-child b{color:var(--c)}
.rc-d{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.dots3{display:inline-flex;gap:3px}
.dots3 i{width:6px;height:6px;border-radius:50%;background:var(--surface-3)}
.dots3 i.on{background:var(--c,var(--lime))}
.rd-hero{display:grid;place-items:center;height:124px;margin:0 0 14px;border-radius:20px;background:radial-gradient(120% 100% at 30% 15%,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 75%)}

.rd-por span{font-size:13px;color:var(--text-2)}

.rd-cnt{margin-right:4px;font-family:var(--num);font-size:13px;font-weight:700;color:var(--text-2)}

.step .sn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-family:var(--num);font-size:14px;font-weight:800}

.st-ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,149,0,.22);color:#FF9F0A}
.st-ic svg{width:28px;height:28px;fill:currentColor}
.streak.off .st-ic{background:var(--surface-2);color:var(--text-3)}
.st-t{flex:1;min-width:0}
.st-t b{display:block;font-family:var(--num);font-size:20px;font-weight:800}
.st-t span{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--text-2)}
.st-best{flex:none;text-align:center}
.st-best span{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.st-best b{font-family:var(--num);font-size:22px;font-weight:800}
.seg.mini{width:auto;min-width:176px;margin:0}
.seg.mini button{height:34px;font-size:14px}
input[type=date].field,input[type=time].field{-webkit-appearance:none;appearance:none;display:flex;align-items:center;min-width:0;max-width:100%;line-height:48px;text-align:left;color:var(--text)}
input[type=date].field::-webkit-date-and-time-value,input[type=time].field::-webkit-date-and-time-value{margin:0;text-align:left;line-height:48px;min-height:48px}
input[type=date].field::-webkit-calendar-picker-indicator,input[type=time].field::-webkit-calendar-picker-indicator{opacity:.55;margin-left:auto}
.lbl.mt{margin-top:18px}
.sh-code{margin:6px 0 14px;padding:18px 12px;border-radius:16px;background:var(--surface-2);text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:clamp(30px,10vw,40px);font-weight:700;letter-spacing:.12em;color:var(--lime)}
.sh-in{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.15em;text-align:center;text-transform:uppercase}
.sh-sum{font-family:var(--num);font-size:14px;font-weight:700;color:var(--text-2)}
.sh-ex{padding:8px 0;border-top:.5px solid var(--sep)}
.sh-ex b{display:block;font-size:15px;font-weight:600}
.sh-ex span{display:block;margin-top:1px;font-family:var(--num);font-size:14px;color:var(--text-2)}
.sub-lt{margin:4px 0 0;font-size:14px;color:var(--text-2)}
.focus-more{display:block;width:100%;margin:-4px 0 6px;padding:6px 0;font-size:14px;font-weight:600;color:var(--lime);text-align:left}
.fh-stats{margin:10px 0 12px;padding:12px 14px;border-radius:14px;background:var(--surface)}
.fh-stats small{font-size:12px;font-weight:600;color:var(--text-2)}
.fcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cd-h{padding-bottom:2px;font-size:11px;font-weight:700;text-align:center;color:var(--text-2)}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:48px;border-radius:12px;background:var(--surface);font-family:var(--num)}
.cd.out{background:none;font-size:12px;color:var(--text-3)}
.cd-n{font-size:13px;font-weight:700;line-height:1}
.cd-k{min-height:10px;font-size:10.5px;font-weight:700;line-height:1;opacity:.9}
.cd.s-none .cd-n{color:var(--text-2)}
.cd.s-hit{background:color-mix(in srgb,var(--lime) 22%,var(--surface));color:var(--lime)}
.cd.s-under{background:color-mix(in srgb,var(--cyan) 18%,var(--surface));color:var(--cyan)}
.cd.s-over{background:color-mix(in srgb,var(--amber) 20%,var(--surface));color:var(--amber)}
.cd.today{box-shadow:inset 0 0 0 2px var(--text)}
.cd:active{opacity:.7}
.fh-leg{margin:10px 4px 0}
.fh-row{--c:var(--lime)}
.fh-row.s-under{--c:var(--cyan)}
.fh-row.s-over{--c:var(--amber)}
.fh-row .wk-avg span{color:var(--c)}
.fh-bar{position:relative;display:block;height:4px;margin-top:7px;border-radius:2px;background:var(--surface-2)}
.fh-bar>i{display:block;height:100%;border-radius:2px;background:var(--c)}
.fh-bar em{position:absolute;top:-2px;width:2px;height:8px;background:var(--text-2)}
.fd-sum{--c:var(--lime);margin-bottom:16px;padding:14px;border-radius:16px;background:var(--surface-2)}
.fd-sum.s-under{--c:var(--cyan)}
.fd-sum.s-over{--c:var(--amber)}
.fd-sum .goal-days{color:var(--c)}
.fd-sum .kbar{margin-top:12px}
.fd-sum .kbar i{background:var(--c)}
.fd-slot{margin-bottom:12px}
.fd-h{display:flex;align-items:center;gap:10px;margin:0 4px 8px}
.fd-h b{flex:1;font-size:16px}
.fd-h>span:last-child{font-family:var(--num);font-size:14px;font-weight:700;color:var(--text-2)}
.meal-ic.sm{width:30px;height:30px;border-radius:9px}
.meal-ic.sm svg{width:18px;height:18px}
.fd-add{display:flex;flex-wrap:wrap;gap:8px}
.fd-hint{margin-top:-10px}

/* Gym: Fragebogen und KI-Coach */
.days.five{grid-template-columns:repeat(5,1fr)}
.ic-box.ai{background:linear-gradient(135deg,var(--lime),var(--cyan));color:var(--on-accent)}
body.chat #app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:0}
body.chat .chat{flex:1 0 auto;min-height:0}
.coach-head{margin-bottom:10px}
.ch-t{display:flex;flex:1;align-items:center;gap:10px;min-width:0}
.ch-av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--lime),var(--cyan));color:var(--on-accent)}
.ch-av svg{width:20px;height:20px}
.ch-t h1{margin:0;font-size:17px;font-weight:700}
.ch-t p{margin:0;font-size:13px;color:var(--text-2)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 230px);min-height:calc(100dvh - 230px);padding:4px 0 16px}
.bub{max-width:88%;padding:11px 14px;border-radius:20px;font-size:16px;line-height:1.42;animation:fadein .25s ease-out}
.bub p{margin:0}
.bub.ai{align-self:flex-start;border-bottom-left-radius:6px;background:var(--surface)}
.bub.user{align-self:flex-end;border-bottom-right-radius:6px;background:var(--lime);color:var(--on-accent)}
.bub.wide{width:100%;max-width:100%}
.bub.err{box-shadow:inset 0 0 0 1px var(--red)}
.bub .btn-chip{margin-top:10px}
.bub .field{margin:12px 0 10px;background:var(--surface-2)}
.bub .btn-primary{margin-bottom:0}
.bub-act{display:flex;flex-wrap:wrap;gap:8px}
.bub-act .btn-chip{color:var(--lime)}
.bub-act .btn-chip.muted{color:var(--text-2)}
.typing{display:flex;gap:5px;padding:15px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--text-2);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
.pcard{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.pc-h b{display:block;font-size:17px}
.pc-h span{font-size:13px;color:var(--text-2)}
.pc-t{margin-top:14px}
.pc-t>b{display:block;margin-bottom:2px;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--lime)}
.pc-t ul{margin:0;padding:0;list-style:none}
.pc-t li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:.5px solid var(--sep);font-size:14px}
.pc-t li:first-child{border-top:0}
.pc-t li>span{min-width:0}
.pc-t li .tag{margin-left:6px;padding:1px 6px;font-size:10px;vertical-align:1px;background:var(--lime-dim);color:var(--lime)}
.pc-t em{flex:none;font-style:normal;font-family:var(--num);color:var(--text-2)}
.pcard .btn-primary{margin-top:14px}
.pc-ok{display:flex;align-items:center;gap:6px;margin:14px 0 0;font-weight:700;color:var(--lime)}
.composer{position:sticky;bottom:0;z-index:30;margin:0 -16px;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--sep);background:rgba(0,0,0,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.ctips{margin-bottom:8px}
.ctips .fchip{font-size:14px}
.cmp-row{display:flex;align-items:flex-end;gap:8px}
.cmp-row textarea{flex:1;min-width:0;min-height:40px;max-height:140px;padding:9px 14px;border:0;border-radius:20px;background:var(--surface);color:var(--text);font:16px/1.35 var(--font);resize:none;outline:none}
.send{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--on-accent)}
/* Lebensmittel-Suche (großes Fenster) */
.sheet.tall{height:92vh;height:92dvh;max-height:none}
.fs-slot{margin-bottom:12px}
.fs-search{margin-bottom:12px;background:var(--surface-2)}
.fs-count{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;font-family:var(--num);font-weight:800;color:var(--lime)}
.fs-count svg{width:16px;height:16px}
.fs-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:4px}
.ds-in{height:110px;font:16px/1.4 var(--font)}
.ds-row{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--lime-dim);color:var(--lime);font-size:15px;font-weight:600;text-align:left}
.ds-row svg{flex:none;width:18px;height:18px}
.ds-busy{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0 16px;font-size:15px;font-weight:600;color:var(--text-2)}
.fs-act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.fs-act>span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--lime-dim);color:var(--lime)}
.fs-act svg{width:18px;height:18px}
.fs-act:active{opacity:.7}
.res-lbl{align-items:center;margin-top:16px}
.res-lbl .lbl{margin-bottom:6px}
.frow{display:flex;align-items:center;border-top:.5px solid var(--sep)}
.frow:first-child{border-top:0}
.frow-main{display:flex;flex:1;align-items:center;min-width:0;min-height:56px;padding:9px 8px 9px 16px;text-align:left}
.frow-main .t{flex:1;min-width:0}
.frow-main .t b{display:block;overflow:hidden;font-size:16px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
.frow-main .t span{display:block;margin-top:1px;font-size:13px;color:var(--text-2)}
.frow-main:active{background:var(--surface-3)}
.fadd{flex:none;width:34px;height:34px;margin-right:12px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--on-accent);transition:transform .12s}
.fadd:active{transform:scale(.88)}
.fadd.done{background:var(--lime-dim);color:var(--lime)}
.fadd.big{width:40px;height:40px;margin:0 14px 0 0}

/* Eigene Gerichte */
.dlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:4px}
.dcard{display:flex;align-items:center;border-radius:18px;background:var(--surface)}
.dc-main{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0;padding:14px 10px 14px 16px;text-align:left}
.dc-main b{font-size:17px;font-weight:700}
.dc-ing{overflow:hidden;font-size:13px;color:var(--text-2);text-overflow:ellipsis;white-space:nowrap}
.dc-nut{font-size:13px;color:var(--text-2)}
.dc-nut em{font-family:var(--num);font-size:16px;font-style:normal;font-weight:800;color:var(--lime)}
.di-row{gap:8px;padding-right:8px}
.di-g{width:66px;height:36px;padding:0 8px;border:0;border-radius:10px;background:var(--surface-3);color:var(--text);font:600 16px var(--num);text-align:right;outline:none}
.di-u{font-size:14px;color:var(--text-2)}
.icon-btn.sm{width:30px;height:30px}
.dish-sum{margin-top:-10px}

/* Erscheinungsbild */
.th-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:4px}
.th-tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.th-tile b{font-weight:600}
.th-prev{display:flex;flex-direction:column;gap:4px;width:100%;aspect-ratio:3/4;padding:8px 6px;border-radius:14px;background:var(--tb);box-shadow:inset 0 0 0 1px var(--sep)}
.th-prev i{height:12px;border-radius:4px;background:var(--ts)}
.th-prev i:nth-child(2){height:20px}
.th-prev i.acc{width:60%;height:8px;margin-top:auto;background:var(--lime)}
.th-prev.auto{background:linear-gradient(135deg,#F2F2F7 50%,#000 50%)}
.th-prev.auto i:not(.acc){background:rgba(128,128,128,.45)}
.th-tile.on .th-prev{box-shadow:inset 0 0 0 1px var(--sep),0 0 0 2.5px var(--lime)}
.th-acc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.th-acc button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text-2)}
.th-acc i{width:40px;height:40px;border-radius:50%;background:var(--a)}
.th-acc button.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--a)}
.th-acc button.on{color:var(--text)}
.th-demo{padding:14px;border-radius:14px;background:var(--surface-2)}
.th-demo .btn-primary{margin-bottom:12px;pointer-events:none}

/* Graphit: dunkel, aber weicher als Schwarz */
:root[data-theme="graphite"]{--bg:#1C1C1E;--surface:#2C2C2E;--surface-2:#3A3A3C;--surface-3:#48484A;--sep:rgba(99,99,102,.6)}
:root[data-theme="graphite"] .wk-head,:root[data-theme="graphite"] .composer{background:rgba(28,28,30,.88)}
:root[data-theme="graphite"] .tabbar{background:rgba(38,38,40,.88)}
/* Hell */
:root[data-theme="light"]{--green:#1E8E3E;--green-dim:rgba(30,142,62,.12);--bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#EDEDF0;--surface-3:#DCDCE1;--sep:rgba(60,60,67,.2);--text:#000;--text-2:#6C6C70;--text-3:#AEAEB2;--cyan:#0892A5;--cyan-dim:rgba(8,146,165,.13);--amber:#D97706;--amber-dim:rgba(217,119,6,.14);--red:#E5332A;--pink:#E0244B;color-scheme:light}
:root[data-theme="light"] body::before{background:#1C1C1E}
:root[data-theme="light"] .wk-head,:root[data-theme="light"] .composer{background:rgba(242,242,247,.88)}
:root[data-theme="light"] .tabbar{background:rgba(250,250,252,.9)}
:root[data-theme="light"] .backdrop{background:rgba(0,0,0,.3)}
:root[data-theme="light"] .toast{box-shadow:0 8px 24px rgba(0,0,0,.14)}
:root[data-theme="light"] .v-stats div{background:rgba(0,0,0,.05)}
:root[data-theme="light"] .goal .calc4{background:rgba(0,0,0,.04)}
:root[data-theme="light"] .plan-bar i.now{box-shadow:0 0 0 2px #000}
:root[data-theme="light"] .pw-ph,:root[data-theme="light"] .pl-grp,:root[data-theme="light"] .ph-seg.on b,:root[data-theme="light"] .pw-tx em{filter:brightness(.55) saturate(1.5)}
:root[data-theme="light"] .switch::after{box-shadow:0 2px 6px rgba(0,0,0,.2)}
:root[data-theme="light"] .streak{background:linear-gradient(135deg,rgba(255,149,0,.2),rgba(255,55,95,.08))}
:root[data-theme="light"] .sheet{box-shadow:0 -8px 30px rgba(0,0,0,.08)}
:root[data-theme="light"] .meal-add,:root[data-theme="light"] .fchip[style].on,:root[data-theme="light"] .seg.pain button.on.hi{color:#fff}
/* Neuigkeiten und Tutorial */
.ld-gauge{position:relative;height:10px;border-radius:6px;background:var(--surface-3);margin:14px 0 6px}
.ld-gauge .z{position:absolute;top:0;bottom:0;opacity:.9}
.ld-gauge .lo{background:var(--cyan);border-radius:6px 0 0 6px}.ld-gauge .ok{background:var(--green)}.ld-gauge .hi{background:var(--amber)}.ld-gauge .vh{background:var(--red);border-radius:0 6px 6px 0}
.ld-gauge b{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.ld-lab{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.ld-weeks{display:flex;gap:6px}
.ld-w{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.ld-bars{display:flex;flex-direction:column-reverse;height:96px;gap:1px}
.ld-bars i{display:block;border-radius:5px;background:var(--surface-3)}

.rpe{display:flex;gap:4px}

.rpe button.on{background:var(--lime);color:var(--on-accent)}
.rpe button.est{outline:2px dashed var(--text-3);outline-offset:-2px}
.sl-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 4px}
.sl-t{padding:12px;border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.sl-t span{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-2)}
.sl-t b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.sl-t small{font-size:12px;color:var(--text-2)}
.sl-chart{position:relative;margin:6px 0 4px}
.sl-bars{display:flex;gap:4px;height:130px}
.sl-b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0;border-radius:8px}
.sl-b i{display:block;width:100%;border-radius:5px 5px 2px 2px;min-height:3px}
.sl-b span{height:18px;font-size:11px;font-weight:600;color:var(--text-2)}
.sl-b{height:100%}
.sl-b.sel{background:var(--surface-2);outline:2px solid var(--lime);outline-offset:-1px}
.sl-goal{position:absolute;left:0;right:0;border-top:1px dashed var(--text-3);pointer-events:none}
.sl-times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl-q{display:flex;gap:8px}
.sl-q button{flex:1;height:48px;border-radius:14px;background:var(--surface-2);font-size:24px}
.sl-q button.on{outline:2px solid var(--lime);background:var(--lime-dim)}
.wd i.o{background:var(--amber)}
.xa-add{margin:0 0 14px}
.xa-chips{display:flex;flex-wrap:wrap;gap:8px}
.xa-chips button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface-2);font-size:15px;font-weight:600}
.xa-chips button span{font-size:18px}
.xa-sel{margin-bottom:4px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--lime-dim)}
.xa-sel span{font-size:28px}.xa-sel b{flex:1;font-size:18px}.xa-sel button{font-size:14px;font-weight:700;color:var(--lime)}
.xa-info{margin:6px 0 4px}.xa-info p{margin:4px 2px;font-size:14px;color:var(--text-2)}.xa-info b{color:var(--text)}
.xa-h{text-align:left;flex:1;min-width:0}.xa-h h2{margin:0}.xa-h p{margin:2px 0 0}
.xa-x{margin:0 0 6px}
.fr-av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;background:hsl(var(--h) 65% 55% / .28);color:hsl(var(--h) 85% 72%)}
.fr-av.me{background:var(--lime-dim);color:var(--lime)}
.fr-av.sm{width:34px;height:34px;font-size:14px}
.fr-c{position:relative;margin:0 0 10px;padding:14px 14px 12px 18px;border-radius:20px;background:var(--surface);overflow:hidden}
.fr-c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.fr-h{display:flex;align-items:center;gap:11px}
.fr-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fr-who b{font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fr-who span{font-size:13px;color:var(--text-2)}
.fr-you{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.fr-ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.fr-t{margin:12px 0 6px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.fr-s{display:flex;gap:22px;margin:2px 0 2px}

.fr-r button.on{background:var(--lime-dim);box-shadow:inset 0 0 0 2px var(--lime)}
.fr-r button.on i{color:var(--lime)}
.fr-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--sep)}
.fr-rn{font-size:14px;color:var(--text)}.fr-rn.mute{color:var(--text-3)}
.fr-hide{flex:none;font-size:13px;font-weight:600;color:var(--text-2)}
.fr-day{margin:20px 4px 8px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}

.fr-hero-t b small{font-size:18px;font-weight:700;color:var(--text-2)}
.fr-rank{display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:16px;background:var(--surface-2)}
.fr-rank>span{font-size:26px}.fr-rank b{font-size:15px;line-height:1.2}.fr-rank small{font-size:12px;color:var(--text-2)}
.fr-hero-s{display:flex;gap:14px;margin-top:6px;font-size:14px;font-weight:600;color:var(--text-2)}
